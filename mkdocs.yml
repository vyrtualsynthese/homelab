# Configuration for the docs site the homelab builder renders from this repository.
# The builder uses this file verbatim, so the navigation below is the site's navigation.
#
# The nav grows stage by stage. A page is listed here only once it exists, because MkDocs warns on
# a nav entry that points at a missing file — and on the site that entry is an empty tab.
#
# The body of every page also has to render on GitHub: blockquotes, never `!!!` admonitions.

site_name: AshuLab homelab
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: en
  # The builder serves the identity at /brand/, and injects the link into every
  # page of a site whose own config it does not control. Declared here as well so
  # the file says what the site looks like.
  logo: /brand/ashulab-badge-transparent.svg
  favicon: /brand/ashulab-badge.svg
  font: false # no Google Fonts request from an intranet page
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    scheme: slate
    primary: black # /brand/ashulab.css sets the brand navy #0B1220
    accent: cyan # and the brand cyan #2DD4FF

extra_css:
  - /brand/ashulab.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

validation:
  nav:
    omitted_files: ignore

nav:
  - Start here: README.md
  - How it works:
      - how-it-works/README.md
      - The shape and why: how-it-works/the-shape-and-why.md
      - Nodes: how-it-works/nodes.md
      - GitOps: how-it-works/gitops.md
      - Storage: how-it-works/storage.md
      - Network: how-it-works/network.md
      - Identity: how-it-works/identity.md
      - Observability: how-it-works/observability.md
      - Media: how-it-works/media.md
      - Applications: how-it-works/applications.md
  - Running it:
      - running-it/README.md
      - What is broken right now: status.md
      - Every day: running-it/every-day.md
      - Ship a change: running-it/ship-a-change.md
      - Roll back: running-it/roll-back.md
      - Add an application: running-it/add-an-application.md
      - Fix a pending pod: running-it/fix-a-pending-pod.md
      - Rotate a secret: running-it/rotate-a-secret.md
      - Use the board: running-it/use-the-board.md
      - Rebuild the docs site: running-it/rebuild-the-docs-site.md
      - Disaster recovery: running-it/disaster-recovery.md
  - Reference:
      - reference/README.md
      - Routes: reference/routes.md
      - SSO applications: reference/sso-applications.md
      - Chart notes: reference/chart-notes.md
      - Chart sizing: reference/chart-sizing.md
      - Metrics: reference/metrics.md
      - Alerts: reference/alerts.md
      - Dashboards: reference/dashboards.md
      - Secrets: secrets.md
      - qBittorrent Web UI stalls: qbittorrent-webui-stalls.md
  - Runbooks:
      - runbooks/README.md
      - Wire an application to authentik: runbooks/authentik-apps.md
      - The internal CA: runbooks/internal-ca.md
      - Add a database: runbooks/postgres-add-database.md
      - Restore a database: runbooks/postgres-restore.md
      - The alert relay: runbooks/alert-relay.md
      - The board's database: runbooks/vikunja-database.md
      - First start of the board: runbooks/vikunja-first-start.md
      - Shape the board: runbooks/vikunja-board-seed.md
      - The books cutover: runbooks/books-cutover.md
      - First run of the docs site: runbooks/docs-site-first-run.md
  - History:
      - Decisions: decisions/README.md
      - nuc0 throttling: decisions/2026-11-13-nuc0-throttling-accepted.md
      - streaming overheating: decisions/2026-11-13-streaming-overheating-deferred.md
      - Retiring seven applications: decisions/2026-11-18-retire-seven-applications.md
      - Longhorn leftovers: cleanup/longhorn-disposition.md
      - Audits: audit/README.md
      - Ansible and hosts: audit/ansible-hosts.md
      - ArgoCD and Helm: audit/argocd-helm.md
      - Observability and storage: audit/observability-storage.md
  - Agent work:
      - How to read a plan: agent-work.md
      - The board protocol: agent-protocol.md
