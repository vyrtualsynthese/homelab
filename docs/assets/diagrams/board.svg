<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">The board, column by column</title>
  <desc id="desc">A wireframe of the six board columns with the cards each may hold and who moves them. Only tasks go to Doing and Validation; a refusal moves a task back to Doing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="580" fill="#f8fafc"/>
  <text x="30" y="38" font-size="24" font-weight="700" fill="#0f172a">The board, column by column</text>
  <text x="30" y="66" font-size="14" fill="#475569">Six columns. Only tasks go to Doing and Validation; features and stories stay in the other four.</text>

  <!-- Idea -->
  <g>
    <rect x="30" y="100" width="160" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <rect x="30" y="100" width="160" height="6" rx="3" fill="#64748b"/>
    <text x="46" y="132" font-size="15" font-weight="700" fill="#0f172a">Idea</text>
    <rect x="46" y="150" width="128" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="58" y="176" font-size="12" fill="#475569">feature</text>
    <rect x="46" y="204" width="128" height="42" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <text x="58" y="230" font-size="12" fill="#475569">story</text>
    <text x="46" y="380" font-size="11" fill="#64748b">operator or agent</text>
  </g>
  <!-- Shaping -->
  <g>
    <rect x="205" y="100" width="160" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <rect x="205" y="100" width="160" height="6" rx="3" fill="#8b5cf6"/>
    <text x="221" y="132" font-size="15" font-weight="700" fill="#0f172a">Shaping</text>
    <rect x="221" y="150" width="128" height="42" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-dasharray="3 3"/>
    <text x="233" y="176" font-size="12" fill="#5b21b6">feature</text>
    <rect x="221" y="204" width="128" height="42" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-dasharray="3 3"/>
    <text x="233" y="230" font-size="12" fill="#5b21b6">story</text>
    <text x="221" y="380" font-size="11" fill="#64748b">operator only</text>
  </g>
  <!-- Backlog -->
  <g>
    <rect x="380" y="100" width="160" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <rect x="380" y="100" width="160" height="6" rx="3" fill="#0ea5e9"/>
    <text x="396" y="132" font-size="15" font-weight="700" fill="#0f172a">Backlog</text>
    <rect x="396" y="150" width="128" height="42" rx="6" fill="#eff6ff" stroke="#bae6fd" stroke-dasharray="3 3"/>
    <text x="408" y="176" font-size="12" fill="#0c4a6e">feature</text>
    <rect x="396" y="204" width="128" height="42" rx="6" fill="#eff6ff" stroke="#bae6fd" stroke-dasharray="3 3"/>
    <text x="408" y="230" font-size="12" fill="#0c4a6e">task</text>
    <rect x="396" y="258" width="128" height="42" rx="6" fill="#eff6ff" stroke="#bae6fd" stroke-dasharray="3 3"/>
    <text x="408" y="284" font-size="12" fill="#0c4a6e">task</text>
    <text x="396" y="380" font-size="11" fill="#64748b">operator or agent</text>
  </g>
  <!-- Doing -->
  <g>
    <rect x="555" y="100" width="160" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <rect x="555" y="100" width="160" height="6" rx="3" fill="#22c55e"/>
    <text x="571" y="132" font-size="15" font-weight="700" fill="#0f172a">Doing</text>
    <rect x="571" y="150" width="128" height="42" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-dasharray="3 3"/>
    <text x="583" y="176" font-size="12" fill="#14532d">task</text>
    <text x="571" y="380" font-size="11" fill="#64748b">agent</text>
  </g>
  <!-- Validation -->
  <g>
    <rect x="730" y="100" width="160" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <rect x="730" y="100" width="160" height="6" rx="3" fill="#f59e0b"/>
    <text x="746" y="132" font-size="15" font-weight="700" fill="#0f172a">Validation</text>
    <rect x="746" y="150" width="128" height="42" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-dasharray="3 3"/>
    <text x="758" y="176" font-size="12" fill="#78350f">task</text>
    <text x="746" y="380" font-size="11" fill="#64748b">agent</text>
  </g>
  <!-- Done -->
  <g>
    <rect x="905" y="100" width="160" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <rect x="905" y="100" width="160" height="6" rx="3" fill="#10b981"/>
    <text x="921" y="132" font-size="15" font-weight="700" fill="#0f172a">Done</text>
    <rect x="921" y="150" width="128" height="42" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-dasharray="3 3"/>
    <text x="933" y="176" font-size="12" fill="#064e3b">feature</text>
    <rect x="921" y="204" width="128" height="42" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-dasharray="3 3"/>
    <text x="933" y="230" font-size="12" fill="#064e3b">task</text>
    <text x="921" y="380" font-size="11" fill="#64748b">operator only</text>
  </g>

  <!-- flow -->
  <g>
    <rect x="30" y="424" width="300" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="44" y="451" font-size="12" fill="#334155">Operator: Idea → Shaping → Backlog</text>
    <line x1="330" y1="446" x2="360" y2="446" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="365" y="424" width="330" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="379" y="451" font-size="12" fill="#334155">Agent: Backlog → Doing → Validation</text>
    <line x1="695" y1="446" x2="725" y2="446" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="730" y="424" width="335" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="744" y="451" font-size="12" fill="#334155">Operator: Validation → Done</text>
    <line x1="748" y1="480" x2="690" y2="480" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <text x="760" y="485" font-size="11" fill="#b91c1c">a refusal: one comment, back to Doing</text>
  </g>

  <text x="30" y="520" font-size="12" fill="#334155">A task is the only card in Doing and Validation; a feature or story there would duplicate its children.</text>
  <text x="30" y="542" font-size="12" fill="#334155">No Blocked column: a task that cannot finish stays in Doing with a comment naming the blocker.</text>
  <text x="30" y="564" font-size="11" fill="#64748b">A subtask is a checklist line inside a task, never a card.</text>
</svg>
