<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Two storage worlds</title>
  <desc id="desc">Configuration claims live on local-path, one node's disk each, while the media library lives on NFS exports served by nas. Claims stuck Terminating after Longhorn are not all inert.</desc>
  <rect width="1000" height="600" fill="#f8fafc"/>
  <text x="40" y="40" font-size="24" font-weight="700" fill="#0f172a">Two storage worlds</text>
  <text x="40" y="68" font-size="14" fill="#475569">Configuration is small and node-bound. The library is large and shared from nas over NFS.</text>

  <!-- config panel -->
  <rect x="40" y="100" width="440" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="132" font-size="17" font-weight="700" fill="#0f172a">Configuration · local-path</text>
  <text x="60" y="152" font-size="12" fill="#475569">one directory on one node's disk</text>

  <g>
    <rect x="60" y="170" width="185" height="66" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="76" y="194" font-size="14" font-weight="600" fill="#14532d">nas</text>
    <text x="76" y="214" font-size="11" fill="#166534">&lt;app&gt;-config · 128Mi</text>
  </g>
  <g>
    <rect x="260" y="170" width="185" height="66" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="276" y="194" font-size="14" font-weight="600" fill="#14532d">nuc0</text>
    <text x="276" y="214" font-size="11" fill="#166534">&lt;app&gt;-config · 128Mi</text>
  </g>
  <g>
    <rect x="60" y="250" width="185" height="66" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="76" y="274" font-size="14" font-weight="600" fill="#14532d">streaming</text>
    <text x="76" y="294" font-size="11" fill="#166534">&lt;app&gt;-config · 128Mi</text>
  </g>
  <g>
    <rect x="260" y="250" width="185" height="66" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="276" y="274" font-size="14" font-weight="600" fill="#14532d">rbp2</text>
    <text x="276" y="294" font-size="11" fill="#166534">control plane only</text>
  </g>

  <text x="60" y="354" font-size="12" fill="#334155">WaitForFirstConsumer: the first pod decides the node.</text>
  <text x="60" y="374" font-size="12" fill="#334155">A pin added later does not move the volume.</text>
  <text x="60" y="400" font-size="11" fill="#64748b">Sizes are 128Mi unless the app writes book-sized data.</text>

  <!-- NFS panel -->
  <rect x="520" y="100" width="440" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="540" y="132" font-size="17" font-weight="700" fill="#0f172a">Library · NFS classes</text>
  <text x="540" y="152" font-size="12" fill="#475569">one class per export, served by nas</text>

  <rect x="540" y="168" width="400" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="556" y="195" font-size="13" font-weight="600" fill="#1e3a8a">nas · /mnt/storage/nfs/*</text>

  <g fill="#ffffff" stroke="#bae6fd">
    <rect x="540" y="230" width="190" height="34" rx="6"/>
    <rect x="750" y="230" width="190" height="34" rx="6"/>
    <rect x="540" y="272" width="190" height="34" rx="6"/>
    <rect x="750" y="272" width="190" height="34" rx="6"/>
    <rect x="540" y="314" width="190" height="34" rx="6"/>
    <rect x="750" y="314" width="190" height="34" rx="6"/>
  </g>
  <g font-size="12" fill="#0c4a6e">
    <text x="554" y="252">nfs-plex</text>
    <text x="764" y="252">nfs-audio</text>
    <text x="554" y="294">nfs-books</text>
    <text x="764" y="294">qbittorrent-download</text>
    <text x="554" y="336">nfs-syncthing</text>
    <text x="764" y="336">stash-nfs</text>
  </g>
  <text x="540" y="378" font-size="12" fill="#334155">Immediate binding: the class names an export, not a node.</text>
  <text x="540" y="398" font-size="11" fill="#64748b">traefik-nfs holds the ACME store; plex-media and nfs-ssd are strays.</text>

  <!-- warning -->
  <rect x="40" y="460" width="920" height="86" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="60" y="488" font-size="15" font-weight="700" fill="#78350f">Longhorn is gone; its claims are not</text>
  <text x="60" y="511" font-size="12" fill="#92400e">Claims stuck Terminating look broken, but they are not all inert: the ones still mounted by a running app hold its configuration.</text>
  <text x="60" y="532" font-size="12" fill="#92400e">Clearing a finalizer on one of those stops the app and loses its config. The status page names the apps.</text>

  <text x="40" y="578" font-size="12" fill="#64748b">Config claims stay on the node their pod is pinned to; media classes point at nas.</text>
</svg>
