address=/livebox.local/192.168.1.1
# Two internal zones during the soak: `kub.internal` is what every route serves from 2026-11-27,
# `kub.local` stays for the edge Pi names and for the wildcard redirect that keeps old URLs alive.
address=/kub.local/192.168.1.46
address=/kub.internal/192.168.1.46
# The two VPN panels are served by the Pis themselves, because the panel has to
# answer when the cluster is down; the name has to win over the wildcard above,
# and dnsmasq matches the longest suffix. Port 8443, since Pi-hole owns 80/443
# on these hosts.
address=/vpn-rbp0.kub.local/192.168.1.22
address=/vpn-rbp1.kub.local/192.168.1.38
# Pi-hole's own TLS names. The cluster's exporter dials them instead of the bare
# addresses, so the certificate it verifies can carry a name; the wildcard above
# would send it to the router, and the longest suffix wins. Port 443, where
# Pi-hole serves its panel and API.
address=/pihole-rbp0.kub.local/192.168.1.22
address=/pihole-rbp1.kub.local/192.168.1.38
address=/rbp0.local/192.168.1.22
address=/rbp1.local/192.168.1.38
address=/kub.home.ashudev.com/192.168.1.46
address=/.ashudev.com/192.168.1.46
local-ttl=86400
