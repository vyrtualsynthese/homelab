services:
  pihole:
    container_name: pihole
    image: jacklul/pihole:2026.11.0
    network_mode: host
    # Two files, in this order. pihole.settings is rendered from the template and
    # byte-identical on both Pis; pihole.env holds the panel password and stays
    # on the host. A key in both is won by the later file, i.e. the secret.
    env_file:
      - "./pihole.settings"
      - "./pihole.env"
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
      - './etc-pihole-updatelists/pihole-updatelists.conf:/etc/pihole-updatelists.conf'
    cap_add:
      - NET_ADMIN # Required if you are using Pi-hole as your DHCP server, else not needed
    restart: unless-stopped
  wg-easy:
    # 15 keeps its settings — host, port, DNS, allowed IPs, peers — in its own
    # SQLite database under ./config, not in an environment file. See
    # docs/runbooks/pi-reflash.md for what that means after a restore.
    image: ghcr.io/wg-easy/wg-easy:15.5.0
    container_name: wg-easy
    environment:
      # The panel's port, published below as 5000 like it was on 14.
      - PORT=5000
      # No TLS in front of the panel: it answers plain HTTP on the LAN, and
      # without this it refuses the session cookie it sets itself.
      - INSECURE=true
      # 14 handed out IPv4 addresses only, and the v14 backup carries no IPv6
      # one. Turning it on here would add ::/0 routes to client configs.
      - DISABLE_IPV6=true
    volumes:
      - ./config:/etc/wireguard
      # wg-quick loads the WireGuard module on demand, and the container has to
      # see the host's module tree to do it after a reboot.
      - /lib/modules:/lib/modules:ro
    ports:
      # Both sides are the panel's configured port: the interface listens on it
      # inside the container, so the host mapping is the same number twice.
      - "@WG_UDP_PORT@:@WG_UDP_PORT@/udp"
      - "5000:5000/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
  # No router here, by decision (task 480, 2026-11-24). The cluster's Traefik on
  # `streaming` answers every *.kub.home.ashudev.com name and holds the only
  # certificate store; the copy these Pis ran had none, so it could not serve TLS.
  #
  # Its whole configuration was --api.insecure=true: a dashboard on 8080 with no
  # authentication, on a host that faces the LAN, and `docker ps` had not shown it
  # running for three months. Keeping it declared is how a second router comes
  # back by accident.
  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.13.1
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
  smartctl-exporter:
    image: matusnovak/prometheus-smartctl:v2.5.0
    container_name: smartctl-exporter
    privileged: true
    ports:
      - "9902:9902"
    restart: unless-stopped
