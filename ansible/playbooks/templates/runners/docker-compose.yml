services:
  pihole:
    container_name: pihole
    image: jacklul/pihole:2026.11.0
    network_mode: host
    # Two files, in this order. pihole.settings is rendered from the template and
    # byte-identical on both Pis; pihole.env holds the panel password and stays
    # on the host. A key in both is won by the later file, i.e. the secret.
    env_file:
      - "./pihole.settings"
      - "./pihole.env"
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
      - './etc-pihole-updatelists/pihole-updatelists.conf:/etc/pihole-updatelists.conf'
      # The panel's certificate, one combined PEM per host. Same directory Caddy
      # reads on the VPN panel side; this file is pihole.pem, named by
      # FTLCONF_webserver_tls_cert in pihole.settings.
      - './certs:/certs:ro'
    cap_add:
      - NET_ADMIN # Required if you are using Pi-hole as your DHCP server, else not needed
    restart: unless-stopped
  wg-easy:
    # 15 keeps its settings — host, port, DNS, allowed IPs, peers — in its own
    # SQLite database under ./config, not in an environment file. See
    # docs/runbooks/pi-reflash.md for what that means after a restore.
    image: ghcr.io/wg-easy/wg-easy:15.5.0
    container_name: wg-easy
    environment:
      # The panel listens on this port inside the compose network. It is not
      # published, so nothing on the LAN reaches it directly: caddy below is the
      # only thing that can.
      - PORT=5000
      # TLS is terminated by caddy. The cookie is Secure and the panel's public
      # URL is https, which is what INSECURE=false says; the hop from caddy to
      # this container is plain HTTP on the compose network alone.
      - INSECURE=false
      # caddy is the only address allowed to tell the panel which scheme and
      # host the browser used, or the login URL is built from the proxy's own
      # name. Sign-in is the panel's own account, not a provider: no OAuth
      # block, no auto-launch, and no secret file to supply.
      - TRUSTED_PROXIES=172.30.0.0/24
      # 14 handed out IPv4 addresses only, and the v14 backup carries no IPv6
      # one. Turning it on here would add ::/0 routes to client configs.
      - DISABLE_IPV6=true
    volumes:
      - ./config:/etc/wireguard
      # wg-quick loads the WireGuard module on demand, and the container has to
      # see the host's module tree to do it after a reboot.
      - /lib/modules:/lib/modules:ro
    ports:
      # One UDP port, the WireGuard listener, and the same number on both hosts:
      # they share one panel database, so a config minted on either names this
      # port and a client keeps dialling it whichever host answers. The panel's
      # 5000 is deliberately absent: it answers on the compose network and
      # nowhere else.
      - "51821:51821/udp"
    networks:
      - panel
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
  caddy:
    # The panel's TLS, on the Pi itself. This is here rather than on the
    # cluster's Traefik on purpose: the VPN panel has to answer when the
    # cluster is down, and a route on a router in another machine cannot.
    # One certificate from the internal CA, one name, one port, no ACME.
    image: caddy:2.11.9
    container_name: caddy
    depends_on:
      - wg-easy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # tls.pem and tls-key.pem, minted by hack/internal-cert.sh --host and
      # copied here. Never written by the setup script.
      - ./certs:/certs:ro
    ports:
      - "8443:8443"
    networks:
      - panel
    restart: unless-stopped
  # No router here, by decision (task 480, 2026-11-24). The cluster's Traefik on
  # `streaming` answers every *.kub.home.ashudev.com name and holds the only
  # certificate store; the copy these Pis ran had none, so it could not serve TLS.
  #
  # caddy above is not that router: one name, one upstream, no dashboard, no
  # discovery, and nothing but the VPN panel. It is here because the panel must
  # open when the cluster is down, which a route on another machine cannot do.
  #
  # Its whole configuration was --api.insecure=true: a dashboard on 8080 with no
  # authentication, on a host that faces the LAN, and `docker ps` had not shown it
  # running for three months. Keeping it declared is how a second router comes
  # back by accident.
  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.13.1
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
  smartctl-exporter:
    image: matusnovak/prometheus-smartctl:v2.5.0
    container_name: smartctl-exporter
    privileged: true
    ports:
      - "9902:9902"
    restart: unless-stopped

networks:
  panel:
    # A fixed subnet so wg-easy can name the only address allowed to reach it
    # through TRUSTED_PROXIES. caddy is the only other service on it.
    ipam:
      config:
        - subnet: 172.30.0.0/24
