# Rendered by ansible/pi/hosts-pi.sh with this host's state, priority and the
# two addresses. An edit made on the Pi is reverted on the next setup, and
# 'verify' names it until then.
global_defs {
  router_id @HOST@
  enable_script_security
  script_user root
}
vrrp_script wg_easy_running {
  script "/usr/bin/docker inspect -f '{{.State.Running}}' wg-easy | grep -qx true"
  interval 2
  timeout 2
  fall 3
  rise 2
}
vrrp_instance edge_vpn {
  state @VRRP_STATE@
  interface eth0
  virtual_router_id 51
  priority @VRRP_PRIORITY@
  advert_int 1
  preempt_delay 300
  unicast_src_ip @OWN_ADDRESS@
  unicast_peer {
    @PEER_ADDRESS@
  }
  virtual_ipaddress {
    192.168.1.9/24
  }
  track_script {
    wg_easy_running
  }
  notify_master "@WG_LIB@/wg-vrrp-notify.sh master"
  notify_backup "@WG_LIB@/wg-vrrp-notify.sh backup"
  notify_fault  "@WG_LIB@/wg-vrrp-notify.sh fault"
  notify_stop   "@WG_LIB@/wg-vrrp-notify.sh stop"
}
