services:
  pihole:
    container_name: pihole
    image: jacklul/pihole:2026.11.0
    network_mode: host
    env_file: "./pihole.env"
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
      - './etc-pihole-updatelists/pihole-updatelists.conf:/etc/pihole-updatelists.conf'
    cap_add:
      - NET_ADMIN # Required if you are using Pi-hole as your DHCP server, else not needed
    restart: unless-stopped
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    env_file: "./wg-easy.env"
    volumes:
      - ./config:/etc/wireguard
    ports:
      - "51821:51821/udp"
      - "5000:5000/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
  # No router here, by decision (task 480, 2026-11-24). The cluster's Traefik on
  # `streaming` already answers every *.kub.home.ashudev.com name and holds the
  # only certificate store; this copy had none, so it could not serve TLS.
  #
  # Its whole configuration was --api.insecure=true: the dashboard on 8080, with
  # no authentication, on a host that faces the LAN. `docker ps` on rbp0 has not
  # shown it running for three months. Keeping it declared is how a second router
  # comes back by accident.
  node_exporter:
    image: quay.io/prometheus/node-exporter:v1.13.1
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
  smartctl-exporter:
    image: matusnovak/prometheus-smartctl:v2.5.0
    container_name: smartctl-exporter
    privileged: true
    ports:
      - "9902:9902"
    restart: unless-stopped
