# A drop-in rather than the packaged /etc/systemd/resolved.conf, so a resolved
# upgrade does not take it back. hosts-pi.sh writes it, prints it with 'render'
# and compares it with 'verify', like every other file here.
[Resolve]
# Empty on purpose: the nameservers come from netplan, which names both Pis on
# both hosts. This file used to hold the *other* Pi's address on each host, in a
# copy kept by hand in no repository at all.
DNS=
# Without this, /etc/resolv.conf is the stub at 127.0.0.53. A container cannot
# reach the host's loopback, so Docker drops that entry and falls back to
# 8.8.8.8: the blocklist is bypassed from inside the very host that serves it.
# With the listener off, resolved writes its upstream list into resolv.conf, and
# a container reads the two Pi-hole addresses instead.
DNSStubListener=no
