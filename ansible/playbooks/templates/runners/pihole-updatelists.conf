; Pi-hole's Lists Updater by Jack'lul
; https://github.com/jacklul/pihole-updatelists
; For a full list of available variables please see the readme.
;
; Nothing on these hosts runs the updater — no timer, no entrypoint — so this
; file changes nothing by itself: the lists live in gravity.db and are edited
; through the panel. It names the lists both panels carry, so a hand run
; reproduces them rather than adding a second opinion.

; Remote list URL containing list of adlists to import
; URLs to single adlists are not supported here!
ADLISTS_URL="https://v.firebog.net/hosts/lists.php?type=tick"

; Remote list URL containing exact domains to whitelist
; One list: anudeepND's whitelist.txt, the exact allows both panels carry. The
; mmotti whitelist.list that used to sit beside it is gone. Its URL was GitHub's
; blob page rather than the raw file, so it never parsed, and the file itself
; says it is not referenced during install: its domains are added by hand when
; one of the regexes below blocks a site someone uses.
; The same repository's optional-list.txt and referral-sites.txt are not
; imported either: they allow ad, affiliate and tracking domains, so gravity
; would lose to them on every one.
WHITELIST_URL="https://raw.githubusercontent.com/anudeepND/whitelist/master/domains/whitelist.txt"

; Remote list URL containing regex rules for whitelisting
REGEX_WHITELIST_URL=""

; Remote list URL containing exact domains to blacklist
; This is specifically for handcrafted lists only, do not use regular blocklists here!
BLACKLIST_URL=""

; Remote list URL containing regex rules for blacklisting
REGEX_BLACKLIST_URL="https://raw.githubusercontent.com/mmotti/pihole-regex/master/regex.list"
