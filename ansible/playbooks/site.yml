---
# One play, one entry point. Every host takes every role; a role skips the hosts
# it does not own by testing its own group, so the list below never grows into a
# second inventory.
- name: Prepare every host
  hosts: all
  become: true
  roles:
    - baseline
    # Before `accounts`, which removes the grant this role is the replacement
    # for, and only from a run that connects as the account it creates.
    - automation
    - accounts
    - packages
    - system
    - firewall
    # The units the nodes are not supposed to carry: no swap, no leftover
    # `rc.local`, `wait-online` told which interface it has, and the failed state
    # of a unit that is gone cleared. The four cluster nodes are the scope; the
    # edge Pis are not.
    - role: units
      when: "'cluster' in group_names"
    # The node's resolver: the two edge Pi-holes and nothing else. CoreDNS
    # inherits this file (`dnsPolicy: Default`), so a nameserver that is not a
    # Pi is an NXDOMAIN for `*.kub.local` that `cache 30` keeps.
    - role: resolver
      when: "'cluster' in group_names"
    # The roles that are not for every host: the data lines, the union, the
    # export table and the parity all belong to the node that holds the disks,
    # and the inventory is where that node is named. The disks come first (the
    # union is a branch list over their mountpoints), then the export table,
    # which names paths inside the union.
    - role: disks
      when: "'storage' in group_names"
    - role: union
      when: "'storage' in group_names"
    - role: nfs
      when: "'storage' in group_names"
    - role: snapraid
      when: "'storage' in group_names"
    # The access log the detector reads: one directory, one owner, one rotation
    # rule, and only on the node that runs the router. It comes before the
    # bouncer's role, which is also streaming-only.
    - role: traefik_logs
      when: "inventory_hostname == 'streaming'"
    # The ban layer. It needs the LAPI's address, so it is applied after ArgoCD
    # has synced the chart: the ClusterIP the role polls is created by it.
    # Its key comes from `~/.config/secrets/homelab.env` through the role's
    # defaults, so `make check` needs no exported variable; see the role's README
    # section in `ansible/README.MD`.
    - role: crowdsec
      when: "inventory_hostname == 'streaming'"
