[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
# A --check run while apt holds its lock reports drift on every host. Waiting is
# cheaper than a false report; 30 s is longer than any apt run on these hosts.
lock_timeout = 30
stdout_callback = default

[ssh_connection]
pipelining = True
