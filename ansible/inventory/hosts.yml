---
# Six machines, four groups. The address of a host is written once, as a YAML
# anchor: a host in two groups (nuc0, streaming, rbp2 are cluster *and* servers)
# references its own entry instead of repeating it, which is the drift this file
# exists to prevent.
#
# cluster — the four Kubernetes nodes, agents and servers alike
# servers — the three control-plane nodes; etcd peers and API server live here
# edge    — the two Raspberry Pis, outside the cluster
# storage — the one node whose disks are exported; a role that owns a host's
#           storage asks for this group rather than for a hostname
all:
  children:
    cluster:
      hosts:
        nas: &nas
          ansible_host: 192.168.1.41
          ansible_user: vronteix
        nuc0: &nuc0
          ansible_host: 192.168.1.27
          ansible_user: vronteix
        streaming: &streaming
          ansible_host: 192.168.1.46
          ansible_user: vronteix
        rbp2: &rbp2
          ansible_host: 192.168.1.48
          ansible_user: vronteix
    servers:
      hosts:
        nuc0: *nuc0
        streaming: *streaming
        rbp2: *rbp2
    edge:
      hosts:
        rbp0:
          ansible_host: 192.168.1.22
          ansible_user: vronteix
        rbp1:
          ansible_host: 192.168.1.38
          ansible_user: vronteix
    storage:
      hosts:
        nas: *nas
