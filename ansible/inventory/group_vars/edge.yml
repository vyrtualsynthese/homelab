---
# The two Pis run one Docker Compose stack each, from this directory. The
# Pi-hole password lives in `pihole.env` beside the compose file; it is
# gitignored and the setup script requires it rather than writing it. wg-easy
# keeps its own settings, DNS included, in the panel's database under
# `config/`, so there is no WireGuard environment file since version 15.
stack_dir: /home/vronteix/dockers

# The tunnel subnet WireGuard clients arrive from, or an empty list. Both panels
# put their clients on 10.8.0.0/24: `ip -4 addr show wg0` inside each wg-easy
# container answered 10.8.0.1/24 on 2026-11-26. The panel's default DNS is in
# its own database and not in git; the tunnel rules stand whether a client
# resolves through this host or not, and an empty list here would drop the name
# resolution of every remote client that does.
vpn_cidrs:
  - 10.8.0.0/24

# The compose network the VPN container joins, fixed in the stack's
# docker-compose.yml. wg-easy masquerades a peer's traffic to its own address on
# this network before it leaves the container, so this is the source ufw sees
# for a query from a peer — `vpn_cidrs` is what the client carries, not what the
# host receives. 53 from it is what gives the VPN a resolver.
panel_cidrs:
  - 172.30.0.0/24
