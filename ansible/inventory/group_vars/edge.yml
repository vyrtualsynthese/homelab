---
# The two Pis run one Docker Compose stack each, from this directory. The
# Pi-hole password lives in `pihole.env` beside the compose file; it is
# gitignored and the setup script requires it rather than writing it. wg-easy
# keeps its own settings, DNS included, in the panel's database under
# `config/`, so there is no WireGuard environment file since version 15.
stack_dir: /home/vronteix/dockers

# The tunnel subnet WireGuard clients arrive from, or an empty list. Empty means
# the firewall opens DNS and the Pi-hole UI to the LAN only — correct when the
# wg-easy panel does not point its default DNS at this host. Read that setting
# from the panel (`GET /api/admin/userconfig`, at https://vpn-<host>.kub.local:8443
# since 2026-11-26) before the first ufw apply on a Pi; a client that resolves
# through Pi-hole arrives on this subnet and is dropped at INPUT until it is
# listed here.
vpn_cidrs: []
