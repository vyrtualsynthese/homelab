---
# Facts every host shares. Node addresses are deliberately absent: a role reads
# `hostvars[host].ansible_host`, so the inventory stays the one place an address
# is written. `hack/tests/test_ansible_layer.py` fails a repeat.
timezone: Europe/Paris

# Two kernels kept: the running one and the newest other. One is not a rollback,
# three costs a reboot's worth of disk on a 4 GB /boot/firmware.
kernel_keep: 2

ansible_python_interpreter: /usr/bin/python3

# The LAN the six hosts sit in, derived from a cluster address rather than
# written down again: the firewall and the exports both need to name it, and a
# second copy of a network is the drift this layer exists to remove.
lan_cidr: "{{ hostvars[groups['cluster'][0]].ansible_host | regex_replace('\\.\\d+$', '.0/24') }}"

# Every host: key-only SSH. The accounts role writes this into sshd_config and
# into a drop-in that sorts ahead of a distribution one.
sshd_password_auth: false

# The account unattended runs log in as, and the only one holding a passwordless
# grant: `accounts` removes the group-wide one, and `become` cannot type a
# password. The human account keeps a password on sudo.
# docs/decisions/2026-11-24-automation-sudo-account.md is the trade.
automation_user: ansible

# The human account, named once: `roles/accounts` writes the same declared keys
# into it that `roles/automation` writes into the automation account.
human_user: vronteix

# Every key in this list logs in as both accounts, on every host this layer
# reaches. The automation account holds a sudo grant with no password, fleet-wide,
# so a key here is root on the fleet. One line per laptop; the trailing comment is
# whose it is. `make adopt` prints the line for the laptop you are on, and
# deleting a line here is how a laptop is retired.
# One key is one line: the base64 body cannot be wrapped, so this line stays long
# and carries the lint exception rather than a fold that would break the key.
trusted_ssh_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBIltfI3EkKuIHapGzdy1weSV5AiBigks/Pm4zR9Xqd5 valentin.ronteix@ashudev.com"
  - "ssh-rsa  vyrtualsynthese@DESKTOP-I3PJEO5"  # noqa: yaml[line-length]

# What a key line may look like: one of these types, then a base64 body of whole
# groups with its padding, then an optional comment. This is a *shape* check, and
# an offline run cannot make a stronger one: it refuses an empty line, a line
# that is not a key, and a body whose length is ragged. It cannot tell a
# hand-wrapped line from a long comment, or a body cut short by a multiple of
# four characters from a whole one. `make adopt` is what proves a key is whole —
# it derives the public half from the private key beside it — so a line is added
# from that command's output, never typed, and a hand-wrapped one is caught by
# the `--diff` read on the first host rather than here. The regex stays on one
# line for the same reason the key does: a fold inside it becomes a space and
# silently widens the match, so it carries the lint exception too.
trusted_ssh_key_pattern: '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256|sk-ssh-ed25519@openssh\.com) ([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4})( \S+)*$'  # noqa: yaml[line-length]
