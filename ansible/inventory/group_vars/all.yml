---
# Facts every host shares. Node addresses are deliberately absent: a role reads
# `hostvars[host].ansible_host`, so the inventory stays the one place an address
# is written. `hack/tests/test_ansible_layer.py` fails a repeat.
timezone: Europe/Paris

# Two kernels kept: the running one and the newest other. One is not a rollback,
# three costs a reboot's worth of disk on a 4 GB /boot/firmware.
kernel_keep: 2

ansible_python_interpreter: /usr/bin/python3

# The LAN the six hosts sit in, derived from a cluster address rather than
# written down again: the firewall and the exports both need to name it, and a
# second copy of a network is the drift this layer exists to remove.
lan_cidr: "{{ hostvars[groups['cluster'][0]].ansible_host | regex_replace('\\.\\d+$', '.0/24') }}"

# Every host: key-only SSH. The accounts role writes this into sshd_config and
# into a drop-in that sorts ahead of a distribution one.
sshd_password_auth: false

# The account unattended runs log in as, and the only one holding a passwordless
# grant: `accounts` removes the group-wide one, and `become` cannot type a
# password. The human account keeps a password on sudo.
# docs/decisions/2026-11-24-automation-sudo-account.md is the trade.
automation_user: ansible

# Automation accepts the keys the human account already accepts — copied on the
# host, because the controller's ~/.ssh is off limits to an agent and a `*.pub`
# in the tree is a committed identity.
automation_key_source_user: vronteix
