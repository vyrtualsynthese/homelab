---
# The one directory in this repository that holds a URL for a week. `/var/log`
# itself is 0755 and root-owned, so the mode here is what keeps the file out of
# every other account's reach: 2770 with the group set to Traefik's gid, and the
# setgid bit so the file the container creates inherits it.
- name: Create the access-log directory
  ansible.builtin.file:
    path: "{{ traefik_logs_dir }}"
    state: directory
    owner: "{{ traefik_logs_uid }}"
    group: "{{ traefik_logs_gid }}"
    mode: "2770"

- name: Install logrotate where it is absent
  ansible.builtin.apt:
    name: logrotate
    state: present

- name: Install the rotation rule
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/traefik-access
    owner: root
    group: root
    mode: "0644"

# `/usr/sbin/logrotate --debug` parses the config and prints what it would do,
# so a syntax error fails here instead of at the first rotation three days later.
# It reads `/etc/logrotate.conf`, the file cron hands to logrotate, so the
# `include /etc/logrotate.d` and the global settings are part of the parse: a
# stanza can be fine on its own and still be skipped in the full config. Because
# that is the whole config, a drop-in this role never wrote — apt, dpkg, rsyslog
# — can be the one that fails a task named after this rule; check what the error
# names before looking at `traefik-access`.
#
# What it proves depends on the run. On a real apply the template above has just
# written the stanza, so the parse covers it. Under `--check` the template writes
# nothing, so the parse reads the drop-in already on the host — or none, where
# this role has never run — and says nothing about the new stanza. `check_mode:
# false` is here to keep the host's own config parsed rather than silently
# skipped; it is not a claim that the new content was proven. A temporary render
# whose parse would prove it is not done, because writing that file is the one
# thing `--check` must not do.
#
# The look-up and the command name the same absolute path on purpose: a bare
# `logrotate` would come from `PATH`, and a guard on one binary with a command on
# another is a proof that disappears the day they diverge. The look-up exists
# because `--check` does not install the package, and dying on a missing binary
# would bury that finding — the install task reports `changed` instead.
- name: Look for the rotation tool
  ansible.builtin.stat:
    path: /usr/sbin/logrotate
  register: traefik_logs_logrotate
  check_mode: false

- name: Prove the rotation rule parses
  ansible.builtin.command:
    cmd: /usr/sbin/logrotate --debug /etc/logrotate.conf
  changed_when: false
  check_mode: false
  when: traefik_logs_logrotate.stat.exists
