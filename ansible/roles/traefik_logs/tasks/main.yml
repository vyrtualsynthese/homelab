---
# The one directory in this repository that holds a URL for a week. `/var/log`
# itself is 0755 and root-owned, so the mode here is what keeps the file out of
# every other account's reach: 2770 with the group set to Traefik's gid, and the
# setgid bit so the file the container creates inherits it.
- name: Create the access-log directory
  ansible.builtin.file:
    path: "{{ traefik_logs_dir }}"
    state: directory
    owner: "{{ traefik_logs_uid }}"
    group: "{{ traefik_logs_gid }}"
    mode: "2770"

- name: Install logrotate where it is absent
  ansible.builtin.apt:
    name: logrotate
    state: present

- name: Install the rotation rule
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/traefik-access
    owner: root
    group: root
    mode: "0644"

# `logrotate --debug` parses the rule and prints what it would do, so a syntax
# error fails this task instead of the first rotation three days later. It reads
# `/etc/logrotate.conf`, not the drop-in, because that is the file cron hands to
# logrotate: a stanza can parse on its own and still be skipped once the `include
# /etc/logrotate.d` and the global settings are applied around it. Debug mode
# writes nothing, so it runs under `--check` as well — `check_mode: false` is what
# keeps a `--check` run from reporting the rule unproven.
#
# The look-up is what keeps the two honest on a node that does not have the tool:
# under `--check` the install above only reports, so there is no binary to run,
# and dying here would bury the real finding (a missing package) under a parse
# error. The install task reports `changed` in that case, which is the signal.
- name: Look for the rotation tool
  ansible.builtin.stat:
    path: /usr/sbin/logrotate
  register: traefik_logs_logrotate
  check_mode: false

- name: Prove the rotation rule parses
  ansible.builtin.command:
    cmd: logrotate --debug /etc/logrotate.conf
  changed_when: false
  check_mode: false
  when: traefik_logs_logrotate.stat.exists
