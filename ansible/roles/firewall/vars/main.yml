---
# Every entry is a rule plus the name of the source set that may reach it; the
# role resolves a source set to addresses before it touches ufw, because a rule
# is one rule per address, not one rule per subnet of four.
#
# What is deliberately absent: every port a container publishes. Docker and the
# CNI put those in NAT and FORWARD, where ufw's INPUT rules never look — 9902
# (the exporter) on both Pis is reachable today and stays reachable after ufw is
# on. Filtering it is a DOCKER-USER rule; a ufw rule would filter nothing and
# read as if it filtered. The wg-easy panel's 5000 used to be the other one: it
# is no longer published at all, and the only port the LAN can open there is
# caddy's 8443 (2026-11-26).
#
# The other half of that split is easy to get wrong in the opposite direction: an
# exporter with `network_mode: host` is not DNAT'd, so it *does* hit INPUT and a
# default deny takes it off the network. 9100 and 9323 below are there for that
# reason — Prometheus scrapes both on both Pis, and the failure is silent (the
# target goes down, no process on the Pi errors).
firewall_rules_cluster:
  - port: 22
    proto: tcp
    source: lan
    comment: ssh from the LAN
  - port: 6443
    proto: tcp
    source: lan
    comment: the k3s API, for kubectl on the LAN
  - port: 10250
    proto: tcp
    source: nodes
    comment: kubelet, read across nodes and by Prometheus
  - port: 2379
    proto: tcp
    source: servers
    comment: etcd, clients only on the servers
  - port: 2380
    proto: tcp
    source: servers
    comment: etcd, peers only on the servers
  - port: 8472
    proto: udp
    source: nodes
    comment: flannel vxlan
  - port: 9100
    proto: tcp
    source: nodes
    comment: node-exporter, scraped by a pod that egresses as its node

# 443 is Pi-hole's own web interface: it serves HTTPS with a certificate it
# mints itself, and `hack/check_pihole_parity.py` dials it. Pi-hole runs with
# network_mode: host, so that port reaches ufw's INPUT and a default deny takes
# both the panel and the check off the LAN. The wg-easy panel is the opposite
# case: caddy publishes its 8443, so Docker's DNAT keeps it out of INPUT.
firewall_rules_edge:
  - port: 22
    proto: tcp
    source: lan
    comment: ssh from the LAN, key-only
  - port: 80
    proto: tcp
    source: lan
    comment: the Pi-hole web interface
  - port: 443
    proto: tcp
    source: lan
    comment: Pi-hole HTTPS web interface
  - port: 53
    proto: tcp
    source: lan
    comment: LAN DNS
  - port: 53
    proto: udp
    source: lan
    comment: LAN DNS
  # A VPN client that resolves through this Pi arrives on the tunnel, not on the
  # LAN, and ufw drops it at INPUT unless the tunnel is named. `vpn_cidrs` is
  # 10.8.0.0/24 on both Pis, measured inside each wg-easy container's wg0 on
  # 2026-11-26; the panel's own DNS setting is in its database, not in git, and
  # these rules stand whether or not a client resolves through this host.
  - port: 53
    proto: tcp
    source: vpn
    comment: DNS for clients on the WireGuard tunnel
  - port: 53
    proto: udp
    source: vpn
    comment: DNS for clients on the WireGuard tunnel
  - port: 80
    proto: tcp
    source: vpn
    comment: the Pi-hole web interface from the tunnel
  - port: 443
    proto: tcp
    source: vpn
    comment: Pi-hole HTTPS web interface from the tunnel
  # Host-network exporters: not DNAT'd, so they reach INPUT. Prometheus on `nas`
  # scrapes both of these on both Pis (the third target there, 9902, is a
  # published container port and needs nothing), and a missing rule shows up only
  # as a target that stops answering.
  - port: 9100
    proto: tcp
    source: nodes
    comment: node-exporter, scraped by a pod that egresses as its node
  - port: 9323
    proto: tcp
    source: nodes
    comment: the Docker metrics endpoint daemon.json opens on 0.0.0.0

# The exports the cluster mounts. NFSv4 puts everything on 2049; 111 and 20048
# are the v3 path the provisioner does not use. They stay for the nodes, the
# only hosts that mount these exports — never for a person's laptop.
firewall_rules_nas:
  - port: 111
    proto: tcp
    source: nodes
    comment: rpcbind
  - port: 111
    proto: udp
    source: nodes
    comment: rpcbind
  - port: 2049
    proto: tcp
    source: nodes
    comment: NFSv4
  - port: 20048
    proto: tcp
    source: nodes
    comment: NFSv3 mountd
