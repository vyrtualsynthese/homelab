---
# ufw filters INPUT. Two things never reach it, and both are named here because
# a rule that filters nothing is worse than no rule: it reads as protection.
#
# 1. **Published container ports.** Docker's DNAT and the CNI's portmap rewrite
#    in NAT and FORWARD before INPUT is consulted. On the Pis that is 8443
#    (caddy, the wg-easy panel's only door) and 9902; on the nodes, every
#    NodePort. What governs them is DOCKER-USER and the cluster's own policy,
#    not this file.
# 2. **Traffic between pods, and pod egress.** `routed` stays ALLOW below for
#    exactly that reason: a deny there takes every pod off the network.
- name: Install ufw where it is absent
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Work out the rules before applying any
  ansible.builtin.import_tasks: resolve.yml

- name: Allow what this host runs, from the addresses that use it
  community.general.ufw:
    rule: allow
    # `resolve.yml` writes `port: None` for a rule declared without one, and
    # `default` replaces only *undefined*: the `true` is what turns that None
    # into `omit`, so a protocol rule reaches ufw with no port at all.
    port: "{{ item.port | default(omit, true) }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from }}"
    comment: "{{ item.comment }}"
  loop: "{{ firewall_entries }}"
  loop_control:
    label: "{{ item.port | default('proto', true) }}/{{ item.proto }} from {{ item.from }}"

- name: Refuse everything else on the way in
  community.general.ufw:
    default: deny
    direction: incoming

- name: Keep forwarding allowed, or every pod loses its egress
  community.general.ufw:
    default: allow
    direction: routed

- name: Turn it on
  community.general.ufw:
    state: enabled
