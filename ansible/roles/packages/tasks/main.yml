---
# Order: reclaim the cache, resolve every pattern against what dpkg says is
# installed, remove what resolved, then clear the dkms state a purged package
# can leave behind. A pattern is never handed straight to apt — it would be a
# literal that matches nothing, or a shell glob that matches too much.
#
# `autoremove` stays off here on purpose: the system role pins the running
# kernel and then collects what nothing references, in the same play, and it has
# to be the only task that removes packages nobody named.
# Byte sizes of the files, not `du`: a directory's own blocks round `du -sm` up
# to 1 MB, so an emptied cache still measured 1 and `apt clean` reported
# `changed` on every run of a host that was already correct.
- name: Measure the package cache before emptying it
  ansible.builtin.command:
    argv:
      - find
      - /var/cache/apt/archives
      - -type
      - f
      - -printf
      - '%s\n'
  register: packages_cache_before
  changed_when: false
  check_mode: false

- name: Empty the package cache
  ansible.builtin.apt:
    clean: true
  changed_when: packages_cache_before.stdout_lines | default([]) | map('int') | sum > 0

- name: Find the installed packages each pattern names
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Package}\n
      - "{{ item }}"
  loop: "{{ packages_absent | default([]) }}"
  register: packages_hits
  changed_when: false
  # A pattern that matches nothing is the normal case on every host but its own.
  failed_when: false

- name: Remove what resolved
  ansible.builtin.apt:
    name: "{{ packages_hits.results | map(attribute='stdout_lines') | flatten | unique }}"
    state: absent
    purge: true
    autoremove: false
  when: packages_hits.results | map(attribute='stdout_lines') | flatten | length > 0

- name: Clear the dkms registrations a purged package leaves behind
  ansible.builtin.file:
    path: "/var/lib/dkms/{{ item }}"
    state: absent
  loop: "{{ dkms_state_absent | default([]) }}"

- name: Fail if a broken dkms registration survived the purge
  ansible.builtin.command: dkms status
  register: packages_dkms
  changed_when: false
  failed_when: "'Error!' in packages_dkms.stdout or 'Error!' in packages_dkms.stderr"
  when: dkms_state_absent | default([]) | length > 0
