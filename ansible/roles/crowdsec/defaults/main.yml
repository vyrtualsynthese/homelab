---
# The LAPI, from a host service that cannot resolve cluster DNS. This is the
# ClusterIP pinned by
# `cluster/helm/security/crowdsec/templates/lapi-host-service.yaml`, not a node
# address: the NodePort that came first answered on every node's LAN address,
# which published the API to the whole house for one consumer (card #570). A
# ClusterIP answers a cluster node's own network namespace — the bouncer's node
# is `streaming` — and no host on the LAN. The play proves it answers before it
# writes this address into the bouncer's file, and
# `hack/tests/test_ansible_streaming_roles.py` fails if the two files disagree.
crowdsec_lapi_url: "http://10.43.249.250:8080/"
crowdsec_package: crowdsec-firewall-bouncer-nftables
crowdsec_keyring: /etc/apt/keyrings/crowdsec.asc
# The distro-agnostic repository: `suites` below is `[any]`, and that pair must
# agree — `<repo>/ubuntu` has no `dists/any`. This one also survives a host release
# upgrade, where a codename suite would stop matching.
crowdsec_repo: https://packagecloud.io/crowdsec/crowdsec/any
crowdsec_metrics_port: 60601
# The only host that scrapes. `ufw` filters the bouncer's listener like any other
# INPUT port, so this is an allow rule, not a formality.
crowdsec_scraper: "{{ hostvars['nas'].ansible_host }}"
