---
# Kernel retention, in the one order that cannot remove the kernel this host is
# running: name the running kernel, keep the newest others, then name every
# package of every version that is neither — image, modules, modules-extra,
# headers — to apt. The list is built from dpkg because a version written here is
# wrong the day the host updates, and the removal is explicit because Ubuntu's
# `01autoremove` forbids autoremove from dropping a kernel at all.
- name: Set the time zone from group_vars
  community.general.timezone:
    name: "{{ timezone }}"
  # No hardware-clock step: a Raspberry Pi has no real-time clock, the module
  # would fail there, and every host here already keeps UTC.

- name: Read the kernel this host booted
  ansible.builtin.command: uname -r
  register: system_running_kernel
  changed_when: false
  # Read-only, and the list below is what `--check` has to agree with: without this line
  # the command is skipped under `--check`, `running` renders empty, and the drift report
  # offers to purge the kernel the host is running — which is what it did on 2026-11-24.
  check_mode: false

# Ubuntu's /etc/apt/apt.conf.d/01autoremove carries
# `"^linux-image-[a-z0-9]*-[a-z0-9]*$"` under NeverAutoRemove, so `apt-mark auto`
# plus `autoremove` keeps every kernel no matter how it is marked: on 2026-11-24
# `nas` still held four and `rbp2` eighteen after two runs that reported
# `changed=0`. The versions are therefore computed here and named to apt — never
# written into this file, because the one that is "the newest other" changes the
# day the host updates.
- name: List the kernel packages that are neither running nor the newest kept
  ansible.builtin.shell: |
    set -euo pipefail
    keep="{{ kernel_keep | int }}"
    running="{{ system_running_kernel.stdout }}"
    # A list computed without a running kernel is a list that removes the running kernel.
    # The task above now runs under `--check` too, so this should never fire; it stays
    # because the consequence is a host that no longer boots.
    if [ -z "$running" ]; then
      echo "uname -r gave no version; refusing to name kernels for removal" >&2
      exit 1
    fi
    images="$(dpkg-query -W -f='${Package}\n' 'linux-image-[0-9]*' 2>/dev/null | sed 's/^linux-image-//' | sort -V || true)"
    others="$(printf '%s\n' "$images" | grep -vx "$running" || true)"
    kept="$(printf '%s\n' "$others" | tail -n $(( keep - 1 )) || true)"
    # `dpkg-query` exits non-zero when a pattern matches nothing, and `headers`
    # and `buildinfo` match nothing on a host that never built a module: `|| true`
    # inside the group is what keeps `set -e` from ending the task there.
    versions="$(
      { dpkg-query -W -f='${Package}\n' \
          'linux-image-[0-9]*' 'linux-modules-[0-9]*' 'linux-modules-extra-[0-9]*' \
          'linux-headers-[0-9]*' 'linux-buildinfo-[0-9]*' 2>/dev/null || true; } \
        | sed -E 's/^linux-(image|modules|modules-extra|headers|buildinfo)-//' | sort -uV
    )"
    printf '%s\n' "$versions" | while read -r version; do
      [ -n "$version" ] || continue
      [ "$version" = "$running" ] && continue
      printf '%s\n' "$kept" | grep -qx "$version" && continue
      for family in linux-image linux-modules linux-modules-extra linux-headers linux-buildinfo; do
        dpkg-query -W -f='${Package} ${db:Status-Abbrev}\n' "${family}-${version}" 2>/dev/null \
          | awk '$2 ~ /^ii/ { print $1 }' || true
      done
    done | sort -u
  args:
    executable: /bin/bash
  register: system_kernel_remove
  changed_when: false
  check_mode: false

# `autoremove: false`: this task removes what the list named and nothing else.
# The task below is what collects the orphans it leaves behind.
- name: Drop the kernels that are neither running nor the newest kept
  ansible.builtin.apt:
    name: "{{ system_kernel_remove.stdout_lines }}"
    state: absent
    purge: true
    autoremove: false
  when: system_kernel_remove.stdout_lines | length > 0

- name: Remove what nothing references any more, configuration files included
  ansible.builtin.apt:
    autoremove: true
    purge: true
    update_cache: false

# The audit found `rc` residue on every host: packages removed with their
# configuration left behind (`virtualbox*`, old kernel headers). apt does not
# touch those, so they are purged here by name from dpkg's own status field.
- name: Purge the configuration files of packages removed earlier
  ansible.builtin.shell: |
    set -euo pipefail
    dpkg-query -W -f='${db:Status-Abbrev} ${Package}\n' \
      | awk '$1 ~ /^rc/ { print $2 }' \
      | while read -r pkg; do
          dpkg --purge "$pkg"
          echo "purged: ${pkg}"
        done
  args:
    executable: /bin/bash
  register: system_rc_purge
  changed_when: system_rc_purge.stdout | length > 0
