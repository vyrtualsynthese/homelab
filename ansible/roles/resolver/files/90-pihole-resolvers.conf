# Written by ansible/roles/resolver; an edit here is reverted on the next run.
[Resolve]
# Empty on purpose: the nameservers come from netplan, which names both Pis.
# This also clears the packaged resolved.conf, where `nas` named the Livebox.
DNS=
# Without this, /etc/resolv.conf stays the stub at 127.0.0.53 and the host
# resolves through resolved's own uplink list — where DHCP had put 1.1.1.1.
# With the listener off, resolved writes its uplink list into the file the role
# points /etc/resolv.conf at, and every process reads the two Pi-holes directly.
DNSStubListener=no
