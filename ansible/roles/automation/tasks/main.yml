---
# The account unattended runs log in as, and the one place a passwordless grant
# survives.
#
# It exists because the layer was a dead end without it: `accounts` removes
# `%admins ALL=(ALL) NOPASSWD: ALL`, `become` then asks for a password no
# unattended run can type, and the first apply aborted one task later with
# "Missing sudo password". The grant moves from a group to one named account, so
# the human account keeps `%sudo` — a password, typed interactively — and the
# sudo log names the identity that acted instead of saying `vronteix` twice.
# The trade is written down in docs/decisions/2026-11-24-automation-sudo-account.md.
#
# Since the 2026-11-25 decision, its keys are not inherited from the human
# account: they are the `trusted_ssh_keys` list in `inventory/group_vars/all.yml`,
# written as the whole file, so a key nobody declared is gone on the next run.
#
# The bootstrap is two runs, and the order is the safety:
#
#   ansible-playbook playbooks/site.yml -e ansible_user=vronteix --tags automation
#   ansible-playbook playbooks/site.yml
#
# The first creates this account while the human grant is still in force. The
# second connects as the account, so `accounts` — which removes the human grant
# only under that condition — cannot take away the path it is using.

# The list is checked before the account exists, because an account written from
# a broken list cannot be logged in to, and the run that would fix it needs that
# account. Empty and malformed are the two ways to lose the fleet in one edit.
- name: Refuse a key list that cannot be declared
  ansible.builtin.assert:
    that:
      - trusted_ssh_keys is defined
      - trusted_ssh_keys | length > 0
      - trusted_ssh_keys | reject('match', trusted_ssh_key_pattern) | list | length == 0
    fail_msg: >-
      trusted_ssh_keys is empty, or holds a line whose shape is not an OpenSSH
      public key. An account written from that list cannot be logged in to, and
      the run that would fix it needs that account. Add the line `make adopt`
      prints, rather than a hand-typed or hand-wrapped one.
  tags: [automation]

- name: Create the automation account, key-only
  ansible.builtin.user:
    name: "{{ automation_user }}"
    shell: /bin/bash
    create_home: true
    password_lock: true
    state: present
  tags: [automation]

- name: Give it a home for its keys
  ansible.builtin.file:
    path: "/home/{{ automation_user }}/.ssh"
    state: directory
    owner: "{{ automation_user }}"
    group: "{{ automation_user }}"
    mode: "0700"
  tags: [automation]

# The whole file, not an appended line: that is what makes a key the operator did
# not declare disappear on the next run, and what `make check` then reports.
# `copy` rather than `authorized_key` because only `copy` backs the old file up.
- name: Give it the keys declared in group_vars
  ansible.builtin.copy:
    content: "{{ trusted_ssh_keys | join('\n') }}\n"
    dest: "/home/{{ automation_user }}/.ssh/authorized_keys"
    owner: "{{ automation_user }}"
    group: "{{ automation_user }}"
    mode: "0600"
    backup: true
  tags: [automation]

# `0440` and validated: a typo in this file takes sudo away from the account
# every unattended run depends on, and `visudo -cf` refuses to write one. The
# content names one account and no group — a group grant follows every account
# that joins it, which is how the old one spread.
- name: Write the one passwordless grant this layer keeps
  ansible.builtin.copy:
    dest: /etc/sudoers.d/00-homelab-automation
    content: |
      # Written by ansible/roles/automation; an edit here is reverted on the next run.
      # One account, not a group.
      {{ automation_user }} ALL=(ALL) NOPASSWD: ALL
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  tags: [automation]
