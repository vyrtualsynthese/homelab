---
# The order and the warnings in this file are the whole point of the role.
#
# The grant goes before the group: a run interrupted between the two must never
# leave a member without the group it belongs to. `validate: visudo -cf %s` is
# what stops a bad edit from taking sudo away from every account at once.
#
# Both removals are gated on the run connecting as `automation_user`. The grant
# this role removes is the only passwordless path `vronteix` has, so a run that
# still logs in as `vronteix` and removes it takes away the path it is itself
# using — the failure is `Missing sudo password`, one task later. `roles/automation`
# creates the replacement account, and the human account keeps `%sudo`, which
# asks for a password.
#
# On the two Pis this is the role that can lock the operator out. Their
# PasswordAuthentication is `yes` today and their access is two keys
# (vyrtualsynthese@DESKTOP-I3PJEO5, valentin.ronteix@ashudev.com). Apply it to
# rbp1 alone with --check --diff first, read that diff, and only then go on.
#
# The guard comes first. A check that runs after the change it is supposed to
# prevent protects nothing: by then the file is written and sshd has been told to
# read it. What has to be true before the first write is that this play connects
# as a named account, that the policy is stated, and that the account has a key
# on disk — because the change below takes the password away.
- name: Read the account this play connects as
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Look for a key that can replace the password
  ansible.builtin.stat:
    path: "{{ getent_passwd[ansible_user][4] }}/.ssh/authorized_keys"
  register: accounts_authorized_keys

- name: Refuse to close password logins on an account that has no key
  ansible.builtin.assert:
    that:
      - ansible_user | default('') != 'root'
      - sshd_password_auth is defined
      - accounts_authorized_keys.stat.exists
      - accounts_authorized_keys.stat.size | default(0) > 0
    fail_msg: >-
      This play connects as {{ ansible_user | default('an unknown user') }} and
      {{ getent_passwd[ansible_user][4] | default('its home') }}/.ssh/authorized_keys
      holds no key. Without one, the next task takes away the only way back in.

- name: Remove the passwordless sudo grant on the admins group
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    line: '%admins ALL=(ALL) NOPASSWD: ALL'
    state: absent
    validate: visudo -cf %s
  # Only from a run that has stopped depending on it. `roles/automation` creates
  # the account that replaces this grant, and a run logged in as the human would
  # remove the grant it is using and then fail the next `become` with "Missing
  # sudo password" — which is what the first apply of this layer did.
  when: ansible_user == automation_user

# After the grant, never before: the group is useless without it and a member
# without its group is a smaller mess than a member with passwordless root.
- name: Remove the admins group the grant belonged to
  ansible.builtin.group:
    name: admins
    state: absent
  when: ansible_user == automation_user

# `lineinfile` rewrites the *last* line its regexp matches, so a pattern that
# also matches a commented example (`#      X11Forwarding no`, in Ubuntu's
# sshd_config) edits the example and leaves the real directive alone — which then
# wins, because sshd takes the first value it reads. Both patterns below match an
# active directive only.
- name: State the password-login policy in the main sshd config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PasswordAuthentication\s'
    line: "PasswordAuthentication {{ sshd_password_auth | ternary('yes', 'no') }}"
    validate: sshd -t -f %s
  notify: Reload sshd

- name: Turn X11 forwarding off
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^X11Forwarding\s'
    line: X11Forwarding no
    validate: sshd -t -f %s
  notify: Reload sshd

# sshd takes the first value it reads for a keyword, and Ubuntu's sshd_config
# includes sshd_config.d/*.conf near its top. A drop-in named 50-cloud-init.conf
# therefore wins over anything written further down, including the two tasks
# above. Ours sorts ahead of it, which is what makes "no" the answer.
- name: Write a drop-in that sorts ahead of a distribution one
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-homelab.conf
    content: |
      # Written by ansible/roles/accounts; an edit here is reverted on the next run.
      PasswordAuthentication {{ sshd_password_auth | ternary('yes', 'no') }}
      X11Forwarding no
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd
