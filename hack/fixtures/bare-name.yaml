apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr
  namespace: media-stack
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`sonarr.kub.local`)
      middlewares:
        - name: lan-only
      services:
        - name: sonarr
          port: 8989
