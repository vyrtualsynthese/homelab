# Default values for freshrss.
#
# The app is rebuilt against the chart contract in docs/charts/README.md: the
# claim this chart mounts is the claim this chart creates, the port lives in one
# value, the probes ask the app rather than `/`, and every non-public route
# carries the LAN allowlist.

replicaCount: 1

# A config claim cannot attach to two pods at once, and FreshRSS holds its SQLite
# database there. Recreate, never RollingUpdate.
strategy: Recreate

image:
  # The official image, and the only one that carries OIDC: it is Debian on
  # x86_64 and ships Apache with mod_auth_openidc. The LinuxServer image this
  # chart used to run is nginx and has no such module. The entrypoint still
  # starts as root, chowns the data into the `www-data` group, then Apache
  # drops to that user; that is why the securityContext below cannot use
  # runAsNonRoot (see the chart README).
  repository: freshrss/freshrss
  # Pinned, never floating. Bumped by hand with appVersion in Chart.yaml.
  tag: 1.30.4
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # The pod talks to no Kubernetes API. The token is not mounted either.
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The entrypoint writes /config as root before Apache drops to www-data, and
# local-path does not apply fsGroup to a hostPath volume. So no fsGroup, and no
# runAsUser here: both look right and do nothing.
podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  # The entrypoint runs as root: it creates the data root, hands it to the
  # `www-data` group with CHOWN, then Apache drops to www-data with SETUID and
  # SETGID. DAC_OVERRIDE is what lets root write under /config at all — the
  # claim root is owned by uid 1100 (the LinuxServer image chowned it) and is not
  # necessarily group-writable, so without it the entrypoint cannot create
  # `/config/data` on the first start. Everything else stays dropped.
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
  seccompProfile:
    type: RuntimeDefault

# Rendered inline into the container spec, never through a ConfigMap: a change
# here changes the pod template, so the Deployment rolls by itself.
env:
  TZ: "Europe/Paris"
  # The writable root, at a subdirectory of the claim on purpose. The claim root
  # was chowned to uid 1100 by the image this chart used to run, and the
  # container can change a file's group but not its mode without FOWNER, so a
  # data root there could not be written by the Apache worker. This path is
  # created by the entrypoint as root, which can chmod what it owns.
  DATA_PATH: "/config/data"
  # The official image refreshes feeds from its own cron; the LinuxServer image
  # did this for itself. Twice an hour, at 1 and 31 minutes.
  CRON_MIN: "1,31"
  # OIDC. The provider and its exact callback are in the authentik blueprint
  # `ashulab-app-freshrss`. With OIDC on, the image protects /i/ only; /p/api/
  # keeps its own login, which is what the phone app and the sync script use.
  OIDC_ENABLED: "1"
  OIDC_PROVIDER_METADATA_URL: "https://authentik.kub.home.ashudev.com/application/o/freshrss/.well-known/openid-configuration"
  OIDC_CLIENT_ID: "freshrss"
  OIDC_REMOTE_USER_CLAIM: "preferred_username"
  OIDC_SCOPES: "openid profile email"
  # Traefik terminates TLS, so the module builds the callback from the headers
  # it sets, not from the request's own scheme.
  OIDC_X_FORWARDED_HEADERS: "X-Forwarded-Host X-Forwarded-Port X-Forwarded-Proto"
  # No log-level variable exists. FreshRSS writes its own log per user under
  # the data root (Administration → Logs) and keeps the API's log under the
  # pseudo-user `_`; PHP messages go to Apache's error log, which this image
  # sends to stderr. There is no environment knob to lower any of them. What
  # that costs in Loki, and which record carries the outcome, is in the chart
  # README. Do not add a variable here: it would do nothing.

# Variables sourced from a Secret, as `{ name, valueFrom }`. Kept separate so a
# secret can never be pasted into the plain map above by accident.
extraEnv:
  # The same client secret as `FRESHRSS_CLIENT_SECRET` in the authentik Secret
  # `authentik-sso`; a Secret does not cross namespaces, so the value has two
  # homes. The crypto key is local to this container.
  - name: OIDC_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: freshrss-oidc
        key: client-secret
  - name: OIDC_CLIENT_CRYPTO_KEY
    valueFrom:
      secretKeyRef:
        name: freshrss-oidc
        key: client-crypto-key

# Bulk `envFrom` sources, usually `secretRef`.
envFrom: []

# Additional volumes and mounts, rendered verbatim into the pod spec.
volumes: []
volumeMounts: []

service:
  type: ClusterIP
  # One value drives the container port, the Service port and every probe. The
  # image's WebUI is port 80 (freshrss/freshrss, Apache) — it is not the
  # upstream PHP-FPM dev port.
  port: 80

storage:
  # Render the claim the Deployment mounts. A chart that mounts a claim must
  # create it: this one did not, and the pod sat Pending for 77 days waiting for
  # a `freshrss-volume` that nothing ever created.
  enabled: true
  # Use an existing claim instead of the one this chart creates.
  existingClaim: ""
  className: local-path
  accessModes:
    - ReadWriteOnce
  # Not the 128Mi house default: FreshRSS keeps its SQLite database *and* the
  # cached article bodies under the data root, so this volume grows with the
  # feeds, not with the settings. 1Gi is a starting size, revisited once an
  # article retention policy is set in the UI.
  size: 1Gi
  # Where the claim is mounted inside the container. The data root is
  # `DATA_PATH` under it, not this directory: the claim root still holds the
  # tree the LinuxServer image wrote (uid 1100), which is left untouched.
  mountPath: /config

# Probes.
#
# FreshRSS ships no health endpoint of its own, so the two questions are asked
# separately:
#   - is the process listening?            a TCP connect on the WebUI port
#   - is the app actually able to answer?  the login page at /i/, which boots
#                                          Apache and PHP
# With OIDC enabled, /i/ answers 302 to authentik and a probe counts 3xx as
# ready, so readiness no longer reads the user table on every pass. It still
# fails when Apache or PHP is down, which is the failure the TCP check misses.
# `/` is deliberately not used: `index.php` is a 301 to `p/`, so it answers even
# with a broken backend.
probes:
  startup:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 3
    # 30 × 5s = 150s, about three times a first start on this image.
    failureThreshold: 30
  liveness:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /i/
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

# Sizing was never measured: the pod has not run since 2026-08-09, and the six
# days Prometheus retains carry no sample for it. These are a protection ceiling,
# not evidence. The request is PHP-FPM's floor for a small feed set; the limit
# covers a migration or a large OPML import. Re-measure before trusting either.
resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector:
  # Every workload is pinned to a named node; local-path claims are node-bound.
  # `nuc0` is where the old `node-type: general` selector put this app before
  # that label was retired, and where the general catalogue lives.
  kubernetes.io/hostname: nuc0

tolerations: []
affinity: {}

ingress:
  enabled: true
  # The API group of the Traefik CRDs. Traefik v3 needs `traefik.io/v1alpha1`;
  # the v2 group stays until that upgrade lands.
  apiVersion: traefik.io/v1alpha1
  # The host is kept exactly as the live routes have it.
  host: freshrss.kub.home.ashudev.com
  annotations: {}
  # Middlewares, as fully qualified names. `lan-only` is a boundary, not an
  # account: every non-public route carries it, so a hostname is not the only
  # thing standing between this app and the internet.
  middlewares:
    - kube-system-lan-only@kubernetescrd
  tls:
    # ACME through the `myresolver` resolver, with the per-app TLSOption the
    # chart renders. Unchanged from the live objects.
    certResolver: myresolver
