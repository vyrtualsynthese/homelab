# Rendered because the cluster has it, not because a route uses it: no route in
# this chart references `-security` today. Changing that is a routing decision
# (which headers, on which rule), not part of rebuilding the chart — see the
# README's known debt.
apiVersion: {{ .Values.ingress.apiVersion }}
kind: Middleware
metadata:
  name: {{ include "app.fullname" . }}-security
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  headers:
    frameDeny: true
    sslRedirect: true
    browserXssFilter: true
    contentTypeNosniff: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
