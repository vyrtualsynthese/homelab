global:
  # -- Default domain used by all components
  ## Used for ingresses, certificates, SSO, notifications, etc.
  domain: argocd.kub.local
  image:
    # -- If defined, a repository applied to all Argo CD deployments
    repository: quay.io/argoproj/argocd
    # -- Overrides the global Argo CD image tag whose default is the chart appVersion
    tag: "v3.5.2"
    # -- If defined, a imagePullPolicy applied to all Argo CD deployments
    imagePullPolicy: IfNotPresent
configs:
  params:
    server.insecure: true
  cm:
    url: http://argocd.kub.local
    # Dex trusts authentik as the only identity source. The client secret is
    # not here: it comes from argocd-secret's dex.authentik.clientSecret, which
    # carries the same value as ARGOCD_CLIENT_SECRET in the authentik-sso
    # secret. `insecureEnableGroups` is required because Dex only forwards the
    # groups claim for a non-TLS issuer otherwise.
    dex.config: |
      connectors:
        - config:
            issuer: https://authentik.kub.home.ashudev.com/application/o/argocd/
            clientID: argocd
            clientSecret: $dex.authentik.clientSecret
            insecureEnableGroups: true
            scopes: [openid, profile, email]
          name: authentik
          type: oidc
          id: authentik
  rbac:
    # The admin level keeps the deployment control plane; the user level reads.
    policy.csv: |
      g, authentik Admins, role:admin
      g, homelab-users, role:readonly
## Server
server:
  metrics:
    # -- Deploy metrics service
    enabled: true
    # Argo CD server ingress configuration
    serviceMonitor:
      # -- Enable a prometheus ServiceMonitor
      enabled: true
  ingress:
    # -- Enable an ingress resource for the Argo CD server
    enabled: true
    # -- Specific implementation for ingress controller. One of `generic`, `aws` or `gke`
    ## Additional configuration might be required in related configuration sections
    controller: generic
    # -- Additional ingress labels
    labels: {}
    # -- Additional ingress annotations
    ## Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/ingress/#option-1-ssl-passthrough
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    #  traefik.ingress.kubernetes.io/router.middlewares: "kube-system-redirect-https@kubernetescrd"
    # -- Enable TLS configuration for the hostname defined at `server.ingress.hostname`
    ## TLS certificate will be retrieved from a TLS secret `argocd-server-tls`
    ## You can create this secret via `certificate` or `certificateSecret` option
    tls: false
