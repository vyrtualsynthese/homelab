argo-cd:
  global:
    # -- Default domain used by all components
    ## Used for ingresses, certificates, SSO, notifications, etc.
    domain: argocd.kub.internal
    # Every metrics Service the chart renders carries prometheus.io/scrape and
    # prometheus.io/port, which is how this cluster finds an exporter: there is
    # no Prometheus Operator and no ServiceMonitor. The three Services are the
    # scrape targets (the controller, the repo-server and the server); the pods
    # themselves are not scraped.
    addPrometheusAnnotations: true
    image:
      # -- If defined, a repository applied to all Argo CD deployments
      repository: quay.io/argoproj/argocd
      # -- The image tag is the chart's appVersion. Argo CD upgrades itself with
      # the dependency in Chart.yaml; a tag here would be a second version lever
      # that can move apart from the chart (card 344, PR #966).
      # -- If defined, a imagePullPolicy applied to all Argo CD deployments
      imagePullPolicy: IfNotPresent

  # Every component had no resources at all, so each was BestEffort: first to be
  # evicted and with no guaranteed share of a node. Sized on 2026-11-22 from the
  # 7 days to that date (working set): p95 / peak per container.
  #   application-controller 340 / 408 MiB
  #   repo-server           227 / 714 MiB (a large repo's first manifest render)
  #   server                 57 /  74 MiB
  #   dex                    68 /  71 MiB
  #   applicationSet         39 /  51 MiB
  #   notifications          34 /  39 MiB
  #   redis                  23 /  24 MiB
  # Request = p95, limit = peak x 1.5. No CPU limit, per the house rule.
  controller:
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        memory: 768Mi
    metrics:
      # -- Deploy the controller's metrics Service on 8082
      enabled: true
  repoServer:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1.5Gi
    metrics:
      # -- Deploy the repo-server's metrics Service on 8084
      enabled: true
  applicationSet:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 96Mi
  notifications:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 64Mi
  configs:
    params:
      server.insecure: true
      # With no list here the controller publishes no condition metric at all.
      # ComparisonError is the condition Argo CD sets when it cannot render an
      # Application, so it is the one the alert reads.
      controller.metrics.application.conditions: "ComparisonError"
      # Measured 2026-11-18: these three wrote 747 MB/day between them, 49 % of the
      # log pipeline. The application controller logs every reconcile step for every
      # application, repo-server every gRPC call and cache hit, and the notifications
      # controller a "Start processing"/"Processing completed" pair per notification.
      # `warn` keeps a failed sync, a failed manifest generation and an auth error,
      # which are the three a human acts on.
      controller.log.level: warn
      reposerver.log.level: warn
      notificationscontroller.log.level: warn
      # Measured 2026-11-19, after the three above went to `warn`: the API server
      # was then the loudest thing left in argocd at 12.9 MB/day of `info`, almost
      # all of it `invalidated cache for resource` and a started/finished pair per
      # gRPC call from the UI. `warn` keeps the two lines a human acts on — the
      # `token does not have jti or uti claim` warning and any auth failure — and
      # repo-server's manifest errors are already at error level and unaffected.
      server.log.level: warn
    cm:
      # Must be exactly the URL the browser uses, scheme included. Argo CD checks
      # the SSO return URL against this value and answers `Invalid redirect URL:
      # the protocol and host (including port) must match` when they differ, so an
      # `http` value on a browser that reaches the host over TLS rejects every
      # sign-in before authentik is even contacted. Traefik terminates the TLS;
      # the server itself stays plain HTTP behind it (`server.insecure`).
      url: https://argocd.kub.internal
      # No local account: the built-in `admin` user is the only password login Argo
      # CD offers, and authentik is the only identity source. Break-glass, if SSO is
      # ever broken: kubectl -n argocd patch configmap argocd-cm --type merge -p
      #   '{"data":{"admin.enabled":"true"}}' && kubectl -n argocd rollout restart
      #   deploy/argocd-server, then sign in with the password in argocd-secret.
      admin.enabled: "false"
      # Dex trusts authentik as the only identity source. The client secret is
      # not here: it comes from argocd-secret's dex.authentik.clientSecret, which
      # carries the same value as ARGOCD_CLIENT_SECRET in the authentik-sso
      # secret. `insecureEnableGroups` is required because Dex only forwards the
      # groups claim for a non-TLS issuer otherwise.
      dex.config: |
        connectors:
          - config:
              issuer: https://authentik.kub.home.ashudev.com/application/o/argocd/
              clientID: argocd
              clientSecret: $dex.authentik.clientSecret
              insecureEnableGroups: true
              scopes: [openid, profile, email]
            name: authentik
            type: oidc
            id: authentik
    rbac:
      # The admin level keeps the deployment control plane; the user level reads.
      policy.csv: |
        g, authentik Admins, role:admin
        g, homelab-users, role:readonly
  ## Server
  server:
    metrics:
      # -- Deploy metrics service
      enabled: true
      # Argo CD server ingress configuration
      serviceMonitor:
        # -- Enable a prometheus ServiceMonitor
        enabled: true
    ingress:
      # -- The chart's own `networking.k8s.io/v1` Ingress serves one router on every
      # entry point it is given, so it cannot express this cluster's routing rules:
      # the LAN gate, the default internal certificate and a plain-HTTP router that
      # only redirects. Two Traefik IngressRoutes do it instead, in `extraObjects`.
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

  # Traefik IngressRoutes for the server, replacing the chart's core Ingress. The
  # TLS router sets neither `secretName` nor `certResolver` on purpose: Traefik then
  # serves it the cluster default certificate `kube-system/local-cert`, the
  # `*.kub.local` leaf signed by the ashulab internal CA. See
  # docs/runbooks/internal-ca.md.
  extraObjects:
    - apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: argocd-server
      spec:
        entryPoints:
          - websecure
        routes:
          - kind: Rule
            match: Host(`{{ .Values.global.domain }}`)
            middlewares:
              - name: kube-system-lan-only@kubernetescrd
            services:
              - name: argocd-server
                port: http
        tls:
          options:
            name: internal-tls
            namespace: kube-system
    # Plain-HTTP mirror: the LAN gate first, then a permanent redirect, so an
    # off-LAN request is refused with `403` rather than redirected.
    - apiVersion: traefik.io/v1alpha1
      kind: IngressRoute
      metadata:
        name: argocd-server-redirect
      spec:
        entryPoints:
          - web
        routes:
          - kind: Rule
            match: Host(`{{ .Values.global.domain }}`)
            middlewares:
              - name: kube-system-lan-only@kubernetescrd
              - name: kube-system-redirect-to-https@kubernetescrd
            services:
              - name: argocd-server
                port: http

    # The chart ships an ingress policy per component that allows the named
    # `metrics` port with `namespaceSelector: {}` as its peer (any namespace).
    # On this k3s an empty `namespaceSelector` peer is not enforced: measured
    # 2026-11-22 with the chart's rule as the only one on the controller, 8082
    # refused a pod in `monitoring`; the same pod was allowed by a rule whose
    # peer was an ipBlock, with either the named `metrics` port or 8082. The
    # metrics Services are headless, so a scrape is a pod-to-pod connection to
    # the pod's own address and falls under that policy. This rule is additive
    # to the chart's, and numeric so it cannot drift from a renamed port.
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: argocd-metrics-scrape
      spec:
        podSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - argocd-application-controller
                - argocd-repo-server
        policyTypes:
          - Ingress
        ingress:
          - from:
              - ipBlock:
                  cidr: 10.42.0.0/16
            ports:
              - port: 8082
                protocol: TCP
              - port: 8084
                protocol: TCP

  # The argocd image tag follows the chart appVersion. dex and redis are separate
  # software, so their tags are pinned here.
  dex:
    image:
      repository: ghcr.io/dexidp/dex
      tag: v2.46.1
    resources:
      requests:
        cpu: 10m
        memory: 80Mi
      limits:
        memory: 128Mi
  redis:
    image:
      repository: docker.io/library/redis
      tag: 8.12.0-alpine
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
