apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The password method is off, so this cannot be used to sign in. The value is
  # pinned in values.yaml: the chart that came before generated it with `rand`
  # on every render and emitted it unquoted.
  FILEBROWSER_ADMIN_PASSWORD: {{ required "adminPassword.passwordOverride is required: the app always gets this variable" .Values.adminPassword.passwordOverride | quote }}
