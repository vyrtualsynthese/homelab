apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  # The app reads this file through a subPath mount, which does not update when
  # the ConfigMap changes. The checksum/config pod annotation rolls the pod on
  # the next sync. `http.port` comes from service.port so the listener and the
  # Service cannot drift apart.
  config.yaml: |
    {{- $config := deepCopy .Values.config }}
    {{- $http := default (dict) (index $config "http") }}
    {{- $_ := set $config "http" (merge $http (dict "port" (int .Values.service.port))) }}
    {{- toYaml $config | nindent 4 }}
