apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "app.configClaimName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    # Same policy the previous chart rendered: the claim holds database.db with
    # the users, scopes and OIDC linkage, so `helm uninstall` must not take it.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.config.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.config.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "app.dataClaimName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.data.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
