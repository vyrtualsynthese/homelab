# qBittorrent's old state directory. Nothing mounts it since 2026-11-25, when the
# claim moved to `local-path` because NFS reads of it stalled the Web UI (card 758,
# docs/qbittorrent-webui-stalls.md). The release stays, with the export it serves,
# only as the rollback copy for the migration's 24-hour observation: a follow-up
# card deletes this file, its Application and the matching line in
# `ansible/roles/nfs/templates/exports.j2`.
nfs-subdir-external-provisioner:
  fullnameOverride: nfs-qbittorrent-config-nfs-subdir-external-provisioner
  nfs:
    path: /mnt/storage/nfs/qbittorrent-config
    volumeName: nfs-qbittorrent-config
  storageClass:
    name: nfs-qbittorrent-config
    accessModes: ReadWriteMany
