# Every application with a web page on the lab, grouped by what it is for.
#
# Rendered into the `dashy-conf` Secret by templates/secret-config.yaml and
# mounted at /app/user-data/conf.yml. Hosts are the ones in
# docs/reference/routes.md: the `.kub.local` names use the cluster's internal
# certificate, the `.kub.home.ashudev.com` names a Let's Encrypt one.
#
# Icons come from each project's own repository, served by
# raw.githubusercontent.com on the project's default branch. Two entries have
# no logo file in their repository and keep the dashboard-icons set instead:
# Plex (`hl-plex`, no public source tree) and Authentik (`hl-authentik`, the
# logo is a build-time brand asset, not a file in goauthentik/authentik).
# Every other icon URL was fetched and answered 200 image/* when this list was
# written; a project that moves its file leaves one blank tile, nothing else.
#
# Nothing here is secret. A widget that needs an API key later puts it in an
# env secret (`env.existingSecret`), never in this file.

pageInfo:
  title: ashulab
  description: every service on the lab

appConfig:
  theme: callisto
  layout: horizontal
  iconSize: medium
  defaultOpeningMethod: newtab
  statusCheck: false
  preventWriteToDisk: true
  disableConfiguration: true
  enableServiceWorker: false
  faviconApi: local

sections:
