# Every application with a web page on the lab, grouped by what it is for.
#
# Rendered into the `dashy-conf` Secret by templates/secret-config.yaml and
# mounted at /app/user-data/conf.yml. Hosts are the ones in
# docs/reference/routes.md: the `.kub.local` names use the cluster's internal
# certificate, the `.kub.home.ashudev.com` names a Let's Encrypt one.
#
# Nothing here is secret. A widget that needs an API key later puts it in an
# env secret (`env.existingSecret`), never in this file.

pageInfo:
  title: ashulab
  description: every service on the lab

appConfig:
  theme: callisto
  layout: horizontal
  iconSize: medium
  defaultOpeningMethod: newtab
  statusCheck: false
  preventWriteToDisk: true
  disableConfiguration: true
  enableServiceWorker: false
  faviconApi: local

sections:
