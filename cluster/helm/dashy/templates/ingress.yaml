# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/ingressroute_v1alpha1.json
# Public on purpose: the start page is the one door into the lab from outside.
# The gate is `authentik-forwardauth`, bound to `authentik Admins` by
# cluster/helm/authentik/files/app-dashy.yaml; the plain `authentik`
# middleware is headers and authenticates nothing.
#
# No `lan-only` here, and none may be added: a public host that is gated is
# unreachable from the internet, and `hack/check_exposure.py` reports it.
#
# The certificate is Let's Encrypt (`myresolver`), because `ashudev.com` is a
# public zone; the internal `*.kub.local` names below cannot have one.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashy
  namespace: dashy
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dashy.ashudev.com`)
      kind: Rule
      middlewares:
        - name: authentik-forwardauth
          namespace: kube-system
        - name: security
          namespace: kube-system
      services:
        - name: dashy
          port: 8080
  tls:
    certResolver: myresolver
    options:
      name: dashy-tlsoption
      namespace: {{ .Release.Namespace }}
---
# Plain-HTTP mirror: one redirect to TLS, nothing proxied, and no gate. A gate
# here would answer the off-LAN browser with a 403 before it ever asked for the
# certificate.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashy-public-redirect
  namespace: dashy
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`dashy.ashudev.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: kube-system
      services:
        - name: noop@internal
          kind: TraefikService
