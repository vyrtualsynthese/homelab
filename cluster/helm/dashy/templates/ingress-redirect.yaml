# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.io/ingressroute_v1alpha1.json
# The retired internal name: it only redirects now, to the public address. The
# `websecure` twin exists because a browser has to finish the TLS handshake
# before it can be told where to go; it serves the cluster's internal
# certificate (`kube-system/local-cert`) through the `internal-tls` option.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashy-local
  namespace: dashy
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dashy.kub.internal`)
      kind: Rule
      middlewares:
        - name: lan-only
          namespace: kube-system
        - name: redirect-to-dashy
          namespace: dashy
      services:
        - name: noop@internal
          kind: TraefikService
  tls:
    options:
      name: internal-tls
      namespace: kube-system
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashy-redirect
  namespace: dashy
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`dashy.kub.internal`)
      kind: Rule
      middlewares:
        - name: lan-only
          namespace: kube-system
        - name: redirect-to-dashy
          namespace: dashy
      services:
        - name: noop@internal
          kind: TraefikService
