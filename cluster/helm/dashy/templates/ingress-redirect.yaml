# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.containo.us/ingressroute_v1alpha1.json
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: dashy-redirect
  namespace: dashy
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`dashy.ashudev.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: kube-system
      services:
        - kind: TraefikService
          name: noop@internal
