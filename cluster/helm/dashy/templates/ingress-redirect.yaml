# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.containo.us/ingressroute_v1alpha1.json
# Plain-HTTP mirror of the internal router: `lan-only` refuses an off-LAN
# request here rather than redirecting it. The middleware list that matters is
# in ingress.yaml.
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: dashy-redirect
  namespace: dashy
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`dashy.kub.local`)
      kind: Rule
      middlewares:
        - name: lan-only
          namespace: kube-system
        - name: redirect-https
          namespace: kube-system
      services:
        - name: dashy
          port: 8080
