{{- if and .Values.ingressRoute.enabled .Values.ingressRoute.redirectToHttps }}
apiVersion: {{ .Values.ingressRoute.apiVersion }}
kind: Middleware
metadata:
  name: {{ include "app.fullname" . }}-redirect-https
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
