# Default values for kavita.
# This chart follows the contract in docs/charts/README.md and the shape of the
# reference chart, media-stack/sonarr. The differences are the ones this app
# needs: a LinuxServer image that starts as root and drops to PUID/PGID, a
# read-only library mount shared with Calibre-Web Automated, probes on Kavita's
# own `/api/health`, and a public host behind TLS.

# -- Override the chart name.
nameOverride: ""
# -- Override the generated release name.
fullnameOverride: ""

replicaCount: 1

# -- Deployment strategy. `Recreate` is required for anything with a config
# volume: ReadWriteOnce volumes cannot be attached to an old and a new pod at the
# same time.
strategy: Recreate

image:
  # LinuxServer publishes on lscr.io and mirrors on ghcr.io; this chart keeps the
  # registry it already pulls from. The image starts as root and drops to PUID/PGID
  # through s6; that is why the securityContext below cannot use runAsNonRoot
  # (see the chart README).
  repository: ghcr.io/linuxserver/kavita
  # -- Pin the full release tag. `0.9.1` is the series tag and moves; this one does not.
  tag: "v0.9.1.4-ls132"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  # -- Create a dedicated ServiceAccount. Kavita never talks to the Kubernetes
  # API, so it gets no mounted token either.
  create: true
  automount: false
  # -- Defaults to the fullname.
  name: ""
  annotations: {}

# -- Annotations added to the pod. Kavita ships no Prometheus exporter, so there
# is no scrape annotation to render here.
podAnnotations: {}
podLabels: {}

# Pod-level security.
#
# `fsGroup` is deliberately NOT set: local-path volumes are hostPath-backed, and
# the kubelet does not apply fsGroup ownership to them, so setting it would look
# meaningful and do nothing.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Container-level security.
#
# The image is a LinuxServer base: `s6` starts as root, prepares `/config`, then
# drops to PUID/PGID 1100. That is why `runAsNonRoot` and `runAsUser` are absent —
# the container would not start — and why the capability set keeps exactly the
# three calls that init makes: CHOWN to fix ownership of `/config`, SETUID/SETGID
# to drop. Nothing else is granted, and `privileged` is stated so the default is
# never left to a reviewer's memory.
#
# `readOnlyRootFilesystem` is an attempt, not a settled fact: it stays only if the
# container starts, indexes a library and serves a page with it on. The Deployment
# mounts emptyDir at /run and /tmp for this reason. If the image turns out to
# write somewhere else, flip this one value to false: the setting and both
# emptyDirs come out together, and the chart README records why — a setting that
# breaks the app is worse than its absence.
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    add: [CHOWN, SETUID, SETGID]

service:
  type: ClusterIP
  port: 5000

container:
  # -- Container port. Defaults to `service.port` when left empty; set it only
  # when the app listens on a different port than the Service exposes.
  port: null

ingressRoute:
  # -- Render the Traefik IngressRoutes. This repo never uses a core-v1 Ingress
  # object: Traefik's own CRDs only.
  enabled: true
  # -- API group. `traefik.containo.us/v1alpha1` is what the cluster's Traefik
  # 2.x watches today; flip this to `traefik.io/v1alpha1` when Traefik v3 lands.
  apiVersion: traefik.containo.us/v1alpha1
  # -- Public host, served over TLS on `websecure`. The plain-HTTP router on
  # `web` redirects here.
  host: kavita.kub.home.ashudev.com
  # -- Path prefix. `/` matches everything.
  pathPrefix: /
  # -- Render the `web` router that redirects to HTTPS, and the Middleware it uses.
  redirectToHttps: true
  # -- Middlewares on the HTTPS router, rendered as
  # `<namespace>-<name>@kubernetescrd`. The redirect router always carries the
  # redirect Middleware instead.
  middlewares: []
  labels: {}
  annotations: {}
  tls:
    # -- Send the router over TLS.
    enabled: true
    # -- Use a pre-existing certificate instead of asking Traefik to issue one.
    secretName: ""
    # -- Traefik ACME resolver name.
    certResolver: myresolver
    # -- TLSOption resource in this namespace, rendered by `templates/tls-option.yaml`.
    options: kavita-tlsoption

storage:
  # -- Render the config PersistentVolumeClaim.
  enabled: true
  # -- Use an existing claim instead of the one this chart creates.
  existingClaim: ""
  className: local-path
  accessModes:
    - ReadWriteOnce
  # -- 2Gi, not the usual 128Mi. `/config` holds Kavita's SQLite database plus the
  # cover thumbnails and the page cache it generates for every chapter it has
  # served, and that cache grows with the library. The number is a guess, recorded
  # as such: the app has not run in this shape, so it is re-sized from what the
  # claim actually holds after the library is indexed.
  size: 2Gi
  # -- Where the config volume is mounted inside the container.
  mountPath: /config
  # Calibre-Web Automated's library: the same claim it writes, mounted read-only
  # here. Kavita is a reader, never a writer (see the chart README).
  library:
    claim: pvc-books-media-nfs-subdir-external-provisioner
    mountPath: /books
    readOnly: true

# -- Environment variables, rendered inline into the container spec. Changing a
# value changes the pod template, so the Deployment rolls by itself. Prefer this
# for every non-secret value.
env:
  TZ: "Europe/Paris"
  # LinuxServer images drop from root to these IDs after preparing /config.
  # They match the rest of the media stack.
  PUID: "1100"
  PGID: "1100"
  # No log-level variable is set, and none would work: Kavita clears its
  # configuration sources at startup and loads only `config/appsettings.json`, so
  # environment variables never reach its logger. The level lives in
  # `LogLevelOptions.cs` at Information. Recorded as accepted debt in the README.
  #
  # Stops the .NET host builder watching appsettings.json for edits at runtime.
  # That watcher exists for development; in a container the file never changes,
  # so it is only a file watch and a log line. Carried over from the old chart.
  DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"

# -- Variables sourced from a Secret, as `{ name, valueFrom }`. Kept separate so
# a secret can never be pasted into the plain map above by accident.
extraEnv: []

# -- Bulk `envFrom` sources, usually `secretRef`. Rarely needed: prefer
# `extraEnv` so each secret key is explicit in the manifest.
envFrom: []

nodeSelector:
  # -- Every workload is pinned to a named node; local-path claims are node-bound.
  kubernetes.io/hostname: streaming

tolerations: []

affinity: {}

# Sized from the existing deployment's steady state: 15m CPU request, 256Mi
# memory request, 1Gi memory limit.
#
# No CPU limit, here or anywhere in this cluster: a limit throttles exactly the
# short burst this app needs while generating a chapter's page cache, and the
# node's capacity is the real ceiling. The 15m request is only there so the
# scheduler places the pod.
resources:
  requests:
    cpu: 15m
    memory: 256Mi
  limits:
    memory: 1Gi

# Probes. `/api/health` is Kavita's unauthenticated health endpoint and answers
# as soon as the web stack is serving; `/` would answer too but redirects into
# the UI, so it is not used.
#
# Readiness is off on purpose. Kavita's only dependency is its SQLite database on
# the config volume, and a database that cannot be opened stops the process from
# starting at all; there is no second endpoint whose failure readiness could
# report while liveness stays green. Pointing readiness at `/api/health` as well
# would duplicate liveness and turn a slow response into a restart loop. This is
# the documented readiness exception (see the chart README).
#
# The startup probe holds the other one through a first start. A restart after an
# upgrade only migrates the database, which 150s covers; a first boot on a fresh
# `/config` creates that database, runs the migrations that follow and seeds the
# default user, so the budget follows `calibre-web-automated`'s first-start shape —
# 10s × 60 = 600s. Nothing waits that long in practice; the ceiling only means a
# slow first boot is not killed and restarted in a loop, and liveness does not run
# until startup succeeds.
probes:
  startup:
    enabled: true
    path: /api/health
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60
  liveness:
    enabled: true
    path: /api/health
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: false
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
