# Default values for prowlarr.
# This chart follows the contract in docs/charts/README.md and the shape of the
# reference chart, media-stack/autobrr. The differences are the ones this app needs:
# a LinuxServer image that starts as root and drops to PUID/PGID, an exportarr
# sidecar, and probes on Prowlarr's own `/ping` endpoint.

# -- Override the chart name.
nameOverride: ""
# -- Override the generated release name.
fullnameOverride: ""

replicaCount: 1

# -- Deployment strategy. `Recreate` is required for anything with a config volume:
# ReadWriteOnce volumes cannot be attached to an old and a new pod at the same time.
strategy: Recreate

image:
  # LinuxServer publishes on lscr.io. The image starts as root and drops to
  # PUID/PGID through s6; that is why the securityContext below cannot use
  # runAsNonRoot (see the chart README).
  repository: lscr.io/linuxserver/prowlarr
  # -- Pin the tag. Never `latest`. Renovate manages this.
  tag: "2.7.0.5723-ls168"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  # -- Create a dedicated ServiceAccount. Prowlarr never talks to the Kubernetes
  # API, so it gets no mounted token either.
  create: true
  automount: false
  # -- Defaults to the fullname.
  name: ""
  annotations: {}

# -- Annotations added to the pod, on top of the scrape annotations this chart
# renders itself while the exporter is enabled. Do not repeat `prometheus.io/*`
# here: the exporter block below owns them, so the announced port cannot drift
# from the listener.
podAnnotations: {}
podLabels: {}

# Pod-level security.
#
# `fsGroup` is deliberately NOT set: local-path volumes are hostPath-backed, and
# the kubelet does not apply fsGroup ownership to them, so setting it would look
# meaningful and do nothing.
#
# The LinuxServer image is not started as a non-root user: its s6 init must run
# as root to prepare `/config` and then drop to PUID/PGID 1100. Setting
# `runAsNonRoot` or `runAsUser` here prevents the container from starting at all.
# `allowPrivilegeEscalation: false` and the runtime seccomp profile still apply.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 9696

container:
  # -- Container port. Defaults to `service.port` when left empty; set it only
  # when the app listens on a different port than the Service exposes.
  port: null

ingressRoute:
  # -- Render a Traefik IngressRoute. This repo never uses
  # networking.k8s.io/v1 Ingress.
  enabled: true
  # -- API group. `traefik.containo.us/v1alpha1` is what the cluster's Traefik
  # 2.x watches today; flip this to `traefik.io/v1alpha1` when Traefik v3 lands.
  apiVersion: traefik.containo.us/v1alpha1
  # -- Traefik entry points. `web` is plain HTTP on kub.local; `websecure` is TLS.
  entryPoints:
    - web
  # -- Single host. For a second host, copy the chart.
  host: prowlarr.kub.local
  # -- Path prefix. `/` matches everything.
  pathPrefix: /
  # -- Middlewares, rendered as `<namespace>-<name>@kubernetescrd`.
  # Example: [{ name: authentik, namespace: kube-system }]
  middlewares: []
  labels: {}
  annotations: {}
  tls:
    # -- Send the router over TLS. Requires the tls block below to mean anything.
    enabled: false
    # -- Use a pre-existing certificate instead of asking Traefik to issue one.
    secretName: ""
    # -- Traefik ACME resolver name, for example `myresolver`.
    certResolver: ""
    # -- TLSOption resource name in this namespace.
    options: ""

storage:
  # -- Render the config PersistentVolumeClaim. Set to false only when the app
  # genuinely keeps no state.
  enabled: true
  # -- Use an existing claim instead of the one this chart creates.
  existingClaim: ""
  className: local-path
  accessModes:
    - ReadWriteOnce
  # -- Config volumes hold settings, not media. 128Mi is the house standard.
  size: 128Mi
  # -- Where the config volume is mounted inside the container.
  mountPath: /config

# -- Environment variables, rendered inline into the container spec. Changing a
# value changes the pod template, so the Deployment rolls by itself. Prefer this
# for every non-secret value.
env:
  TZ: "Europe/Paris"
  # LinuxServer images drop from root to these IDs after preparing /config.
  # They match the rest of the media stack.
  PUID: "1100"
  PGID: "1100"
  # Warnings and errors only. Fluent Bit ships every container line to Loki
  # unfiltered, and Prowlarr's default is `info`: one line per HTTP request,
  # indexer sync and search. `PROWLARR__LOG__LEVEL` is the file level,
  # `CONSOLELEVEL` is stdout (the one Loki sees); both are raised together so a
  # debugging session does not leave one of them behind. The indexer and history
  # views in the UI are the operational record, not the log.
  PROWLARR__LOG__LEVEL: "warn"
  PROWLARR__LOG__CONSOLELEVEL: "warn"

# -- Variables sourced from a Secret, as `{ name, valueFrom }`. Kept separate so
# a secret can never be pasted into the plain map above by accident.
extraEnv: []

# -- Bulk `envFrom` sources, usually `secretRef`. Rarely needed: prefer
# `extraEnv` so each secret key is explicit in the manifest.
envFrom: []

# -- Additional volumes, rendered verbatim into the pod spec.
volumes: []

# -- Additional volume mounts, rendered verbatim into the container.
volumeMounts: []

# Prowlarr's Prometheus exporter, run as a sidecar (exportarr).
#
# The scrape annotations are rendered from this block, so disabling the sidecar
# removes them too and the announced port cannot drift from the listener.
#
# The key comes from the `prowlarr` Secret. `APIKEY` is the v1 spelling of
# `API_KEY` and exportarr v2.3 still accepts it. A key that no longer matches the
# app makes /metrics answer HTTP 500 while the pod stays Ready, so check the
# Prometheus target, not the pod status. The chart README has the rotation steps.
exportarr:
  # -- Render the sidecar and its scrape annotations.
  enabled: true
  image:
    repository: ghcr.io/onedr0p/exportarr
    pullPolicy: IfNotPresent
    tag: "v2.3.0"
  # -- Port exportarr listens on, and the port named in the scrape annotation.
  port: 9707
  apiKey:
    # -- Secret holding Prowlarr's API key. Empty means the fullname, which is
    # the `prowlarr` Secret in the media-stack namespace.
    secretName: ""
    secretKey: secret
  resources:
    requests:
      cpu: 2m
      memory: 56Mi
    limits:
      memory: 112Mi

nodeSelector:
  # -- Every workload is pinned to a named node; local-path claims are node-bound.
  kubernetes.io/hostname: streaming

tolerations: []

affinity: {}

# Sized from Prometheus on 2026-11-12, over the first day the monitoring stack
# had data:
#   memory in use (working set)  210Mi steady, 248Mi peak over one hour
#   CPU                          ~3m at p95
#
# No CPU limit, here or anywhere in this cluster: a limit throttles exactly the
# short burst this app needs during an indexer sync, and the node's capacity is
# the real ceiling. The 10m request is only there so the scheduler places the pod.
#
# The memory limit is roughly 4x the observed peak — headroom for a large indexer
# sync, with file cache as the first thing the kernel reclaims under pressure.
resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    memory: 1Gi

# Probes. `/ping` is Prowlarr's own unauthenticated health endpoint and answers
# `{"status":"OK"}` as soon as the web stack is serving. The API's `/health`
# endpoint would be a stronger readiness check but it requires the API key, and a
# probe cannot read a Secret.
#
# Liveness and readiness share the endpoint on purpose, as in flaresolverr:
# Prowlarr's only dependency is its SQLite database on the config volume, and a
# database that cannot be opened stops the process from starting at all, so there
# is no separate dependency whose failure readiness could report while liveness
# stays green.
#
# The startup probe holds the other two through a first start after a version
# upgrade, when the database is migrated and the app can take noticeably longer
# than a restart.
probes:
  startup:
    enabled: true
    path: /ping
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  liveness:
    enabled: true
    path: /ping
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /ping
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
