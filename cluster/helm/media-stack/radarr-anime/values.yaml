# Default values for radarr-anime.
# This chart follows the contract in docs/charts/README.md and the shape of
# `prowlarr`, the worked *arr example. The differences are the ones this app needs:
# a LinuxServer image that starts as root and drops to PUID/PGID, an exportarr
# sidecar, probes on Radarr's own `/ping`, and the two media claims it reads.

# -- Override the chart name.
nameOverride: ""
# -- Override the generated release name.
fullnameOverride: ""

replicaCount: 1

# -- `Recreate` is required with a ReadWriteOnce config volume.
strategy: Recreate

image:
  # LinuxServer publishes on lscr.io. The image starts as root and drops to
  # PUID/PGID through s6, so the securityContext cannot use runAsNonRoot.
  repository: lscr.io/linuxserver/radarr
  # -- Pin the tag. Never `latest`. Renovate manages this.
  tag: "7.0.3.10918-ls328"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  # -- Create a dedicated ServiceAccount with no mounted token: Radarr never
  # talks to the Kubernetes API.
  create: true
  automount: false
  # -- Defaults to the fullname.
  name: ""
  annotations: {}

# -- Extra pod annotations. Do not repeat `prometheus.io/*` here: the exportarr
# block owns them, so the announced port cannot drift from the listener.
podAnnotations: {}
podLabels: {}

# `fsGroup` is deliberately absent: local-path is hostPath-backed and the kubelet
# does not apply fsGroup ownership to it. The LinuxServer init needs root to
# prepare /config, then drops to PUID/PGID.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 7878

container:
  # -- Container port. Defaults to `service.port`; set only when the app listens
  # somewhere else.
  port: null

ingressRoute:
  # -- Render a Traefik IngressRoute. This repo never uses networking.k8s.io.
  enabled: true
  # -- API group. Flip to `traefik.io/v1alpha1` when Traefik v3 lands.
  apiVersion: traefik.containo.us/v1alpha1
  entryPoints:
    - websecure
  host: radarr-anime.kub.local
  pathPrefix: /
  # -- Render the plain-HTTP mirror router that redirects to this one.
  redirectToHttps: true
  # -- Middlewares, rendered as `<namespace>-<name>@kubernetescrd`.
  # The LAN gate runs first: an outside request is rejected before anything else.
  # No authentik forward-auth here: Radarr 7 signs users in with OIDC itself
  # (Settings -> General -> Authentication = OIDC), so a gate in front would be a
  # second prompt and would still carry no identity into the app.
  middlewares:
    - name: lan-only
      namespace: kube-system
  # -- Middlewares for the `/api` rule, rendered as a second, higher-priority route
  # on the same host. Empty means `/api` is gated like the rest of the app; here it
  # is set to `lan-only` alone so scripts can call the API without a browser session.
  #
  # Radarr's API is not part of the browser session: every `/api/v3` request must
  # carry `X-Api-Key`, and one without it gets `401` from Radarr itself. `lan-only`
  # stays, so the API answers the LAN, WireGuard and the pod network that middleware
  # already allows, never the internet, and the UI route above keeps its OIDC sign-in.
  apiBypassMiddlewares:
    - name: lan-only
      namespace: kube-system
  labels: {}
  annotations: {}
  tls:
    # -- Send the router over TLS. On: the cluster serves `*.kub.local` from the
    # -- default certificate (`kube-system/local-cert`), and the `web` router only
    # -- redirects here. See docs/runbooks/internal-ca.md.
    enabled: true
    # -- Use a pre-existing certificate instead of asking Traefik to issue one.
    secretName: ""
    # -- Traefik ACME resolver name, for example `myresolver`.
    certResolver: ""
    # -- TLSOption resource name, from the `traefik-gate` chart.
    options: internal-tls
    # -- Namespace of that TLSOption.
    optionsNamespace: kube-system

storage:
  # -- Render the config claim. Radarr keeps its SQLite database there.
  enabled: true
  existingClaim: ""
  className: local-path
  accessModes:
    - ReadWriteOnce
  size: 128Mi
  mountPath: /config

# -- Inline environment. A change rolls the pod, so no ConfigMap.
env:
  TZ: "Europe/Paris"
  # LinuxServer images drop from root to these IDs after preparing /config.
  PUID: "1100"
  PGID: "1100"
  # ASP.NET Core's own switch for reverse proxies: honour `X-Forwarded-Proto`, which
  # is what makes the app build `https://` URLs. Without it the login redirect and any
  # absolute link point at plain HTTP, and the browser takes a pointless hop through
  # the 301 that the `web` router answers. Harmless where the app never emits an
  # absolute URL.
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  # Warnings and errors only: Fluent Bit ships every line to Loki unfiltered and
  # Radarr's default is `info`, one line per request, scan and import. The file
  # level and the console level (the one Loki sees) move together.
  RADARR__LOG__LEVEL: "warn"
  RADARR__LOG__CONSOLELEVEL: "warn"

# -- Variables sourced from a Secret, as `{ name, valueFrom }`.
extraEnv: []
envFrom: []

# qBittorrent's completed downloads. Radarr imports from here into the library.
downloads:
  existingClaim: pvc-nfs-qbittorrent-download-nfs-subdir-external-provisioner
  mountPath: /downloads

# The Plex movie library. Radarr writes new release folders here.
media:
  existingClaim: pvc-plex-media
  mountPath: /movies

# -- Additional volumes, rendered verbatim.
volumes: []
# -- Additional volume mounts, rendered verbatim.
volumeMounts: []

exportarr:
  # -- Render the sidecar and its scrape annotations together.
  enabled: true
  image:
    repository: ghcr.io/onedr0p/exportarr
    pullPolicy: IfNotPresent
    tag: "v2.3.0"
  # -- Port exportarr listens on, and the port in the scrape annotation.
  port: 9707
  apiKey:
    # -- Secret holding Radarr's API key. Empty means the fullname.
    secretName: ""
    secretKey: secret
  # Re-measured 2026-11-18 over 5 days, across the eight sidecars: p95 26Mi,
  # peak 38Mi. 32Mi request, 64Mi limit (peak x 1.5 rounded up).
  resources:
    requests:
      cpu: 2m
      memory: 32Mi
    limits:
      memory: 64Mi

nodeSelector:
  # -- Every workload is pinned; local-path claims are node-bound.
  kubernetes.io/hostname: streaming

tolerations: []
affinity: {}

# Sized from Prometheus over 30 days: 257Mi peak working set, 20m peak CPU.
# No CPU limit, here or anywhere in this cluster: a limit throttles the short
# burst an import or a library scan needs. The memory limit is 1.5x the 2026-11-18 peak.
# Re-measured 2026-11-18 over the 5 days Prometheus retains: p95 299Mi, peak 634Mi
# (working set, page cache included).
resources:
  requests:
    cpu: 10m
    memory: 320Mi
  limits:
    memory: 1Gi

# Probes on `/ping`, Radarr's own unauthenticated health endpoint.
# Liveness and readiness share it on purpose: the only dependency is the SQLite
# database, and a database that cannot be opened stops the process from starting.
# Startup gets 300s because the first start after a version bump migrates it.
probes:
  startup:
    enabled: true
    path: /ping
    # -- Host header the probe sends. Allowed Hosts names real hostnames, and the
    # kubelet would otherwise send the pod IP, which no list can contain.
    httpHeaders:
      - name: Host
        value: radarr-anime.kub.local
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60
  liveness:
    enabled: true
    path: /ping
    # -- Host header the probe sends. Allowed Hosts names real hostnames, and the
    # kubelet would otherwise send the pod IP, which no list can contain.
    httpHeaders:
      - name: Host
        value: radarr-anime.kub.local
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /ping
    # -- Host header the probe sends. Allowed Hosts names real hostnames, and the
    # kubelet would otherwise send the pod IP, which no list can contain.
    httpHeaders:
      - name: Host
        value: radarr-anime.kub.local
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
