# Default values for qbittorrent.
# Built against the contract in docs/charts/README.md; `autobrr` is the worked
# example it was reshaped from. What this chart adds on top is a privileged
# WireGuard sidecar and three claims, only one of which it owns.

# -- Override the chart name.
nameOverride: ""
# -- Override the generated release name.
fullnameOverride: ""

replicaCount: 1

# -- Deployment strategy. `Recreate` is required: the config and downloads
# claims are ReadWriteOnce and cannot attach to an old and a new pod at once.
strategy: Recreate

image:
  repository: ghcr.io/linuxserver/qbittorrent
  # -- Pin the tag. Never `latest`. Renovate manages this row.
  tag: 5.3.1_v2.1.3-ls490
  pullPolicy: IfNotPresent

# The name is historical: Renovate tracks this block as it stands, and renaming
# the key is how an image silently stops being updated.
vpnimage:
  repository: ghcr.io/linuxserver/wireguard
  # -- Pin the tag. Never `latest`. Renovate manages this row: the key name
  # contains `image`, which is what its helm-values manager matches on.
  tag: 1.0.20260223-r0-ls130
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  # -- Create a dedicated ServiceAccount. qBittorrent never talks to the
  # Kubernetes API, so it gets no mounted token either.
  create: true
  automount: false
  # -- Defaults to the fullname.
  name: ""
  annotations: {}

# -- Annotations added to the pod. `setGateway` predates this rebuild and is kept
# as it was found; nothing in this repo reads it.
podAnnotations:
  setGateway: "true"
podLabels: {}

# Pod-level security. `fsGroup` is deliberately NOT set: one of the three claims
# is NFS and the kubelet does not apply it to a hostPath-backed `local-path`
# claim either, so setting it would look correct and do nothing.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Container-level security for qBittorrent itself.
#
# `runAsNonRoot` is not an option: the LinuxServer image starts as root, prepares
# `/config` and `/downloads` through s6, then drops to `PUID`/`PGID` 1100. The
# capabilities are therefore kept as the image expects them, and only privilege
# escalation is refused.
securityContext:
  allowPrivilegeEscalation: false

# The WireGuard sidecar. It owns the pod's network namespace, so it is the
# container the tunnel is built in. `privileged` plus NET_ADMIN/SYS_MODULE is the
# image's documented requirement, not a shortcut: creating the interface and
# loading wireguard need both, and `/dev/net/tun` must be mounted.
vpn:
  # -- Host device the sidecar mounts. Required by the LinuxServer image.
  tunDevice: /dev/net/tun
  # The tunnel's `AllowedIPs` is `0.0.0.0/0`, so wg-quick installs its default
  # route in its own table (51820) and keeps LAN access with a policy rule that
  # falls back to the pod's main table first, defaults suppressed
  # (`ip rule ... table main suppress_prefixlength 0`). A pod's main table holds
  # its own subnet and a default route, and nothing else, so every address
  # outside that subnet — every ClusterIP — matched nothing specific and went
  # into the tunnel. That is why the post-download hook to `cross-seed:2468`
  # timed out after 127 s, the kernel's SYN retry budget, instead of being
  # refused: 154 times in the 24 h to 2026-11-19.
  #
  # These two ranges are added to the main table, through the pod's own gateway,
  # by the `vpn-cluster-routes` init container before the sidecar starts. The
  # rule above consults that table first, so the tunnel keeps every other
  # destination and cluster traffic never enters it. Add a range here when
  # something else in the cluster must be reachable from inside this pod.
  clusterRoutes:
    - 10.42.0.0/16
    - 10.43.0.0/16
  routeFix:
    # -- Image for the init container that adds `clusterRoutes`. It only needs
    # `sh`, `awk` and busybox's `ip`. Same image as the downloads probe.
    image: busybox:1.38
    # -- Seconds of runtime, no sample, a ceiling only.
    resources:
      requests:
        cpu: 1m
        memory: 4Mi
      limits:
        memory: 16Mi
  securityContext:
    privileged: true
    capabilities:
      add:
        - NET_ADMIN
        - SYS_MODULE
    # Privileged containers are not confined by seccomp; saying so explicitly
    # stops the pod-level RuntimeDefault from being read as applying here.
    seccompProfile:
      type: Unconfined
  # Measured 2026-11-18 over 5 days: p95 15Mi, peak 22Mi. The tunnel's buffers
  # live in the kernel and are not charged to the container, so 64Mi is already
  # 2.9x the peak.
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

service:
  type: ClusterIP
  # The qBittorrent WebUI listens on 8080. This one value drives the container
  # port, the Service and the IngressRoute target.
  port: 8080
  # -- Name of the Service port, reused by the container port and the probes.
  portName: torrent-webui

torrent:
  # -- Announce and peer port opened on the container as TCP and UDP. The tunnel
  # forwards it; nothing in the cluster reaches it, so it is not on the Service.
  port: 18515

container:
  # -- Container port. Defaults to `service.port`; set it only when the app
  # listens on a different port than the Service exposes.
  port: null

# The pod runs with `dnsPolicy: None` and public resolvers on purpose: the
# torrent client's DNS must not depend on the cluster's. The cost is that cluster
# names do not resolve, which is why the post-download hook gets one hostAlias
# below instead of a DNS route.
dns:
  policy: None
  nameservers:
    - 1.1.1.1
    - 1.0.0.1
  # The post-download hook calls cross-seed by name. This is the cross-seed
  # Service ClusterIP; update it if that Service is recreated.
  crossSeedServiceIP: "10.43.104.9"

ingressRoute:
  # -- Render the IngressRoutes. Traefik CRDs only: this chart never renders a
  # networking.k8s.io/v1 Ingress.
  enabled: true
  # -- API group. `traefik.io/v1alpha1` is what the cluster's Traefik
  # 2.x watches today; flip this to `traefik.io/v1alpha1` when v3 lands.
  apiVersion: traefik.io/v1alpha1
  # -- Traefik entry points. `websecure` carries the route; `web` only redirects.
  entryPoints:
    - websecure
  host: qbittorrent.kub.local
  # -- Path prefix. `/` matches everything.
  pathPrefix: /
  # -- Render the plain-HTTP mirror router.
  redirectToHttps: true
  # -- Middlewares, rendered as `<namespace>-<name>@kubernetescrd`, in order.
  # --
  # -- `lan-only` is the network floor shared with every non-public route, and it
  # -- runs first: an outside request is refused before the forward-auth round trip.
  # --
  # -- `authentik-forwardauth` is the gate. Its authentik side is
  # -- `cluster/helm/authentik/files/app-qbittorrent.yaml`: a `forward_single` proxy
  # -- provider for this host, bound to the `authentik Admins` group, so a signed-in
  # -- non-admin is answered 403 instead of being shown this app's page.
  # --
  # -- No `/api` exemption, unlike the *arrs: nothing in the cluster reaches this
  # -- host. cross-seed drives the API at `http://qbittorrent:8080` (its log names
  # -- the client as `@qbittorrent:8080`), `qbittorrent-exporter` uses the same
  # -- Service, and every URL autobrr logs is a Service name as well
  # -- (`radarr:7878`, `sonarr-anime:8989`), with no `kub.local` host anywhere in its
  # -- logs. API clients never cross Traefik, so an `/api` rule would open a hole
  # -- nothing needs. Revisit if a client is ever pointed at the hostname.
  # --
  # -- The WebUI's own login is bypassed for the pod network, not disabled: since
  # -- 2026-11-18 `bypass_auth_subnet_whitelist_enabled=true` with
  # -- `bypass_auth_subnet_whitelist=10.42.0.0/16`, so a browser arriving through
  # -- Traefik (whose pod address qBittorrent sees) lands straight in the WebUI and
  # -- this gate is the only prompt, and the only control for anything else on the
  # -- pod network. Those two preferences live in `qBittorrent.conf` on the config
  # -- claim, not in this file: re-apply them on a rebuilt volume.
  # --
  # -- `bypass_local_auth` stays false, so `kubectl port-forward svc/qbittorrent
  # -- 8080:8080` still asks for the password. That is the break-glass while
  # -- authentik is down. Do not remove the gate without restoring the login first.
  middlewares:
    - name: lan-only
      namespace: kube-system
    - name: authentik-forwardauth
      namespace: kube-system
  labels: {}
  annotations: {}
  # -- Extra middleware set for an `/api` rule at `priority: 100`. Empty here on
  # purpose: the paragraphs above are the reason there is no exemption.
  apiBypassMiddlewares: []
  tls:
    # -- Send the router over TLS, from the cluster default certificate
    # -- (`kube-system/local-cert`). See docs/runbooks/internal-ca.md.
    enabled: true
    # -- Use a pre-existing certificate instead of the cluster default.
    secretName: ""
    # -- Traefik ACME resolver name, for example `ovhresolver`.
    certResolver: ""
    # -- TLSOption from the `traefik-gate` chart.
    options: internal-tls
    # -- Namespace of that TLSOption.
    optionsNamespace: kube-system

# Three claims, and this chart owns two of them.
storage:
  # qBittorrent's own settings: `qBittorrent.conf`, the resume data and one
  # `.fastresume` per torrent under `qBittorrent/BT_backup`, and the VueTorrent
  # tree under `ui/`.
  #
  # On `local-path`, because this is configuration: `docs/charts/README.md`
  # requires it, and this claim is the counter-example that rule was written
  # for. It spent years on the `nfs-qbittorrent-config` export, where the
  # exporter's per-scrape `app/preferences` call read it and blocked for the
  # exporter's whole 5 s timeout — taking the Web UI and every API client with
  # it. Moved on 2026-11-25, board card 758; `docs/qbittorrent-webui-stalls.md`
  # has the measurement either side.
  #
  # The size is measured, not guessed: 435 MB on the export on 2026-11-25,
  # 156 MB of it the resume data. 2Gi carries the log and GeoIP trees the app
  # keeps here as well, which the backup row excludes.
  config:
    # -- Claim name. Defaults to `<fullname>-config`, which is `qbittorrent-config`.
    claimName: ""
    className: local-path
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    mountPath: /config
  # The download export. Same ownership, same warning.
  downloads:
    existingClaim: pvc-nfs-qbittorrent-download-nfs-subdir-external-provisioner
    mountPath: /downloads
  # In-flight downloads: where a torrent's data is written until it is complete.
  #
  # On `local-path` on purpose, and this is the whole point of the claim. The
  # app writes roughly 2,000 open + write + close a second against the export
  # while it downloads (16 KiB pieces, ~33 MB/s measured 2026-11-25), over the
  # single TCP connection `nas` shares with every other mount on `streaming`.
  # That load is what wedges the client: one page is left waiting to be written
  # for an I/O nothing performs, and every `close()` of that file then blocks
  # forever, which takes the WebUI's session mutex with it (board card 777,
  # `docs/qbittorrent-webui-stalls.md`). With the temp path here, the export only
  # sees one sequential copy per finished torrent.
  #
  # The chart mounts the directory; it does **not** turn the feature on. The app
  # has to be told, in `qBittorrent.conf` on the config claim:
  # `Session\TempPath` set to `mountPath` below and `Session\TempPathEnabled=true`
  # (the WebUI's Downloads > "Keep incomplete torrents in" pair, or
  # `POST /api/v2/app/setPreferences`). Both are preferences, and preferences
  # live on the claim — so a rebuilt config claim loses them, silently, and the
  # NFS load comes back. Check them when this claim is recreated.
  #
  # `local-path` does not enforce the request below; it is the working set to
  # allow for, and the node must have the room (`streaming`'s `/mnt/ssd0` had
  # 856 GB free on 2026-11-25). Nothing here is worth backing up: it holds only
  # unfinished torrents, which the client re-downloads.
  temp:
    claimName: ""
    className: local-path
    accessModes:
      - ReadWriteOnce
    size: 400Gi
    mountPath: /downloads-temp
  # The WireGuard keys and `wg_confs/`. This one the chart creates. Left empty,
  # the name is `<fullname>-vpn-config`, which is the claim the live pod mounts,
  # so the default is also the no-data-move answer.
  vpn:
    claimName: ""
    className: local-path
    accessModes:
      - ReadWriteOnce
    size: 128Mi
    mountPath: /config

# The installer for the WebUI: an init container, so it runs before qBittorrent
# starts. qBittorrent serves VueTorrent's static files from the config claim
# (`WebUI\RootFolder=/config/ui`), and this init container puts them there: it
# downloads the release asset only when the `version.txt` sitting in `/config/ui`
# differs from `version` below, or when `public/index.html` is missing, so an
# ordinary pod restart installs nothing and needs no network.
#
# Nothing in the installer may fail the pod. The UI is an asset; the torrent
# client is the workload, so a first boot with no route to github.com — a cold
# cluster, a fresh claim, a GitHub outage — leaves `/config/ui` as it is, says
# why in the pod's start log, and qBittorrent starts on its stock WebUI.
#
# What it repairs, and when: it installs when `version.txt` differs from
# `version` below **or** when `/config/ui/public/index.html` is gone (the app
# serves `<RootFolder>/public`, so the version file alone is not an install).
# After a verified swap it writes `WebUI\AlternativeUIEnabled=true` into
# `/config/qBittorrent/qBittorrent.conf` and chowns that file to `PUID`/`PGID`.
# qBittorrent clears the preference by itself when it finds no UI, and rewrites
# the file from memory on exit, so the init container is the only place it can be
# set safely. It is written **only when an install happened**, so an operator who
# turned the alternative UI off in the WebUI keeps it off across restarts.
# The archive is kept at `/config/vuetorrent-<version>.zip`, and a later install
# of that version falls back to it when github.com is unreachable.
#
# A first boot with no network still serves the stock WebUI: there are no files
# on the claim and no image carries them. That is accepted, not a defect.
#
# The pairing with qBittorrent is not optional and nothing enforces it: the app
# serves `<RootFolder>/public`, so `WebUI\RootFolder` must stay `/config/ui`, the
# folder this installer fills. When that file is missing, qBittorrent answers the
# next request for `index.html` by writing `AlternativeUIEnabled=false` to its own
# config and serving the stock WebUI (`webapplication.cpp`, the `INDEX_HTML`
# branch). That is how a hand-flattened tree on 2026-11-18 silently reverted to the
# default UI while the files were perfectly fine.
#
# Two traps in one, both paid for that day: the names in `qBittorrent.conf` are not
# the names the WebUI API takes, and `setPreferences` answers `200` to a name it
# does not know, so a wrong guess reads like success.
#
#     qBittorrent.conf                  API JSON
#     WebUI\AlternativeUIEnabled        alternative_webui_enabled
#     WebUI\RootFolder                  alternative_webui_path
#     WebUI\AuthSubnetWhitelistEnabled  bypass_auth_subnet_whitelist_enabled
#     WebUI\AuthSubnetWhitelist         bypass_auth_subnet_whitelist
#
# The manual path, for the one state the installer does not repair: the
# preference cleared while the tree is complete. qBittorrent clears it by itself
# when it finds no UI, and the running process rewrites the file from memory on
# exit — so with the files already in place the next boot installs nothing and
# leaves the preference as it is. Run this from the pod's own address so the auth
# whitelist covers it, then read back with `GET /api/v2/app/preferences` rather
# than trusting the `200`:
#
#     curl -X POST "http://$(hostname -i):8080/api/v2/app/setPreferences" \
#       --data-urlencode 'json={"alternative_webui_enabled":true,"alternative_webui_path":"/config/ui"}'
#
# Renovate reads the two `# renovate:` annotations: the first moves `version`,
# the second keeps the installer's Alpine base off a floating tag. Each
# `depName` must stay equal to the value on the line under it.
vueTorrent:
  # -- Repo that publishes the release asset `vuetorrent.zip`. The project moved
  # -- from `WDaan/VueTorrent`, which now redirects here; the old URL still
  # -- answers, so a stale name fails quietly rather than loudly.
  repository: VueTorrent/VueTorrent
  # -- Release to install, without the `v` its tag carries. The template re-adds
  # -- it, so a value written either way produces the same URL.
  # renovate: datasource=github-releases depName=VueTorrent/VueTorrent
  version: "2.37.0"
  # -- Tag of the `alpine` image the installer runs in. It is pinned because the
  # -- installer needs `apk`, which `busybox` does not carry.
  # renovate: datasource=docker depName=alpine
  initTag: "3.24"
  # -- The installer runs for a few seconds at pod start, which is shorter than
  # the scrape interval, so there is no sample to size it from. These are a
  # protection ceiling, not a measurement: `apk add unzip` and one download.
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi

# qBittorrent drops torrents it cannot restore ("Failed to restore torrent")
# when it starts before the NFS downloads volume answers. Two restarts earlier
# today lost 8 and 14 torrent entries that way. This init container waits for
# /downloads to accept a write before the main container starts, and gives up
# after two minutes rather than blocking the deployment forever.
waitForDownloads:
  enabled: true
  image: busybox:1.38
  # -- Same shape as the installer: seconds of runtime, no sample, a ceiling only.
  resources:
    requests:
      cpu: 1m
      memory: 8Mi
    limits:
      memory: 32Mi

# -- Environment variables, rendered inline into both containers. Changing a
# value changes the pod template, so the Deployment rolls by itself.
env:
  TZ: "Europe/Paris"
  PUID: "1100"
  PGID: "1100"
  # No LOG_LEVEL, and nothing a variable could set: qBittorrent has no verbosity
  # setting, only file-logging on and off in the WebUI. The README's Metrics and
  # logs section records what the fixed level costs.

# -- Variables sourced from a Secret, as `{ name, valueFrom }`. Empty: the WebUI
# credentials live in `qBittorrent.conf` on the config claim, not in a Secret.
extraEnv: []

# -- Bulk `envFrom` sources. Empty: this chart has no secret to hand the app.
envFrom: []

# -- Additional volumes, rendered verbatim into the pod spec.
volumes: []

# -- Additional volume mounts, rendered verbatim into the app container.
volumeMounts: []

# Re-measured 2026-11-18 over the 5 days Prometheus retains: p95 9726Mi, peak
# 12256Mi (working set, page cache included).
# The request stays at RSS, not p95: the rest is download page cache.
resources:
  requests:
    cpu: 100m
    memory: 6Gi
  limits:
    memory: 12Gi

# Probes. qBittorrent exposes **no unauthenticated health endpoint**: the only
# public API path is `auth/login`, everything else answers 403 without a session,
# and the auth bypass in `qBittorrent.conf` covers the pod network only — the
# kubelet's own source address is not guaranteed to be inside it. An HTTP probe
# would therefore either fail forever or silently start relying on that bypass.
#
# The liveness probe is a TCP connect to the WebUI port instead: it fails when the
# listener stops accepting, which is what a restart can fix. It is a gamble with
# data, and the chart README records why: a stalled WebUI restarts the app without
# re-running `wait-for-downloads`, so a restart while the downloads export is
# unready is how torrents have been dropped before. It stayed because the stall it
# was firing on had a cause outside the app (the config claim on NFS, card 758), and
# that cause is fixed. There is no readiness probe: the process has no dependency
# that can fail while it answers — the NFS mount is checked by `wait-for-downloads`
# at startup, and the torrent session has no status endpoint. The chart README
# records the same decision in prose.
probes:
  liveness:
    enabled: true
    port: torrent-webui
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

nodeSelector:
  # -- Every workload is pinned to a named node; the local-path claim is node-bound.
  kubernetes.io/hostname: streaming

tolerations: []

affinity: {}
