# Default values for home.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/linuxserver/qbittorrent
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 5.3.0

vpnimage:
  repository: ghcr.io/linuxserver/wireguard
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 1.0.20260223

# The alternative WebUI. qBittorrent serves VueTorrent's static files from the
# config claim (`WebUI\RootFolder=/config/ui`), and the `init-qbittorrent`
# container puts them there: it downloads the release asset only when the
# `version.txt` sitting in `/config/ui` differs from `version` below, so an
# ordinary pod restart installs nothing and needs no network.
#
# The pairing with qBittorrent is not optional and nothing enforces it: the app
# serves `<RootFolder>/public`, so `WebUI\RootFolder` must stay `/config/ui`, the
# folder this installer fills. When that file is missing, qBittorrent answers the
# next request for `index.html` by writing `AlternativeUIEnabled=false` to its own
# config and serving the stock WebUI (`webapplication.cpp`, the `INDEX_HTML`
# branch). That is how a hand-flattened tree on 2026-11-18 silently reverted to the
# default UI while the files were perfectly fine.
#
# Two traps in one, both paid for that day: the names in `qBittorrent.conf` are not
# the names the WebUI API takes, and `setPreferences` answers `200` to a name it
# does not know, so a wrong guess reads like success.
#
#     qBittorrent.conf                  API JSON
#     WebUI\AlternativeUIEnabled        alternative_webui_enabled
#     WebUI\RootFolder                  alternative_webui_path
#     WebUI\AuthSubnetWhitelistEnabled  bypass_auth_subnet_whitelist_enabled
#     WebUI\AuthSubnetWhitelist         bypass_auth_subnet_whitelist
#
# Recovery, run from the pod's own address so the auth whitelist covers it, then
# read back with `GET /api/v2/app/preferences` rather than trusting the `200`:
#
#     curl -X POST "http://$(hostname -i):8080/api/v2/app/setPreferences" \
#       --data-urlencode 'json={"alternative_webui_enabled":true,"alternative_webui_path":"/config/ui"}'
#
# Renovate reads the two `# renovate:` annotations: the first moves `version`,
# the second keeps the installer's Alpine base off a floating tag. Each
# `depName` must stay equal to the value on the line under it.
vueTorrent:
  # -- Repo that publishes the release asset `vuetorrent.zip`. The project moved
  # -- from `WDaan/VueTorrent`, which now redirects here; the old URL still
  # -- answers, so a stale name fails quietly rather than loudly.
  repository: VueTorrent/VueTorrent
  # -- Release to install, without the `v` its tag carries. The template re-adds
  # -- it, so a value written either way produces the same URL.
  # renovate: datasource=github-releases depName=VueTorrent/VueTorrent
  version: "2.37.0"
  # -- Tag of the `alpine` image the installer runs in. It is pinned because the
  # -- installer needs `apk`, which `busybox` does not carry.
  # renovate: datasource=docker depName=alpine
  initTag: "3.22"
  # -- The installer runs for a few seconds at pod start, which is shorter than
  # the scrape interval, so there is no sample to size it from. These are a
  # protection ceiling, not a measurement: `apk add unzip` and one download.
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      memory: 64Mi

# The post-download hook calls cross-seed by name. The pod runs with
# dnsPolicy: None and public resolvers on purpose, so cluster names do not
# resolve; this alias maps the one name the hook needs without routing the
# torrent client's DNS through the cluster. It is the cross-seed Service
# ClusterIP; update it if that Service is recreated.
crossSeedServiceIP: "10.43.104.9"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  setGateway: "true"

podSecurityContext: {}
# fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  # The qBittorrent WebUI listens on 8080, which is also the container port the
  # Deployment opens and the port the IngressRoute targets by name. This value
  # was 32400 (Plex's port, left over from the scaffold) and the Service template
  # ignored it, so the two could disagree without anyone noticing.
  port: 8080

ingress:
  # -- Render the two IngressRoutes. Traefik CRDs only: this chart never renders a
  # networking.k8s.io/v1 Ingress, and the host is not templated because the route
  # has always had exactly one.
  enabled: true
  host: qbittorrent.kub.local
  # -- Traefik entry points. `websecure` carries the route; `web` only redirects.
  entryPoints:
    - websecure
  # -- Render the plain-HTTP mirror router.
  redirectToHttps: true
  # -- Middlewares, rendered as `<namespace>-<name>@kubernetescrd`, in order.
  # -- `lan-only` is the network floor shared with every non-public route, and it
  # -- runs first: an outside request is refused before the forward-auth round trip.
  # --
  # -- `authentik-forwardauth` is the gate. Its authentik side is
  # -- `cluster/helm/authentik/files/app-qbittorrent.yaml`: a `forward_single` proxy
  # -- provider for this host, bound to the `authentik Admins` group, so a signed-in
  # -- non-admin is answered 403 instead of being shown this app's page.
  # --
  # -- No `/api` exemption, unlike the *arrs: nothing in the cluster reaches this
  # -- host. cross-seed drives the API at `http://qbittorrent:8080` (its log names
  # -- the client as `@qbittorrent:8080`), `qbittorrent-exporter` uses the same
  # -- Service, and every URL autobrr logs is a Service name as well
  # -- (`radarr:7878`, `sonarr-anime:8989`), with no `kub.local` host anywhere in its
  # -- logs. API clients never cross Traefik, so an `/api` rule would open a hole
  # -- nothing needs. Revisit if a client is ever pointed at the hostname.
  # --
  # -- The WebUI's own login is bypassed for the pod network, not disabled: since
  # -- 2026-11-18 `bypass_auth_subnet_whitelist_enabled=true` with
  # -- `bypass_auth_subnet_whitelist=10.42.0.0/16`, so a browser arriving through
  # -- Traefik (whose pod address qBittorrent sees) lands straight in the WebUI and
  # -- this gate is the only prompt, and the only control for anything else on the
  # -- pod network. Those two preferences live in `qBittorrent.conf` on the config
  # -- claim, not in this file: re-apply them on a rebuilt volume.
  # --
  # -- `bypass_local_auth` stays false, so `kubectl port-forward svc/qbittorrent
  # -- 8080:8080` still asks for the password. That is the break-glass while
  # -- authentik is down. Do not remove the gate without restoring the login first.
  middlewares:
    - name: lan-only
      namespace: kube-system
    - name: authentik-forwardauth
      namespace: kube-system
  annotations: {}
  tls:
    # -- Send the router over TLS, from the cluster default certificate
    # -- (`kube-system/local-cert`). See docs/runbooks/internal-ca.md.
    enabled: true
    # -- TLSOption from the `traefik-gate` chart.
    options: internal-tls
    optionsNamespace: kube-system
# Re-measured 2026-11-18 over the 5 days Prometheus retains: p95 9726Mi, peak 12256Mi
# (working set, page cache included).
# The request stays at RSS, not p95: the rest is download page cache.
resources:
  requests:
    cpu: 100m
    memory: 6Gi
  limits:
    memory: 12Gi

# WireGuard in kernel mode: the tunnel's buffers live in the kernel, not in
# this container. Measured peak is 4MiB memory and 0.02m CPU, so the previous
# 256Mi/50m reservation was pure over-reservation.
# Measured 2026-11-18 over 5 days: p95 15Mi, peak 22Mi. The tunnel's buffers
# live in the kernel and are not charged to the container, so 64Mi is already
# 2.9x the peak.
vpnresources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

# qBittorrent drops torrents it cannot restore ("Failed to restore torrent")
# when it starts before the NFS downloads volume answers. Two restarts earlier
# today lost 8 and 14 torrent entries that way. This init container waits for
# /downloads to accept a write before the main container starts, and gives up
# after two minutes rather than blocking the deployment forever.
waitForDownloads:
  enabled: true
  image: busybox:1.38
  # -- Same shape as the installer: seconds of runtime, no sample, a ceiling only.
  resources:
    requests:
      cpu: 1m
      memory: 8Mi
    limits:
      memory: 32Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector:
  kubernetes.io/hostname: streaming

tolerations: []

affinity: {}
