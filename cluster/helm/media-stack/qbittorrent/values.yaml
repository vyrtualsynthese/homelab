# Default values for home.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/linuxserver/qbittorrent
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 5.3.0

vpnimage:
  repository: ghcr.io/linuxserver/wireguard
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: 1.0.20260223

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  setGateway: "true"

podSecurityContext: {}
# fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 32400

ingress:
  enabled: true
  className: no
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Memory measured with Prometheus (2.5h window, 197 seeding torrents):
# working set peaked at 15.99GiB against the old 16GiB limit, of which
# 13.93GiB was page cache from mmap disk I/O and only 0.07GiB was RSS.
# Disk I/O is now POSIX (disk_io_type=2) and memory_working_set_limit=6144,
# so the process footprint is bounded by a ~6GiB libtorrent cache plus
# small anonymous memory. 12GiB keeps ~5GiB of headroom over that target.
# CPU peaked at 601m with five concurrent race torrents. The request follows the
# repo convention (1m-100m) because a request only reserves scheduling; what
# protects a race burst is that there is deliberately no CPU limit, so the
# single libtorrent network thread can use idle capacity instead of being
# throttled the moment a race starts.
resources:
  requests:
    cpu: 100m
    memory: 6Gi
  limits:
    memory: 12Gi

# WireGuard in kernel mode: the tunnel's buffers live in the kernel, not in
# this container. Measured peak is 4MiB memory and 0.02m CPU, so the previous
# 256Mi/50m reservation was pure over-reservation.
vpnresources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 128Mi

# qBittorrent drops torrents it cannot restore ("Failed to restore torrent")
# when it starts before the NFS downloads volume answers. Two restarts earlier
# today lost 8 and 14 torrent entries that way. This init container waits for
# /downloads to accept a write before the main container starts, and gives up
# after two minutes rather than blocking the deployment forever.
waitForDownloads:
  enabled: true
  image: busybox:1.36

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector:
  kubernetes.io/hostname: streaming

tolerations: []

affinity: {}
