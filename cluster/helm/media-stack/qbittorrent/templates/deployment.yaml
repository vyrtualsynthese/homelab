apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fullname" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "selectorLabels" . | nindent 8 }}
    spec:
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.0.0.1
      {{- with .Values.crossSeedServiceIP }}
      hostAliases:
        - ip: {{ . | quote }}
          hostnames:
            - cross-seed
      {{- end }}
      volumes:
        - name: qbittorrent-vpn-config-volume
          persistentVolumeClaim:
            claimName: qbittorrent-vpn-config
        - name: qbittorrent-config-volume
          persistentVolumeClaim:
            claimName: pvc-nfs-qbittorrent-config-nfs-subdir-external-provisioner
        - name: qbittorrent-download-volume
          persistentVolumeClaim:
            claimName: pvc-nfs-qbittorrent-download-nfs-subdir-external-provisioner
        - name: "dev-tun" # Needed for VPN
          hostPath:
            path: "/dev/net/tun"
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if .Values.waitForDownloads.enabled }}
        # Runs as the same uid as qBittorrent (PUID) so the probe sees exactly
        # what the main container will see on the NFS export. Bounded wait:
        # after 2 minutes it proceeds and lets qBittorrent start anyway.
        - name: wait-for-downloads
          image: {{ .Values.waitForDownloads.image }}
          securityContext:
            runAsUser: 1100
            runAsGroup: 1100
          command:
            - sh
            - -c
            - |
              i=0
              until touch /downloads/.mount-probe 2>/dev/null; do
                i=$((i+1))
                if [ "$i" -ge 60 ]; then
                  echo "downloads volume still not writable after 120s, proceeding"
                  exit 0
                fi
                sleep 2
              done
              rm -f /downloads/.mount-probe
              echo "downloads volume ready"
          volumeMounts:
            - name: qbittorrent-download-volume
              mountPath: /downloads
        {{- end }}
        - name: init-qbittorrent
          image: "alpine:{{ .Values.vueTorrent.initTag }}"
          env:
            - name: VUETORRENT_REPOSITORY
              value: {{ .Values.vueTorrent.repository | quote }}
            - name: VUETORRENT_VERSION
              value: {{ .Values.vueTorrent.version | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              # A `v`-prefixed value is accepted too: the release tag carries one,
              # the values file does not have to.
              want="${VUETORRENT_VERSION#v}"
              installed="$(cat /config/ui/version.txt 2>/dev/null || true)"
              if [ "$installed" = "$want" ]; then
                echo "VueTorrent $want already installed, nothing to do"
                exit 0
              fi
              apk add --no-cache unzip >/dev/null
              tmp="$(mktemp -d)"
              url="https://github.com/${VUETORRENT_REPOSITORY}/releases/download/v${want}/vuetorrent.zip"
              echo "installing VueTorrent $want from $url"
              wget -q -O "$tmp/vuetorrent.zip" "$url"
              unzip -q "$tmp/vuetorrent.zip" -d "$tmp"
              # Stage the new UI next to the old one and swap at the end: a failed
              # download or a truncated zip leaves the working UI untouched.
              rm -rf /config/ui.next
              cp -a "$tmp/vuetorrent" /config/ui.next
              if [ -d /config/ui ]; then
                rm -rf /config/ui.prev
                mv /config/ui /config/ui.prev
              fi
              mv /config/ui.next /config/ui
              rm -rf /config/ui.prev "$tmp"
              echo "VueTorrent $want installed"
          volumeMounts:
            - name: qbittorrent-config-volume
              mountPath: /config
      containers:
        - name: {{ .Chart.Name }}-vpn
          securityContext:
            capabilities: # Needed for VPN
              add:
                - NET_ADMIN
                - SYS_MODULE
            privileged: true
          image: "{{ .Values.vpnimage.repository }}:{{ .Values.vpnimage.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.vpnimage.pullPolicy }}
          env:
            - name: "PUID"
              value: "1100"
            - name: "PGID"
              value: "1100"
            - name: "TZ"
              value: "Europe/Paris"
          volumeMounts:
            - name: "dev-tun"
              mountPath: "/dev/net/tun"
            - name: qbittorrent-vpn-config-volume
              mountPath: /config
          resources:
            {{- toYaml .Values.vpnresources | nindent 12 }}
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: "TZ"
              value: "Europe/Paris"
            - name: "PUID"
              value: "1100"
            - name: "PGID"
              value: "1100"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: qbittorrent-config-volume
              mountPath: /config
            - name: qbittorrent-download-volume
              mountPath: /downloads
          ports:
            - name: torrent-webui
              containerPort: 8080
            - name: torrent
              containerPort: 18515
              protocol: TCP
            - name: torrent-udp
              containerPort: 18515
              protocol: UDP
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
