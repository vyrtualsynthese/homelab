apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "app.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Public resolvers on purpose: the torrent client's DNS must not depend on
      # the cluster. Cluster names are resolved through the single hostAlias below.
      dnsPolicy: {{ .Values.dns.policy }}
      dnsConfig:
        nameservers:
          {{- toYaml .Values.dns.nameservers | nindent 10 }}
      {{- with .Values.dns.crossSeedServiceIP }}
      hostAliases:
        - ip: {{ . | quote }}
          hostnames:
            - cross-seed
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if .Values.waitForDownloads.enabled }}
        # Runs as the same uid as qBittorrent (PUID) so the probe sees exactly
        # what the main container will see on the NFS export. Bounded wait:
        # after 2 minutes it proceeds and lets qBittorrent start anyway.
        - name: wait-for-downloads
          image: {{ .Values.waitForDownloads.image }}
          securityContext:
            runAsUser: 1100
            runAsGroup: 1100
          resources:
            {{- toYaml .Values.waitForDownloads.resources | nindent 12 }}
          command:
            - sh
            - -c
            - |
              i=0
              until touch /downloads/.mount-probe 2>/dev/null; do
                i=$((i+1))
                if [ "$i" -ge 60 ]; then
                  echo "downloads volume still not writable after 120s, proceeding"
                  exit 0
                fi
                sleep 2
              done
              rm -f /downloads/.mount-probe
              echo "downloads volume ready"
          volumeMounts:
            - name: downloads
              mountPath: {{ .Values.storage.downloads.mountPath }}
        {{- end }}
        {{- with .Values.vpn.clusterRoutes }}
        # The sidecar sends everything but the pod's own subnet into the tunnel,
        # which is what a kill switch is meant to do and also what swallowed
        # ClusterIP traffic. This puts the cluster ranges into the pod's main
        # table first: the sidecar's `suppress_prefixlength 0` rule prefers a
        # specific route there, so those ranges never enter the tunnel.
        # NET_ADMIN only — no privileged flag, no device, no host namespace.
        - name: vpn-cluster-routes
          image: {{ $.Values.vpn.routeFix.image }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
              drop:
                - ALL
          resources:
            {{- toYaml $.Values.vpn.routeFix.resources | nindent 12 }}
          command:
            - sh
            - -c
            - |
              gw="$(ip route show default | awk '/^default/ {for (i=1;i<=NF;i++) if ($i=="via") {print $(i+1); exit}}')"
              if [ -z "$gw" ]; then
                echo "no default gateway to route through, leaving the table alone"
                exit 0
              fi
              for cidr in {{ join " " . }}; do
                # A CNI that already routes the range is not an error: say so
                # and keep the pod booting rather than fail on "File exists".
                if ip route add "$cidr" via "$gw" 2>/dev/null; then
                  echo "added $cidr via $gw"
                else
                  echo "$cidr is already routed, leaving it"
                fi
              done
        {{- end }}
        - name: init-qbittorrent
          image: "alpine:{{ .Values.vueTorrent.initTag }}"
          resources:
            {{- toYaml .Values.vueTorrent.resources | nindent 12 }}
          env:
            - name: VUETORRENT_REPOSITORY
              value: {{ .Values.vueTorrent.repository | quote }}
            - name: VUETORRENT_VERSION
              value: {{ .Values.vueTorrent.version | quote }}
            # Needed by the installer's last step: the preference it writes must
            # stay writable by the app, so the file is handed to the same uid.
            - name: PUID
              value: {{ .Values.env.PUID | quote }}
            - name: PGID
              value: {{ .Values.env.PGID | quote }}
          command:
            - sh
            - -c
            - |
              set -u
              # The alternative UI is an asset; the torrent client is the workload.
              # Nothing here may fail the pod: a cold cluster, a fresh claim or a
              # GitHub outage used to turn an unreachable zip into a container that
              # never starts. Every failure leaves /config/ui as it is, and
              # qBittorrent boots on its stock WebUI.
              want="${VUETORRENT_VERSION#v}"
              installed="$(cat /config/ui/version.txt 2>/dev/null || true)"
              # `version.txt` alone is not an installation: the app serves
              # `<RootFolder>/public`, so an index.html that went missing is a tree
              # that has to be put back.
              if [ "$installed" = "$want" ] && [ -f /config/ui/public/index.html ]; then
                echo "VueTorrent $want already installed, nothing to do"
                exit 0
              fi
              if [ "$installed" = "$want" ]; then
                echo "VueTorrent $want is recorded in version.txt but public/index.html is missing; reinstalling"
              fi
              give_up() {
                echo "WARNING: $1"
                echo "WARNING: VueTorrent $want not installed; qBittorrent starts on its stock WebUI"
                exit 0
              }
              url="https://github.com/${VUETORRENT_REPOSITORY}/releases/download/v${want}/vuetorrent.zip"
              # The archive is kept on the claim after a successful install, so a
              # pod that has to reinstall the same version needs no network.
              cache="/config/vuetorrent-${want}.zip"
              # Write the preference qBittorrent clears when it finds no UI. Only
              # ever after an install, so an operator who turned the alternative UI
              # off in the WebUI keeps it off. The app rewrites this file from memory
              # on exit, which is why it is written here and not while it runs.
              #
              # Ownership matters as much as the content: the app runs as
              # PUID/PGID and has to be able to save its own settings. An existing
              # file is rewritten through its own inode, so a root-run container
              # never turns it into a file the app cannot write. A file this
              # container creates is removed if it cannot be handed over -- no
              # config at all is recoverable, an unwritable one is not.
              set_pref() {
                conf=/config/qBittorrent/qBittorrent.conf
                if [ ! -f "$conf" ]; then
                  made_dir=0
                  if [ ! -d /config/qBittorrent ]; then
                    mkdir -p /config/qBittorrent || return 1
                    made_dir=1
                  fi
                  printf '[Preferences]\nWebUI\\AlternativeUIEnabled=true\n' > "$conf" || return 1
                  if chown "$PUID:$PGID" "$conf" \
                    && { [ "$made_dir" = 0 ] || chown "$PUID:$PGID" /config/qBittorrent; }; then
                    return 0
                  fi
                  rm -f "$conf"
                  [ "$made_dir" = 0 ] || rmdir /config/qBittorrent 2>/dev/null
                  return 1
                fi
                new="$conf.new"
                awk '
                  BEGIN { line = "WebUI\\AlternativeUIEnabled=true"; key = "WebUI\\AlternativeUIEnabled=" }
                  /^\[/ {
                    if (inprefs && !done) { print line; done = 1 }
                    # Tolerate a CRLF file: qBittorrent writes LF, but the claim is
                    # on NFS and an editor elsewhere can change that. Without this,
                    # the key would land in a second [Preferences] section.
                    inprefs = ($0 == "[Preferences]" || $0 == "[Preferences]\r")
                    print
                    next
                  }
                  index($0, key) == 1 { print line; done = 1; next }
                  { print }
                  END {
                    if (!done) {
                      if (!inprefs) print "[Preferences]"
                      print line
                    }
                  }
                ' "$conf" > "$new" || { rm -f "$new"; return 1; }
                if ! cat "$new" > "$conf"; then
                  rm -f "$new"
                  return 1
                fi
                rm -f "$new"
                chown "$PUID:$PGID" "$conf" 2>/dev/null || true
                return 0
              }
              echo "installing VueTorrent $want from $url"
              # Bounded, both of them: an address that drops packets would otherwise
              # hold pod start for the kernel's full TCP retry budget.
              timeout 60 apk add --no-cache unzip >/dev/null 2>&1 \
                || give_up "cannot install unzip (no package repository reachable)"
              tmp="$(mktemp -d)" || give_up "cannot create a temporary directory"
              if ! wget -q -T 20 -O "$tmp/vuetorrent.zip" "$url"; then
                [ -f "$cache" ] || give_up "cannot download $url"
                echo "download failed; installing from the cached archive $cache"
                cp "$cache" "$tmp/vuetorrent.zip" || give_up "cannot read the cached archive $cache"
              fi
              unzip -q "$tmp/vuetorrent.zip" -d "$tmp" || give_up "the download from $url is not a readable zip"
              [ -d "$tmp/vuetorrent" ] || give_up "the zip from $url carries no vuetorrent/ directory"
              # Stage the new UI next to the old one and swap at the end: a failed
              # copy leaves the working UI untouched.
              rm -rf /config/ui.next
              cp -a "$tmp/vuetorrent" /config/ui.next \
                || give_up "cannot stage the UI on the config claim"
              if [ ! -f /config/ui.next/public/index.html ]; then
                rm -rf /config/ui.next
                give_up "the staged UI has no public/index.html"
              fi
              if [ -d /config/ui ]; then
                rm -rf /config/ui.prev
                mv /config/ui /config/ui.prev || give_up "cannot move the current UI aside"
              fi
              if ! mv /config/ui.next /config/ui; then
                if [ -d /config/ui.prev ]; then
                  mv /config/ui.prev /config/ui
                fi
                give_up "cannot move the staged UI into place; the previous UI is back"
              fi
              rm -rf /config/ui.prev
              if cp "$tmp/vuetorrent.zip" "$cache" 2>/dev/null; then
                # One archive, not one per version: an upgrade would otherwise leave
                # 6 MB behind on the claim every time.
                for old in /config/vuetorrent-*.zip; do
                  [ "$old" = "$cache" ] || rm -f "$old" 2>/dev/null || true
                done
                chown "$PUID:$PGID" "$cache" 2>/dev/null || true
              else
                echo "WARNING: cannot cache the archive at $cache; the next install will need the network"
              fi
              rm -rf "$tmp"
              set_pref || echo "WARNING: cannot set WebUI\\AlternativeUIEnabled=true; the WebUI may stay on the stock UI"
              echo "VueTorrent $want installed"
          volumeMounts:
            - name: config
              mountPath: {{ .Values.storage.config.mountPath }}
      containers:
        - name: {{ .Chart.Name }}-vpn
          securityContext:
            {{- toYaml .Values.vpn.securityContext | nindent 12 }}
          image: "{{ .Values.vpnimage.repository }}:{{ .Values.vpnimage.tag }}"
          imagePullPolicy: {{ .Values.vpnimage.pullPolicy }}
          {{- $env := list }}
          {{- range $name, $value := .Values.env }}
          {{- $env = append $env (dict "name" $name "value" ($value | toString)) }}
          {{- end }}
          {{- $env = concat $env (.Values.extraEnv | default list) }}
          {{- with $env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.vpn.resources | nindent 12 }}
          volumeMounts:
            - name: dev-tun
              mountPath: {{ .Values.vpn.tunDevice }}
            - name: vpn-config
              mountPath: {{ .Values.storage.vpn.mountPath }}
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $env := list }}
          {{- range $name, $value := .Values.env }}
          {{- $env = append $env (dict "name" $name "value" ($value | toString)) }}
          {{- end }}
          {{- $env = concat $env (.Values.extraEnv | default list) }}
          {{- with $env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ .Values.service.portName }}
              containerPort: {{ include "app.containerPort" . }}
              protocol: TCP
            - name: torrent
              containerPort: {{ .Values.torrent.port }}
              protocol: TCP
            - name: torrent-udp
              containerPort: {{ .Values.torrent.port }}
              protocol: UDP
          {{- with .Values.probes.liveness }}
          {{- if .enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ .port }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.storage.config.mountPath }}
            - name: downloads
              mountPath: {{ .Values.storage.downloads.mountPath }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: vpn-config
          persistentVolumeClaim:
            claimName: {{ include "app.vpnClaimName" . }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ required "storage.config.existingClaim is required" .Values.storage.config.existingClaim }}
        - name: downloads
          persistentVolumeClaim:
            claimName: {{ required "storage.downloads.existingClaim is required" .Values.storage.downloads.existingClaim }}
        - name: dev-tun
          hostPath:
            path: {{ .Values.vpn.tunDevice }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
