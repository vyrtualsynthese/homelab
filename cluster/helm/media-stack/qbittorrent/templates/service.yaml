apiVersion: v1
kind: Service
metadata:
  name: {{ include "fullname" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      name: torrent-webui
      targetPort: torrent-webui
  selector:
    {{- include "selectorLabels" . | nindent 4 }}
