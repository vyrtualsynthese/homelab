apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "app.vpnClaimName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.storage.vpn.accessModes | nindent 4 }}
  storageClassName: {{ .Values.storage.vpn.className }}
  resources:
    requests:
      storage: {{ .Values.storage.vpn.size }}
