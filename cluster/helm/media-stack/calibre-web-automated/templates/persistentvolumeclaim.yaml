{{- if and .Values.storage.config.enabled (not .Values.storage.config.existingClaim) }}
# CWA's own state: `app.db`, Calibre's configuration, thumbnails, and the copies of
# every file it processes. Derived from the release, never typed in.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-config" (include "app.fullname" .) }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.storage.config.accessModes | nindent 4 }}
  storageClassName: {{ .Values.storage.config.className }}
  resources:
    requests:
      storage: {{ .Values.storage.config.size }}
{{- end }}
{{- if and .Values.storage.ingest.enabled (not .Values.storage.ingest.existingClaim) }}
---
# The drop folder. Independent of the config claim: it is emptied as books are
# ingested, and a full config volume must not stop an import from being queued.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-ingest" (include "app.fullname" .) }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.storage.ingest.accessModes | nindent 4 }}
  storageClassName: {{ .Values.storage.ingest.className }}
  resources:
    requests:
      storage: {{ .Values.storage.ingest.size }}
{{- end }}
