{{- if .Values.ingressRoute.enabled }}
{{- $fullname := include "app.fullname" . }}
{{- /* Every middleware comes from values, in the reference chart's `{ name, namespace }`
shape. The LAN gate is the first entry in that list, so a request from outside the ranges is
rejected at the proxy before it reaches the app. */}}
{{- $middlewares := list }}
{{- range .Values.ingressRoute.middlewares }}
{{- $middlewares = append $middlewares (printf "%s-%s@kubernetescrd" .namespace .name) }}
{{- end }}
apiVersion: {{ .Values.ingressRoute.apiVersion }}
kind: IngressRoute
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    {{- with .Values.ingressRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ingressRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingressRoute.host }}`) && PathPrefix(`{{ .Values.ingressRoute.pathPrefix }}`)
      {{- with $middlewares }}
      middlewares:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      services:
        - name: {{ $fullname }}
          port: {{ .Values.service.port }}
  {{- if .Values.ingressRoute.tls.enabled }}
  tls:
    {{- with .Values.ingressRoute.tls.secretName }}
    secretName: {{ . }}
    {{- end }}
    {{- with .Values.ingressRoute.tls.certResolver }}
    certResolver: {{ . }}
    {{- end }}
    {{- with .Values.ingressRoute.tls.options }}
    options:
      name: {{ . }}
      namespace: {{ $.Release.Namespace }}
    {{- end }}
  {{- end }}
{{- if .Values.ingressRoute.redirectToHttps }}
---
{{- /* The plain-HTTP router exists only to send the browser to the TLS one. It carries the
same middlewares as the TLS router, then the redirect, so traffic from outside the LAN is
dropped before it is redirected anywhere. */}}
apiVersion: {{ .Values.ingressRoute.apiVersion }}
kind: IngressRoute
metadata:
  name: {{ $fullname }}-redirect
  labels:
    {{- include "app.labels" . | nindent 4 }}
    {{- with .Values.ingressRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ingressRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingressRoute.host }}`) && PathPrefix(`{{ .Values.ingressRoute.pathPrefix }}`)
      middlewares:
        {{- range $middlewares }}
        - name: {{ . }}
        {{- end }}
        - name: {{ $fullname }}-redirect-https
      services:
        - name: {{ $fullname }}
          port: {{ .Values.service.port }}
{{- end }}
{{- end }}
