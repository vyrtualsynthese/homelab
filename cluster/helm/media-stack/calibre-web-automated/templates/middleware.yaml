{{- if and .Values.ingressRoute.enabled .Values.ingressRoute.redirectToHttps }}
apiVersion: {{ .Values.ingressRoute.apiVersion }}
kind: Middleware
metadata:
  name: {{ include "app.fullname" . }}-redirect-https
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    # Permanent, so browsers cache it and stop asking over HTTP. Calibre-Web
    # builds absolute URLs from `X-Forwarded-Proto`, which Traefik sets to
    # `https` on the TLS router, so nothing here is rewritten back to HTTP.
    permanent: true
{{- end }}
