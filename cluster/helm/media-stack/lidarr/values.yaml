# Default values for lidarr.
# This chart follows the contract in docs/charts/README.md and the shape of its
# sibling, media-stack/sonarr. The differences are the ones this app needs: a
# LinuxServer image that starts as root and drops to PUID/PGID, two NFS media
# mounts instead of sonarr's one, and a config claim this chart creates because
# the previous one was Longhorn and no longer exists.

# -- Override the chart name.
nameOverride: ""
# -- Override the generated release name.
fullnameOverride: ""

replicaCount: 1

# -- Deployment strategy. `Recreate` is required for anything with a config
# volume: ReadWriteOnce volumes cannot be attached to an old and a new pod at
# the same time.
strategy: Recreate

image:
  # LinuxServer publishes on lscr.io and mirrors on ghcr.io. This chart keeps
  # the registry the cluster already pulls from. The image starts as root and
  # drops to PUID/PGID through s6; that is why the securityContext below cannot
  # use runAsNonRoot (see the chart README).
  repository: lscr.io/linuxserver/lidarr
  # -- Pin the full release tag. `3.1.6` is the series tag and moves; this one
  # does not. Must equal Chart.yaml's appVersion.
  tag: "3.1.6.5079-ls48"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  # -- Create a dedicated ServiceAccount. Lidarr never talks to the Kubernetes
  # API, so it gets no mounted token either.
  create: true
  automount: false
  # -- Defaults to the fullname.
  name: ""
  annotations: {}

# -- Annotations added to the pod, on top of the scrape annotations this chart
# renders itself while the exporter is enabled. Do not repeat `prometheus.io/*`
# here: the exporter block below owns them, so the announced port cannot drift
# from the listener.
podAnnotations: {}
podLabels: {}

# Pod-level security.
#
# `fsGroup` is deliberately NOT set: local-path volumes are hostPath-backed, and
# the kubelet does not apply fsGroup ownership to them, so setting it would look
# meaningful and do nothing.
#
# The LinuxServer image is not started as a non-root user: its s6 init must run
# as root to prepare `/config` and then drop to PUID/PGID 1100. Setting
# `runAsNonRoot` or `runAsUser` here prevents the container from starting at all.
# `allowPrivilegeEscalation: false` and the runtime seccomp profile still apply.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8686

container:
  # -- Container port. Defaults to `service.port` when left empty; set it only
  # when the app listens on a different port than the Service exposes.
  port: null

ingressRoute:
  # -- Render a Traefik IngressRoute. This repo never uses
  # networking.k8s.io/v1 Ingress.
  enabled: true
  # -- API group. `traefik.containo.us/v1alpha1` is what the cluster's Traefik
  # 2.x watches today; flip this to `traefik.io/v1alpha1` when Traefik v3 lands.
  apiVersion: traefik.containo.us/v1alpha1
  # -- Traefik entry points. `web` is plain HTTP on kub.local; `websecure` is TLS.
  entryPoints:
    - web
  # -- Single host. For a second host, copy the chart.
  host: lidarr.kub.local
  # -- Path prefix. `/` matches everything.
  pathPrefix: /
  # -- Middlewares, rendered as `<namespace>-<name>@kubernetescrd`.
  # Example: [{ name: authentik, namespace: kube-system }]
  middlewares: []
  labels: {}
  annotations: {}
  tls:
    # -- Send the router over TLS. Requires the tls block below to mean anything.
    enabled: false
    # -- Use a pre-existing certificate instead of asking Traefik to issue one.
    secretName: ""
    # -- Traefik ACME resolver name, for example `myresolver`.
    certResolver: ""
    # -- TLSOption resource name in this namespace.
    options: ""

storage:
  # -- Render the config PersistentVolumeClaim. Set to false only when the app
  # genuinely keeps no state.
  enabled: true
  # -- Use an existing claim instead of the one this chart creates.
  existingClaim: ""
  className: local-path
  accessModes:
    - ReadWriteOnce
  # -- Config volumes hold settings, not media. 128Mi is the house standard.
  size: 128Mi
  # -- Where the config volume is mounted inside the container.
  mountPath: /config

# -- Environment variables, rendered inline into the container spec. Changing a
# value changes the pod template, so the Deployment rolls by itself. Prefer this
# for every non-secret value.
env:
  TZ: "Europe/Paris"
  # LinuxServer images drop from root to these IDs after preparing /config.
  # They match the rest of the media stack.
  PUID: "1100"
  PGID: "1100"
  # Warnings and errors only. Lidarr's default level is `debug`, which is the
  # noisiest in the stack: one line per indexer search and per track scanned,
  # unfiltered into Loki. `LIDARR__LOG__LEVEL` is the file level,
  # `CONSOLELEVEL` is stdout (the one Loki sees); both are raised together so a
  # debugging session does not leave one of them behind. The history and
  # activity views in the UI are the operational record, not the log.
  LIDARR__LOG__LEVEL: "warn"
  LIDARR__LOG__CONSOLELEVEL: "warn"

# -- Variables sourced from a Secret, as `{ name, valueFrom }`. Kept separate so
# a secret can never be pasted into the plain map above by accident.
extraEnv: []

# -- Bulk `envFrom` sources, usually `secretRef`. Rarely needed: prefer
# `extraEnv` so each secret key is explicit in the manifest.
envFrom: []

# qBittorrent's NFS download directory. Lidarr imports from here and writes
# nothing back, but the mount stays read-write because the *arr apps move and
# rename files during import.
downloads:
  claim: pvc-nfs-qbittorrent-download-nfs-subdir-external-provisioner
  mountPath: /downloads
  readOnly: false

# The audio pool, shared with Plex (mounted there at `/audio` as well) and with
# filebrowser. Read-write: Lidarr renames, moves and deletes inside its root
# folder, so a read-only mount would fail at import time rather than at start.
audio:
  claim: pvc-nfs-audio-nfs-subdir-external-provisioner
  mountPath: /audio
  readOnly: false

# Lidarr's Prometheus exporter, run as a sidecar (exportarr).
#
# The target is built from the release name and `service.port`, so it cannot
# point at a port Lidarr does not listen on. The scrape annotations are rendered
# from this block, so disabling the sidecar removes them too.
exportarr:
  # -- Render the sidecar and its scrape annotations.
  enabled: true
  image:
    repository: ghcr.io/onedr0p/exportarr
    pullPolicy: IfNotPresent
    # v2.3.0 is the newest release (12 Aug 2025).
    tag: "v2.3.0"
  # -- Port exportarr listens on, and the port named in the scrape annotation.
  port: 9707
  apiKey:
    # -- Secret holding Lidarr's API key. Empty means the fullname, which is the
    # `lidarr` Secret in the media-stack namespace.
    secretName: ""
    secretKey: secret
  resources:
    requests:
      cpu: 2m
      memory: 56Mi
    limits:
      memory: 112Mi

nodeSelector:
  # -- Every workload is pinned to a named node; local-path claims are node-bound.
  kubernetes.io/hostname: streaming

tolerations: []

affinity: {}

# Sized from Prometheus on 2026-11-13 over the 39h it holds:
#   memory in use (working set)  590Mi average, 930Mi peak
#   CPU                          210m average, 735m peak during a scan
#
# The previous 1Gi limit was sized from sonarr's profile before this app had run
# again after the 2026 disk failure. The real peak fills it to 93%, and a scan
# that crosses the limit loses the scan, so the limit follows the measured peak
# now: 2Gi is about 2.2x.
#
# No CPU limit, here or anywhere in this cluster: a limit throttles exactly the
# short burst this app needs during an import or a library scan, and the node's
# capacity is the real ceiling. The 10m request is only there so the scheduler
# places the pod.
resources:
  requests:
    cpu: 10m
    memory: 512Mi
  limits:
    memory: 2Gi

# Probes. `/ping` is Lidarr's own unauthenticated health endpoint. It is a
# stronger check than a plain process ping: PingController reads the config
# repository on every call, so it answers 500 when the database on `/config`
# cannot be opened.
#
# Liveness and readiness share the endpoint on purpose. Lidarr's only dependency
# is that SQLite database, and the endpoint already reports it; the API's
# `/health` endpoint would be stronger but needs the API key, which a probe
# cannot read.
#
# The startup probe holds the other two through a first start after a version
# upgrade, when the database is migrated and Lidarr can take noticeably longer
# than a restart.
probes:
  startup:
    enabled: true
    path: /ping
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
  liveness:
    enabled: true
    path: /ping
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /ping
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
