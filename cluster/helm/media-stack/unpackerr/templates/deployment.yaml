apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fullname" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: qbittorrent-download-volume
          persistentVolumeClaim:
            claimName: pvc-nfs-qbittorrent-download-nfs-subdir-external-provisioner
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 5656
              protocol: TCP
          env:
            - name: "TZ"
              value: "Europe/Paris"
            - name: "UN_DEBUG"
              value: "false"
            - name: "UN_LOG_FILES"
              value: "10"
            - name: "UN_LOG_FILE_MB"
              value: "10"
            - name: "UN_INTERVAL"
              value: "1m"
            - name: "UN_START_DELAY"
              value: "1m"
            - name: "UN_RETRY_DELAY"
              value: "5m"
            - name: "UN_MAX_RETRIES"
              value: "10"
            - name: "UN_PARALLEL"
              value: "1"
            - name: "UN_FILE_MODE"
              value: "0644"
            - name: "UN_DIR_MODE"
              value: "0755"
            - name: "UN_SONARR_0_URL"
              value: "http://sonarr:8989"
            - name: "UN_SONARR_0_API_KEY"
              value: "86075165a5c54b8f88071a4ddf10c247"
            - name: "UN_SONARR_0_PATHS_0"
              value: "/downloads"
            - name: "UN_SONARR_0_PROTOCOLS"
              value: "torrent"
            - name: "UN_SONARR_0_TIMEOUT"
              value: "1m"
            - name: "UN_SONARR_0_DELETE_ORIG"
              value: "false"
            - name: "UN_SONARR_0_DELETE_DELAY"
              value: "30m"
            - name: "UN_SONARR_1_URL"
              value: "http://sonarr-anime:8989"
            - name: "UN_SONARR_1_API_KEY"
              value: "acdad7862d2a4fa6a98c1e9e76de8a3e"
            - name: "UN_SONARR_1_PATHS_0"
              value: "/downloads"
            - name: "UN_SONARR_1_PROTOCOLS"
              value: "torrent"
            - name: "UN_SONARR_1_TIMEOUT"
              value: "1m"
            - name: "UN_SONARR_1_DELETE_ORIG"
              value: "false"
            - name: "UN_SONARR_1_DELETE_DELAY"
              value: "30m"
            - name: "UN_RADARR_0_URL"
              value: "http://radarr:7878"
            - name: "UN_RADARR_0_API_KEY"
              value: "3182ca7ce6d440c08948b0f97ca92f74"
            - name: "UN_RADARR_0_PATHS_0"
              value: "/downloads"
            - name: "UN_RADARR_0_PROTOCOLS"
              value: "torrent"
            - name: "UN_RADARR_0_TIMEOUT"
              value: "1m"
            - name: "UN_RADARR_0_DELETE_ORIG"
              value: "false"
            - name: "UN_RADARR_0_DELETE_DELAY"
              value: "30m"
            - name: "UN_RADARR_1_URL"
              value: "http://radarr-anime:7878"
            - name: "UN_RADARR_1_API_KEY"
              value: "8cbaaf757e0f4a7b9e373ac6c80fc676"
            - name: "UN_RADARR_1_PATHS_0"
              value: "/downloads"
            - name: "UN_RADARR_1_PROTOCOLS"
              value: "torrent"
            - name: "UN_RADARR_1_TIMEOUT"
              value: "1m"
            - name: "UN_RADARR_1_DELETE_ORIG"
              value: "false"
            - name: "UN_RADARR_1_DELETE_DELAY"
              value: "30m"
            # - name: "UN_LIDARR_0_URL"
            #   value: "http://lidarr:8686"
            # - name: "UN_LIDARR_0_API_KEY"
            #   value: "9e0af94da2b94fefa04cccf388fe0d94"
            # - name: "UN_LIDARR_0_PATHS_0"
            #   value: "/downloads"
            # - name: "UN_LIDARR_0_PROTOCOLS"
            #   value: "torrent"
            # - name: "UN_LIDARR_0_TIMEOUT"
            #   value: "1m"
            # - name: "UN_LIDARR_0_DELETE_ORIG"
            #   value: "false"
            # - name: "UN_LIDARR_0_DELETE_DELAY"
            #   value: "30m"
            - name: "UN_WEBSERVER_METRICS"
              value: "false"
          volumeMounts:
            - mountPath: /downloads
              name: qbittorrent-download-volume
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
