# Default values for cross-seed.
#
# cross-seed is not a web app here: the UI is never exposed. Everything it needs
# is the /config claim and a config.js Secret; torrents come from qBittorrent's API.

# -- Override the chart name.
nameOverride: ""
# -- Override the generated release name.
fullnameOverride: ""

# -- Replicas. Keep at 1: the config claim is ReadWriteOnce.
replicaCount: 1

# -- Required with a ReadWriteOnce config volume.
strategy: Recreate

image:
  # -- Image repository. GHCR is the only source the image is published to.
  repository: ghcr.io/cross-seed/cross-seed
  # -- Pin the tag. Renovate manages this. Keep appVersion equal to it.
  tag: "6.13.9"
  # -- Pull policy. The tag is pinned, so pulling every time buys nothing.
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  # -- cross-seed never calls the Kubernetes API; do not mount a token.
  automount: false
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# local-path is hostPath-backed and the kubelet does not apply fsGroup to it.
# The claim is chowned to 1100:1100 on the node before UID 1100 is enabled.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1100
  runAsGroup: 1100
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 2468

container:
  # -- Only set when the container listens on a different port than the Service.
  port: null

# -- Image entrypoint is catatonit + cross-seed, so only the subcommand is passed.
args:
  - daemon

env:
  TZ: "Europe/Paris"
  # -- The image already sets this; stated so the mount path is explicit.
  # Must match storage.mountPath: they are the same /config directory.
  CONFIG_DIR: "/config"

extraEnv: []
envFrom: []

storage:
  enabled: true
  existingClaim: ""
  # -- StorageClass for the config claim. local-path is hostPath-backed.
  className: local-path
  # -- Access modes for the config claim. ReadWriteOnce matches local-path.
  accessModes:
    - ReadWriteOnce
  # -- Requested size. Holds the SQLite database, logs and cross-seeded copies.
  size: 128Mi
  # -- Where the config claim mounts. Must match env.CONFIG_DIR and the
  # directory part of configFile.mountPath.
  mountPath: /config

configFile:
  # -- Secret that holds config.js. It must already exist in the namespace.
  secretName: cross-seed
  key: config.js
  # -- Read-only subPath mount inside the config claim. Must live under
  # storage.mountPath.
  mountPath: /config/config.js

# -- Extra pod volumes, rendered verbatim.
volumes: []
# -- Extra container volume mounts, rendered verbatim.
volumeMounts: []

# -- Node pin. local-path volumes land on this node, so it must stay accurate.
nodeSelector:
  kubernetes.io/hostname: streaming

tolerations: []
affinity: {}

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    # No CPU limit, so torrent parsing is never throttled.
    memory: 512Mi

probes:
  liveness:
    enabled: true
    # cross-seed's unauthenticated health endpoint.
    path: /api/ping
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
