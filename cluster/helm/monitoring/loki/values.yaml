traefik:
  apiVersion: traefik.containo.us/v1alpha1

ingress:
  host: loki.kub.local
  service: loki
  port: 3100

loki:
  fullnameOverride: loki
  deploymentMode: Monolithic
  singleBinary:
    replicas: 1
    kind: StatefulSet
    nodeSelector:
      kubernetes.io/hostname: nas
    # Measured 2026-11-12 over 15 h: 134 MiB average, 166 MiB p95, 217 MiB peak.
    # 1 GiB keeps 4.6x the observed peak for compaction and 30-day queries.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    # The rules sidecar watches for Prometheus-Operator rule ConfigMaps, which this
    # cluster does not use. It held 78 MiB with no limit, more than half the main
    # container's usage.
    sidecar: false
    persistence:
      enabled: true
      size: 20Gi
      enableStatefulSetAutoDeletePVC: false
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomGateway:
    replicas: 0
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  test:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
    lokiCanary:
      enabled: false
    dashboards:
      enabled: false
    serviceMonitor:
      enabled: false
  loki:
    image:
      registry: docker.io
      repository: grafana/loki
      tag: 3.7.10
    auth_enabled: false
    ui:
      enabled: true
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: filesystem
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    limits_config:
      retention_period: 720h
