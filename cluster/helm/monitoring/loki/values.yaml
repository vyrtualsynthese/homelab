traefik:
  apiVersion: traefik.containo.us/v1alpha1

ingress:
  host: loki.kub.local
  service: loki
  port: 3100

loki:
  fullnameOverride: loki
  deploymentMode: Monolithic
  # Prometheus discovers the pod by annotation. Loki serves /metrics on the same
  # HTTP port as its API (3100), so there is no second listener to enable. The
  # chart's own ServiceMonitor support needs the Prometheus Operator, which this
  # cluster does not run. `defaults` is the only pod-annotation key the chart's
  # schema accepts from here — `loki.podAnnotations` in this wrapper's namespace
  # would land on the subchart root and fail validation.
  defaults:
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/scheme: http
      prometheus.io/port: "3100"
      prometheus.io/path: "/metrics"
  singleBinary:
    replicas: 1
    kind: StatefulSet
    nodeSelector:
      kubernetes.io/hostname: nas
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    persistence:
      enabled: true
      size: 20Gi
      enableStatefulSetAutoDeletePVC: false
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomGateway:
    replicas: 0
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  test:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
    lokiCanary:
      enabled: false
    dashboards:
      enabled: false
    serviceMonitor:
      enabled: false
  loki:
    image:
      registry: docker.io
      repository: grafana/loki
      tag: 3.7.9
    auth_enabled: false
    ui:
      enabled: true
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: filesystem
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    limits_config:
      retention_period: 720h
