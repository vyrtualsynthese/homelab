traefik:
  apiVersion: traefik.containo.us/v1alpha1

ingress:
  host: prometheus.kub.local
  service: prometheus-server
  port: 80

prometheus:
  fullnameOverride: prometheus
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  server:
    fullnameOverride: prometheus-server
    retention: 90d
    retentionSize: 20GB
    strategy:
      type: Recreate
    persistentVolume:
      enabled: true
      size: 25Gi
    nodeSelector:
      kubernetes.io/hostname: nas
    # 1Gi was not enough: the server was OOM-killed ~50s after every start.
    # Prometheus 3 sizes its own GC from the cgroup limit, so the limit has to
    # cover the scrape head, not just the steady state.
    # Measured 2026-11-12 over 15 h: 1.26 GiB average, 1.74 GiB p95, 1.76 GiB
    # peak. The 2 GiB ceiling is kept because Prometheus sizes its GC target from
    # the cgroup limit; 1 GiB OOM-killed it on 2026-11-12. The request tracks the
    # steady state so the scheduler reserves what it actually holds.
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 2Gi
    image:
      repository: quay.io/prometheus/prometheus
      tag: v3.16.0
  configmapReload:
    prometheus:
      image:
        repository: quay.io/prometheus-operator/prometheus-config-reloader
        tag: v0.95.2
      # Measured 9.9 MiB peak over 15 h.
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
  kube-state-metrics:
    fullnameOverride: prometheus-kube-state-metrics
    nodeSelector:
      kubernetes.io/hostname: nas
    image:
      registry: registry.k8s.io
      repository: kube-state-metrics/kube-state-metrics
      tag: v2.20.0
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  prometheus-node-exporter:
    fullnameOverride: prometheus-node-exporter
    image:
      registry: quay.io
      repository: prometheus/node-exporter
      tag: v1.12.1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  # The two edge Pis run their exporters outside the cluster, so annotation
  # discovery can never find them. Ports: 9100 node-exporter, 9902 smartctl,
  # 9323 Docker.
  #
  # kubernetes-api-servers is half the series in this cluster, and almost all of
  # it is histogram buckets that no dashboard and no alert rule reads. The
  # sums and counts stay, so request rate, error rate and an average latency
  # are still visible; the buckets are dropped before they reach the head.
  # Measured 2026-11-18: 28,964 series match this rule, 19,488 of them
  # etcd_request_duration_seconds_bucket alone. Buckets were once dropped for
  # apiserver_* only, which left the largest family behind.
  scrapeConfigs:
    kubernetes-api-servers:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "(apiserver|etcd|workqueue|scheduler|storage_operation|kubelet|rest_client).*_bucket"
    # K3s runs the API server, etcd, scheduler and kubelet in one process, so
    # every control-plane node's kubelet endpoint republishes the whole control
    # plane: 102.6k of this cluster's 196k series, ~93% of them duplicated
    # three times over and already collected by the job above. Keep the kubelet
    # and volume families this job exists for.
    #
    # The kubelet's own histograms go the same way as the control plane's: no
    # panel and no rule reads one, and 4,932 of this job's 7,520 stored series
    # are buckets. kubelet_volume_stats_* is untouched — the NFS claim panels and
    # PVCFillingUp read it.
    kubernetes-nodes:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "apiserver_.*|etcd_.*|scheduler_.*|controller_.*|workqueue_.*|rest_client_.*|go_.*|process_.*|apiextensions_.*|aggregator_.*|authentication_.*|authorization_.*|field_validation_.*|watch_cache_.*|node_authorizer_.*|kubernetes_feature_enabled"
        - action: drop
          source_labels:
            - __name__
          regex: "(kubelet|storage_operation|volume_operation|kubeproxy).*_bucket"
    # cAdvisor publishes 76 families per container, and the Applications board
    # reads two of them: container_cpu_usage_seconds_total and
    # container_memory_working_set_bytes. The 17 families below are 10,058 of
    # this job's 21,557 series and appear in no panel and no rule. The identity
    # and limit families (container_last_seen, container_start_time_seconds,
    # container_spec_memory_limit_bytes, container_oom_events_total) stay: they
    # are what makes a container's own numbers readable next to the others.
    kubernetes-nodes-cadvisor:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "container_(tasks_state|memory_failures_total|memory_failcnt|memory_max_usage_bytes|memory_mapped_file|memory_swap|memory_kernel_usage|memory_cache|blkio_device_usage_total|fs_reads_total|fs_writes_total|cpu_load_average_10s|file_descriptors|processes|sockets|threads|threads_max)"
    # kube-state-metrics publishes one series per object across 812 families.
    # Four of those families have no reader: every Secret in the cluster
    # (421 of them, names and type only), pod tolerations, ReplicaSets — the
    # replica panels read Deployments and StatefulSets — and the QoS class.
    # Measured 2026-11-18: 6,156 series match this rule. kube_persistentvolume_status_phase
    # has no reader either and stays: PV state matters to the Longhorn cleanup.
    kubernetes-service-endpoints:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "kube_secret_.*|kube_pod_tolerations|kube_replicaset_.*|kube_pod_status_qos_class"
    # Same guard as the pods -slow job: this is where a Service annotated
    # prometheus.io/scrape_slow is scraped, and the KSM families above would
    # come back through it.
    kubernetes-service-endpoints-slow:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "kube_secret_.*|kube_pod_tolerations|kube_replicaset_.*|kube_pod_status_qos_class"
    # The pod-scraped exporters publish what they publish: qBittorrent writes
    # one series per torrent per field, 6,240 series for 365 torrents, while the
    # Media board reads four qbittorrent_global_* totals. The n8n and Traefik
    # histograms are 3,153 more with no panel and no rule — n8n publishes three
    # bucket families of its own, of which the HTTP one is 1,610 series.
    # Measured 2026-11-18: 9,393 series from this job. container_* is not
    # touched here; the cadvisor job owns those families.
    kubernetes-pods:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "qbittorrent_torrent_.*|n8n_.*_bucket|traefik_.*_bucket"
    # The two -slow jobs scrape the targets that carry prometheus.io/scrape_slow
    # instead of prometheus.io/scrape, so a drop on the fast job never reaches
    # them. No target carries that annotation on 2026-11-18, which is exactly why
    # the same rules are set here: one annotation added later would otherwise
    # bring back up to 15.5k series with nothing to notice.
    kubernetes-pods-slow:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "qbittorrent_torrent_.*|n8n_.*_bucket|traefik_.*_bucket"
    rbp0:
      enabled: true
      static_configs:
        - targets:
            - 192.168.1.22:9100
            - 192.168.1.22:9902
            - 192.168.1.22:9323
    rbp1:
      enabled: true
      static_configs:
        - targets:
            - 192.168.1.38:9100
            - 192.168.1.38:9902
            - 192.168.1.38:9323
    # Loki and Grafana publish their own /metrics and nothing scraped them
    # before 2026-11-18. Without these two jobs the stack watched every app
    # but not itself: a Loki rejecting writes and a Grafana whose rules fail to
    # evaluate both looked like silence.
    #
    # Scrape the Service port, not the container port. Loki's Service declares
    # 3100, so that address works; Grafana's Service declares only 80 and maps
    # it to the container's 3000, so :3000 answers nothing and the scrape times
    # out. That was the first version of this job.
    #
    # Their histograms are another 6,968 series across the three jobs and no
    # reader takes one: the two stack rules read counters,
    # loki_request_duration_seconds_count and
    # grafana_alerting_rule_evaluation_failures_total. Dropping every _bucket
    # keeps those counters and every _sum.
    loki:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: ".*_bucket"
      static_configs:
        - targets:
            - loki.monitoring.svc:3100
    grafana:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: ".*_bucket"
      static_configs:
        - targets:
            - grafana.monitoring.svc:80
    prometheus:
      # The server's own /metrics, not the chart section above.
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: ".*_bucket"
