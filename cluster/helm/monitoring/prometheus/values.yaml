traefik:
  apiVersion: traefik.containo.us/v1alpha1

ingress:
  host: prometheus.kub.local
  service: prometheus-server
  port: 80

prometheus:
  fullnameOverride: prometheus
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  server:
    fullnameOverride: prometheus-server
    retention: 90d
    retentionSize: 20GB
    strategy:
      type: Recreate
    persistentVolume:
      enabled: true
      size: 25Gi
    nodeSelector:
      kubernetes.io/hostname: nas
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    image:
      repository: quay.io/prometheus/prometheus
      tag: v3.16.0
  configmapReload:
    prometheus:
      image:
        repository: quay.io/prometheus-operator/prometheus-config-reloader
        tag: v0.95.2
  kube-state-metrics:
    fullnameOverride: prometheus-kube-state-metrics
    nodeSelector:
      kubernetes.io/hostname: nas
    image:
      registry: registry.k8s.io
      repository: kube-state-metrics/kube-state-metrics
      tag: v2.20.0
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  prometheus-node-exporter:
    fullnameOverride: prometheus-node-exporter
    image:
      registry: quay.io
      repository: prometheus/node-exporter
      tag: v1.12.1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  # The two edge Pis run their exporters outside the cluster, so annotation
  # discovery can never find them. Ports: 9100 node-exporter, 9902 smartctl,
  # 9323 Docker.
  scrapeConfigs:
    rbp0:
      enabled: true
      static_configs:
        - targets:
            - 192.168.1.22:9100
            - 192.168.1.22:9902
            - 192.168.1.22:9323
    rbp1:
      enabled: true
      static_configs:
        - targets:
            - 192.168.1.38:9100
            - 192.168.1.38:9902
            - 192.168.1.38:9323
