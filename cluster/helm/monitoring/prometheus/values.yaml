traefik:
  apiVersion: traefik.io/v1alpha1

ingress:
  host: prometheus.kub.local
  service: prometheus-server
  port: 80

# The restore-drill log the RestoreDrillOverdue rule reads. One entry per row of
# the table in docs/runbooks/restore.md under "The drill log"; update both in the
# same change. `at` is Unix seconds at UTC midnight of the drill date:
#   date -u -d 2026-11-21 +%s
# The `date` label is derived from it in templates/configmap-restore-drills.yaml,
# so a row stores one fact. `stream: all` is the last-resort drill, which reads
# every repository from outside the cluster.
#
# A drill run twice on one UTC date replaces its row rather than adding one: two
# identical series make node-exporter reject the whole textfile, which would read
# as an unreadable log. hack/tests/test_restore_drill_log.py checks that every
# table row has an entry here, that the dates agree, and that no series repeats.
# Two drills on the same date are interchangeable to the rule: topk(1) names
# whichever stream it returns, because the alert reports the newest date, not a
# particular stream.
restoreDrills:
  - stream: nodes-nas
    drill: postgresql-dumps
    at: 1795219200
  - stream: nodes-streaming
    drill: sonarr-database
    at: 1795219200
  - stream: nfs
    drill: syncthing-file
    at: 1795219200
  - stream: nodes-streaming
    drill: sonarr-live-claim
    at: 1795305600
  - stream: all
    drill: last-resort
    at: 1795305600
  - stream: nodes-streaming
    drill: etcd-snapshot-restore
    at: 1795305600
  - stream: nodes-streaming
    drill: etcd-snapshot-restore
    at: 1795651200
  - stream: edge-rbp0
    drill: edge-state
    at: 1795651200
  - stream: edge-rbp1
    drill: edge-state
    at: 1795651200

prometheus:
  fullnameOverride: prometheus
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  server:
    fullnameOverride: prometheus-server
    retention: 90d
    retentionSize: 20GB
    strategy:
      type: Recreate
    persistentVolume:
      enabled: true
      size: 25Gi
    nodeSelector:
      kubernetes.io/hostname: nas
    # The limit is 2Gi because a 1Gi limit was OOM-killed ~50s after every
    # start: Prometheus 3 sizes its own GC from the cgroup limit, so the ceiling
    # has to cover the scrape head, not just the steady state.
    # Re-measured 2026-11-19 over the 7.7 days the TSDB now retains, which the
    # 2026-11-18 series drop made possible (it was 6 days before): 966 MiB
    # average, 1,102 MiB p95, 1,618 MiB peak; the worst single day's p95 was
    # 1,162 MiB. The request is 1.25Gi, the smallest size above every daily p95,
    # not just the seven-day one, because the trend is upward (853 MiB on 11-12
    # to 1,074 MiB on 11-19). The 2 GiB ceiling stays.
    resources:
      requests:
        cpu: 100m
        memory: 1.25Gi
      limits:
        memory: 2Gi
    image:
      repository: quay.io/prometheus/prometheus
      tag: v3.16.0
    # The query API authenticates callers itself, through Prometheus's own
    # `--web.config.file`. A Traefik gate would not do: `lan-only` admits the
    # pod network, so a credential on the route leaves `/api/v1/*` open to every
    # pod — and Grafana, the stack's main reader, reaches the Service directly
    # and would sail past such a gate anyway.
    #
    # The file holds bcrypt hashes and nothing else; it lives in the Secret
    # `prometheus-basicauth` in this namespace (docs/secrets.md). Three users,
    # one per consumer: `ops` for a person or an agent over the route, `grafana`
    # for the datasource in cluster/helm/monitoring/grafana, and `reload` for
    # the config-reloader below and for Prometheus's self-scrape — `/-/reload`
    # and `localhost:9090` are authenticated like every other path once a web
    # config is loaded.
    extraArgs:
      web.config.file: /etc/prometheus-web-config/web-config.yml
    extraSecretMounts:
      - name: prometheus-web-config
        mountPath: /etc/prometheus-web-config
        secretName: prometheus-basicauth
        readOnly: true
    # TCP, not HTTP: the kubelet's probe carries no credential, and Prometheus
    # answers 401 on `/-/healthy` as well. The chart's `probeHeaders` exists for
    # this and is unusable here — it takes the value literally, so the password
    # would land in this file. The probe proves the listener is up, not that the
    # TSDB answers; the alert rules read the latter.
    tcpSocketProbeEnabled: true
  configmapReload:
    # The credential in the URL is expanded by the kubelet from the environment
    # below, so it is not in git. `reload` is the user the web config carries
    # for it, and its password has to stay URL-safe: it is pasted into a URL.
    reloadUrl: "http://reload:$(PROMETHEUS_RELOAD_PASSWORD)@127.0.0.1:9090/-/reload"
    env:
      - name: PROMETHEUS_RELOAD_PASSWORD
        valueFrom:
          secretKeyRef:
            name: prometheus-basicauth
            key: reload-password
    prometheus:
      image:
        repository: quay.io/prometheus-operator/prometheus-config-reloader
        tag: v0.95.2
      # Measured 9.9 MiB peak over 15 h.
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
  kube-state-metrics:
    fullnameOverride: prometheus-kube-state-metrics
    nodeSelector:
      kubernetes.io/hostname: nas
    image:
      registry: registry.k8s.io
      repository: kube-state-metrics/kube-state-metrics
      tag: v2.20.0
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  prometheus-node-exporter:
    fullnameOverride: prometheus-node-exporter
    # The textfile collector reads the drill log that
    # templates/configmap-restore-drills.yaml renders. `optional: true` because a
    # missing ConfigMap must not stop node-exporter; the rule reports the missing
    # data as Alerting, which is the failure it exists for.
    extraArgs:
      - --collector.textfile.directory=/restore-drills
    extraVolumes:
      - name: restore-drills
        configMap:
          name: restore-drills
          optional: true
    extraVolumeMounts:
      - name: restore-drills
        mountPath: /restore-drills
        readOnly: true
    image:
      registry: quay.io
      repository: prometheus/node-exporter
      tag: v1.13.1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  # The two edge Pis run their exporters outside the cluster, so annotation
  # discovery can never find them. Ports: 9100 node-exporter, 9902 smartctl,
  # 9323 Docker.
  #
  # kubernetes-api-servers is half the series in this cluster, and almost all of
  # it is histogram buckets that no dashboard and no alert rule reads. The
  # sums and counts stay, so request rate, error rate and an average latency
  # are still visible; the buckets are dropped before they reach the head.
  # Measured 2026-11-18: 28,964 series match this rule, 19,488 of them
  # etcd_request_duration_seconds_bucket alone. Buckets were once dropped for
  # apiserver_* only, which left the largest family behind.
  scrapeConfigs:
    kubernetes-api-servers:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "(apiserver|etcd|workqueue|scheduler|storage_operation|kubelet|rest_client).*_bucket"
    # K3s runs the API server, etcd, scheduler and kubelet in one process, so
    # every control-plane node's kubelet endpoint republishes the whole control
    # plane: 102.6k of this cluster's 196k series, ~93% of them duplicated
    # three times over and already collected by the job above. Keep the kubelet
    # and volume families this job exists for.
    #
    # The kubelet's own histograms go the same way as the control plane's: no
    # panel and no rule reads one, and 4,932 of this job's 7,520 stored series
    # are buckets. kubelet_volume_stats_* is untouched — the NFS claim panels and
    # PVCFillingUp read it.
    kubernetes-nodes:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "apiserver_.*|etcd_.*|scheduler_.*|controller_.*|workqueue_.*|rest_client_.*|go_.*|process_.*|apiextensions_.*|aggregator_.*|authentication_.*|authorization_.*|field_validation_.*|watch_cache_.*|node_authorizer_.*|kubernetes_feature_enabled"
        - action: drop
          source_labels:
            - __name__
          regex: "(kubelet|storage_operation|volume_operation|kubeproxy).*_bucket"
    # cAdvisor publishes 76 families per container, and the Applications board
    # reads two of them: container_cpu_usage_seconds_total and
    # container_memory_working_set_bytes. The 17 families below are 10,058 of
    # this job's 21,557 series and appear in no panel and no rule. The identity
    # and limit families (container_last_seen, container_start_time_seconds,
    # container_spec_memory_limit_bytes, container_oom_events_total) stay: they
    # are what makes a container's own numbers readable next to the others.
    kubernetes-nodes-cadvisor:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "container_(tasks_state|memory_failures_total|memory_failcnt|memory_max_usage_bytes|memory_mapped_file|memory_swap|memory_kernel_usage|memory_cache|blkio_device_usage_total|fs_reads_total|fs_writes_total|cpu_load_average_10s|file_descriptors|processes|sockets|threads|threads_max)"
    # kube-state-metrics publishes one series per object across 812 families.
    # Four of those families have no reader: every Secret in the cluster
    # (421 of them, names and type only), pod tolerations, ReplicaSets — the
    # replica panels read Deployments and StatefulSets — and the QoS class.
    # Measured 2026-11-18: 6,156 series match this rule. kube_persistentvolume_status_phase
    # has no reader either and stays: PV state matters to the Longhorn cleanup.
    kubernetes-service-endpoints:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "kube_secret_.*|kube_pod_tolerations|kube_replicaset_.*|kube_pod_status_qos_class"
        # Argo CD's three components publish 3,384 series and the rule keeps
        # 350 of them — the Application, repository, cluster, git and redis
        # families, of which `argocd_app_condition` is the one a rule reads
        # today. The rest is the server's gRPC matrix — 1,938 series, one
        # per method × 17 status codes, most permanently zero — plus client-go's
        # work-queue and kubectl instrumentation, the controller's webhook
        # counters, and each process's Go runtime. Measured 2026-11-22; no panel
        # and no rule reads any of it.
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "argocd;(go_.*|process_.*|grpc_server_.*|argocd_kubectl_.*|workqueue_.*|controller_runtime_.*|certwatcher_.*)"
    # Same guard as the pods -slow job: this is where a Service annotated
    # prometheus.io/scrape_slow is scraped, and the KSM families above would
    # come back through it.
    kubernetes-service-endpoints-slow:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "kube_secret_.*|kube_pod_tolerations|kube_replicaset_.*|kube_pod_status_qos_class"
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "argocd;(go_.*|process_.*|grpc_server_.*|argocd_kubectl_.*|workqueue_.*|controller_runtime_.*|certwatcher_.*)"
    # The pod-scraped exporters publish what they publish: qBittorrent writes
    # one series per torrent per field, 6,240 series for 365 torrents, while the
    # Media board reads four qbittorrent_global_* totals. The n8n histogram is
    # 1,610 series with no panel and no rule — n8n publishes three bucket
    # families of its own, of which the HTTP one is the large one.
    # Traefik's buckets are NOT dropped: the Homelab · Traefik board reads a p95
    # from traefik_router_request_duration_seconds_bucket, so that family is the
    # reader those buckets did not have before 2026-11-21. They cost 336 series
    # once the values widen the buckets, 0.4 % of the 84,747-series head.
    # Measured 2026-11-21: 6,240 + 1,610 series from this job. container_* is
    # not touched here; the cadvisor job owns those families.
    #
    # The media stack's ten targets are 979 of those series and nothing reads
    # 746 of them: the five *arr sidecars publish one series per indexer,
    # genre, quality, tag and library item, and every exporter that is not the
    # qBittorrent one publishes its own Go or Python runtime counters. The
    # Media board reads fifteen names in total, listed on each rule below.
    # Everything else the media exporters publish is dropped at the scrape, so
    # it is never written to the head. Measured 2026-11-18: 979 series across
    # ten targets, 731 matched by these seven rules. The sample rate those
    # targets wrote falls from 16.3 to 1.6 samples/s, because eight of the ten
    # carry prometheus.io/scrape_slow and are scraped every 5 minutes instead of
    # every minute.
    #
    # Scoped by namespace, not by container: a name that a future version of an
    # exporter renames would otherwise come back silently. These rules cover
    # media-stack only; the argocd namespace's runtime counters are dropped by
    # the service-endpoints rules above, and every other namespace keeps its own.
    kubernetes-pods:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "qbittorrent_torrent_.*|n8n_.*_bucket"
        # Runtime counters: no panel and no rule reads one. A pod's CPU and
        # memory are cAdvisor's `container_*` families, not the exporter's own.
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "media-stack;(go_.*|process_.*|python_.*)"
        # lidarr_artists_genres_total: one series per genre, 224 of them, read
        # by nothing. The album counts the Media board shows are single series.
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "media-stack;lidarr_artists_genres_total"
        # Prowlarr's per-indexer stats: 20 series each for eight families the
        # Media board does not chart. `prowlarr_indexer_unavailable` and
        # `prowlarr_indexer_failed_queries_total` stay — the first says an
        # indexer is down, the second is what the board's "failed 1 h" column
        # increases.
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "media-stack;prowlarr_indexer_(auth_queries_total|average_response_time_ms|failed_auth_queries_total|failed_grabs_total|failed_rss_queries_total|grabs_total|queries_total|rss_queries_total)|media-stack;prowlarr_user_agent_(grabs|queries)_total"
        # qBittorrent's per-category and per-tag counters: 17 categories and 34
        # tags. The board reads four `qbittorrent_global_*` totals.
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "media-stack;qbittorrent_global_(categories|tags)"
        # Plex's per-item families, one per library item: top item, watch age,
        # resolution, codec, recent additions. `plex_library_items` and
        # `plex_library_storage_bytes` are the two the board reads, and both
        # stay, as do the session families behind "Plex now".
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "media-stack;plex_(library_(top_item_bytes|top_item_last_played_timestamp_seconds|recent_item_added_timestamp_seconds|resolution_bytes|codec_bytes|watch_age_bytes|watch_age_items|added_items|duration_milliseconds|last_scan_timestamp_seconds|extra_version_bytes|multi_version_items|newest_item_added_timestamp_seconds|unsized_items|walk_duration_seconds|walk_last_success_timestamp_seconds|walkable)|exporter_errors_total|refresh_deadline_exceeded_total|history_read_status)"
        # One series per quality profile and per tag, on both Radarrs.
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "media-stack;radarr_movie_(quality|tag)_total"
        # autobrr's per-channel and per-feed timestamps, one per IRC channel
        # and feed. The board reads the push counters and the connected total.
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "media-stack;autobrr_(feed_(last_run|next_run)_timestamp_seconds|irc_channel_.*)"
    # The two -slow jobs scrape the targets that carry prometheus.io/scrape_slow
    # instead of prometheus.io/scrape, so a drop on the fast job never reaches
    # them. The exportarr sidecars and autobrr carry that annotation since
    # 2026-11-18 (their numbers move in minutes, and no rule reads them), which
    # makes the media rules below load-bearing rather than a guard: the same
    # five are repeated here so a target moving between jobs keeps its trim.
    kubernetes-pods-slow:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "qbittorrent_torrent_.*|n8n_.*_bucket"
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "media-stack;(go_.*|process_.*|python_.*)"
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "media-stack;lidarr_artists_genres_total"
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "media-stack;prowlarr_indexer_(auth_queries_total|average_response_time_ms|failed_auth_queries_total|failed_grabs_total|failed_rss_queries_total|grabs_total|queries_total|rss_queries_total)|media-stack;prowlarr_user_agent_(grabs|queries)_total"
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "media-stack;qbittorrent_global_(categories|tags)"
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "media-stack;plex_(library_(top_item_bytes|top_item_last_played_timestamp_seconds|recent_item_added_timestamp_seconds|resolution_bytes|codec_bytes|watch_age_bytes|watch_age_items|added_items|duration_milliseconds|last_scan_timestamp_seconds|extra_version_bytes|multi_version_items|newest_item_added_timestamp_seconds|unsized_items|walk_duration_seconds|walk_last_success_timestamp_seconds|walkable)|exporter_errors_total|refresh_deadline_exceeded_total|history_read_status)"
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "media-stack;radarr_movie_(quality|tag)_total"
        - action: drop
          source_labels:
            - namespace
            - __name__
          separator: ";"
          regex: "media-stack;autobrr_(feed_(last_run|next_run)_timestamp_seconds|irc_channel_.*)"
    rbp0:
      enabled: true
      static_configs:
        - targets:
            - 192.168.1.22:9100
            - 192.168.1.22:9902
            - 192.168.1.22:9323
    rbp1:
      enabled: true
      static_configs:
        - targets:
            - 192.168.1.38:9100
            - 192.168.1.38:9902
            - 192.168.1.38:9323
    # The bouncer's own numbers: `fw_bouncer_banned_ips{origin,ip_type}` is the
    # only proof that a decision became a dropped packet, and `up` on this target
    # is the only proof the bouncer is running. A static target because the
    # bouncer is a host service on a named address, not a pod — the same shape as
    # the `rbp0` and `rbp1` entries above, keyed by job name.
    crowdsec-bouncer:
      enabled: true
      static_configs:
        - targets:
            - 192.168.1.46:60601
    # Loki and Grafana publish their own /metrics and nothing scraped them
    # before 2026-11-18. Without these two jobs the stack watched every app
    # but not itself: a Loki rejecting writes and a Grafana whose rules fail to
    # evaluate both looked like silence.
    #
    # Scrape the Service port, not the container port. Loki's Service declares
    # 3100, so that address works; Grafana's Service declares only 80 and maps
    # it to the container's 3000, so :3000 answers nothing and the scrape times
    # out. That was the first version of this job.
    #
    # Their histograms are another 6,968 series across the three jobs and no
    # reader takes one: the two stack rules read counters,
    # loki_request_duration_seconds_count and
    # grafana_alerting_rule_evaluation_failures_total. Dropping every _bucket
    # keeps those counters and every _sum.
    loki:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: ".*_bucket"
      static_configs:
        - targets:
            - loki.monitoring.svc:3100
    grafana:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: ".*_bucket"
      static_configs:
        - targets:
            - grafana.monitoring.svc:80
    prometheus:
      # The server's own /metrics, not the chart section above.
      #
      # This is the one target the web config would otherwise cut off: it scrapes
      # `localhost:9090`, and an unauthenticated scrape is answered 401, which
      # fires `MonitoringDown` (`1 - up{job="prometheus"}`). It signs in as
      # `reload`, the user the config-reloader already holds: both processes are
      # containers of this pod, and the plaintext is mounted beside the hashes.
      # Prometheus reads the file on every config load, so a rotation needs the
      # Secret patched and the pod restarted, like the rest of the web config.
      basic_auth:
        username: reload
        password_file: /etc/prometheus-web-config/reload-password
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: ".*_bucket"
    # Fluent Bit ships every line Loki stores, and nothing scraped Fluent Bit
    # itself: `count({__name__=~"fluentbit_.*"})` answered 0 on 2026-11-22, so a
    # dropped record, an output retry or a full 5 MB input buffer was invisible
    # while every log measurement was taken from what did arrive. The HTTP server
    # is on (`HTTP_Server On`, port 2020) and serves Prometheus text at this path.
    fluent-bit:
      metrics_path: /api/v2/metrics/prometheus
      static_configs:
        - targets:
            - fluent-bit.monitoring.svc:2020
    # The prober answers about whatever URL it is handed, so every blackbox job
    # aims its single Service address and passes the URL to probe in
    # __param_target; instance is rewritten from that URL, so a series is
    # identified by what was probed rather than by the prober.
    #
    # blackbox-dns carries no params block on purpose: it copies each target's
    # module label into __param_module, and a params block in the same job would
    # take precedence, asking all 22 servers one question.
    blackbox-http:
      enabled: true
      metrics_path: /probe
      scrape_interval: 1m
      params:
        module: [http_2xx]
      static_configs:
        - targets:
            - https://ashudev.com
          labels: {check: http}
        - targets:
            - https://www.ashudev.com
          labels: {check: http}
        - targets:
            - https://ashuvidz.com
          labels: {check: http}
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          target_label: instance
        - target_label: __address__
          replacement: blackbox-exporter.monitoring.svc:9115
    # Every authoritative server of both zones: OVH holds ashudev.com and
    # ashuvidz.com, and a zone that answers from one server only hides a broken
    # secondary until the primary drops. One target per question, since the
    # module label is what differs.
    blackbox-dns:
      enabled: true
      metrics_path: /probe
      scrape_interval: 5m
      static_configs:
        - targets:
            - dns13.ovh.net:53
          labels: {module: dns_soa_ashudev, check: soa, zone: ashudev.com}
        - targets:
            - dns13.ovh.net:53
          labels: {module: dns_a_ashudev, check: a, zone: ashudev.com}
        - targets:
            - dns13.ovh.net:53
          labels: {module: dns_www_ashudev, check: www, zone: ashudev.com}
        - targets:
            - dns13.ovh.net:53
          labels: {module: dns_mx_ashudev, check: mx, zone: ashudev.com}
        - targets:
            - dns13.ovh.net:53
          labels: {module: dns_spf_ashudev, check: spf, zone: ashudev.com}
        - targets:
            - dns13.ovh.net:53
          labels: {module: dns_dkim_ashudev, check: dkim, zone: ashudev.com}
        - targets:
            - dns13.ovh.net:53
          labels: {module: dns_dmarc_ashudev, check: dmarc, zone: ashudev.com}
        - targets:
            - dns13.ovh.net:53
          labels: {module: dns_ns_ashudev, check: ns, zone: ashudev.com}
