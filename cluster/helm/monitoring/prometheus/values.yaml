traefik:
  apiVersion: traefik.containo.us/v1alpha1

ingress:
  host: prometheus.kub.local
  service: prometheus-server
  port: 80

prometheus:
  fullnameOverride: prometheus
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  server:
    fullnameOverride: prometheus-server
    retention: 90d
    retentionSize: 20GB
    strategy:
      type: Recreate
    persistentVolume:
      enabled: true
      size: 25Gi
    nodeSelector:
      kubernetes.io/hostname: nas
    # 1Gi was not enough: the server was OOM-killed ~50s after every start.
    # Prometheus 3 sizes its own GC from the cgroup limit, so the limit has to
    # cover the scrape head, not just the steady state.
    # Measured 2026-11-12 over 15 h: 1.26 GiB average, 1.74 GiB p95, 1.76 GiB
    # peak. The 2 GiB ceiling is kept because Prometheus sizes its GC target from
    # the cgroup limit; 1 GiB OOM-killed it on 2026-11-12. The request tracks the
    # steady state so the scheduler reserves what it actually holds.
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 2Gi
    image:
      repository: quay.io/prometheus/prometheus
      tag: v3.16.0
  configmapReload:
    prometheus:
      image:
        repository: quay.io/prometheus-operator/prometheus-config-reloader
        tag: v0.95.2
      # Measured 9.9 MiB peak over 15 h.
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
  kube-state-metrics:
    fullnameOverride: prometheus-kube-state-metrics
    nodeSelector:
      kubernetes.io/hostname: nas
    image:
      registry: registry.k8s.io
      repository: kube-state-metrics/kube-state-metrics
      tag: v2.20.0
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  prometheus-node-exporter:
    fullnameOverride: prometheus-node-exporter
    image:
      registry: quay.io
      repository: prometheus/node-exporter
      tag: v1.12.1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  # The two edge Pis run their exporters outside the cluster, so annotation
  # discovery can never find them. Ports: 9100 node-exporter, 9902 smartctl,
  # 9323 Docker.
  #
  # kubernetes-api-servers is half the series in this cluster: 35.9k of 65.8k
  # measured on 2026-11-12, almost all of it histogram buckets that no
  # dashboard reads. The counters stay, so request rate and error rate are
  # still visible; the buckets are dropped before they reach the head.
  scrapeConfigs:
    kubernetes-api-servers:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "apiserver_.*_bucket"
    # K3s runs the API server, etcd, scheduler and kubelet in one process, so
    # every control-plane node's kubelet endpoint republishes the whole control
    # plane: 102.6k of this cluster's 196k series, ~93% of them duplicated
    # three times over and already collected by the job above. Keep the kubelet
    # and volume families this job exists for.
    kubernetes-nodes:
      metric_relabel_configs:
        - action: drop
          source_labels:
            - __name__
          regex: "apiserver_.*|etcd_.*|scheduler_.*|controller_.*|workqueue_.*|rest_client_.*|go_.*|process_.*|apiextensions_.*|aggregator_.*|authentication_.*|authorization_.*|field_validation_.*|watch_cache_.*|node_authorizer_.*|kubernetes_feature_enabled"
    rbp0:
      enabled: true
      static_configs:
        - targets:
            - 192.168.1.22:9100
            - 192.168.1.22:9902
            - 192.168.1.22:9323
    rbp1:
      enabled: true
      static_configs:
        - targets:
            - 192.168.1.38:9100
            - 192.168.1.38:9902
            - 192.168.1.38:9323
