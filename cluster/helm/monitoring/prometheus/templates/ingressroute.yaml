{{- /*
`lan-only` stays as the outer gate on the whole host: the router forwards 80/443
to one cluster address and routes on the Host header, so without it this name
answers the internet. It is no longer the access control. Prometheus loads a web
config of its own (`values.yaml`) and answers `401` to a caller with no
credential, whatever the source address — the gate admits the pod network too,
which is why the check lives in the process.

The route is still on `web`, so the credential is base64 on the LAN; moving it to
`websecure` means a second router for the redirect, which the generated
`docs/reference/routes.md` cannot take until the live object count moves with it.
That move is its own card.
*/ -}}
apiVersion: {{ .Values.traefik.apiVersion }}
kind: IngressRoute
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      middlewares:
        - name: kube-system-lan-only@kubernetescrd
      services:
        - name: {{ .Values.ingress.service }}
          port: {{ .Values.ingress.port }}
