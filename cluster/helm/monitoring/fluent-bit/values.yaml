fluent-bit:
  fullnameOverride: fluent-bit
  kind: DaemonSet
  image:
    repository: cr.fluentbit.io/fluent/fluent-bit
    tag: 5.2.1
  testFramework:
    enabled: false
  rbac:
    create: true
    nodeAccess: false
    eventsAccess: false
  # Measured 2026-11-12 over 15 h, per DaemonSet pod: 6-9 MiB average, 11.6 MiB
  # peak. 64 MiB leaves five times the observed peak for a log burst.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  livenessProbe:
    httpGet:
      path: /api/v2/health
      port: http
  config:
    service: |
      [SERVICE]
          Daemon Off
          Flush 5
          Log_Level info
          Parsers_File /fluent-bit/etc/parsers.conf
          Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
          HTTP_Server On
          HTTP_Listen 0.0.0.0
          HTTP_Port 2020
          Health_Check On
    inputs: |
      [INPUT]
          Name tail
          Path /var/log/containers/*.log
          multiline.parser docker, cri
          Tag kube.*
          Mem_Buf_Limit 5MB
          Skip_Long_Lines On

      # Traefik's access log, written to a file on the host because two readers
      # disagree about its contents (cluster/helm/platform/traefik). Parser json
      # splits the line into fields so the next filter can remove two of them;
      # Line_Format json puts the rest back as one JSON object, which is what
      # Loki's `| json` panels already expect.
      #
      # No `Time_Key`: Traefik writes RFC3339 with nanoseconds and an offset, and
      # a `Time_Format` that does not match it is a silent fallback to the wrong
      # timestamp or a rejected line. The record is stamped at ingestion, a
      # fraction of a second later, and the line's own `time` field stays in the
      # JSON for anything that needs the request's own clock.
      [INPUT]
          Name tail
          Path /var/log/traefik/access.log
          Tag traefik.access
          Parser json
          Mem_Buf_Limit 5MB
          Skip_Long_Lines On

      # The host's own journal: `ssh` auth failures and the kernel's ufw block
      # lines (ufw logs through the kernel). Fluent Bit runs as a DaemonSet, so
      # each node reads its own journal and `_HOSTNAME` inside the line says
      # which. UFW rate-limits its own logging, so a burst is visible as a burst
      # and the exact packet count is not.
      #
      # Two inputs, not one: the systemd plugin ANDs filters that name different
      # fields and ORs ones that name the same field, so one input carrying both
      # selectors would match nothing — a pipeline that looks configured and
      # ships zero lines.
      #
      # `_COMM=sshd`, not `_SYSTEMD_UNIT=ssh.service`: Ubuntu 22.10 and later
      # socket-activate sshd, so the listener is `ssh.socket` and each connection
      # is a transient `ssh@<n>-<addr>.service`. A unit filter would ship nothing
      # on exactly the hosts where a brute-force attempt is most visible, and
      # report zero rather than fail. `_COMM=sshd` matches the daemon in both
      # shapes.
      #
      # No `Path`: the plugin's default calls sd_journal_open(LOCAL_ONLY), which
      # reads both `/var/log/journal` and the volatile `/run/log/journal`.
      # `Path` switches it to opening one directory, and journald's
      # `Storage=auto` means a node may hold only the volatile journal, since
      # nothing in this repository creates `/var/log/journal`.
      #
      # "Local" resolves to the host's journal because the chart mounts the
      # host's `/etc/machine-id`: sd_journal_open(LOCAL_ONLY) looks for
      # `<journal dir>/<machine-id>`, so that mount is load-bearing for both
      # inputs and not decoration.
      #
      # `Max_Fields 200` is a cap, and an entry over it is **discarded** rather
      # than trimmed: five times a real `sshd` entry and ten times a kernel one,
      # so it should never bite, but the first hour of the pod's own log is what
      # proves that.
      [INPUT]
          Name systemd
          Tag host.ssh
          DB /var/lib/fluent-bit/ssh.db
          Read_From_Tail On
          Max_Fields 200
          Systemd_Filter _COMM=sshd

      [INPUT]
          Name systemd
          Tag host.kernel
          DB /var/lib/fluent-bit/kernel.db
          Read_From_Tail On
          Max_Fields 200
          Systemd_Filter _TRANSPORT=kernel
    filters: |
      [FILTER]
          Name kubernetes
          Match kube.*
          Merge_Log On
          Keep_Log Off
          K8S-Logging.Parser On
          K8S-Logging.Exclude On

      # The only difference between the file and the store. `RequestPath` holds
      # FileBrowser's /share/<hash> and Plex's token when one slips past the
      # query-parameter drop; `request_User-Agent` is a fingerprint nobody needs
      # for 30 days. Scoped by tag: a bare `modify` filter would strip these keys
      # from every container's JSON in the kube.* pipeline.
      [FILTER]
          Name modify
          Match traefik.access
          Remove RequestPath
          Remove request_User-Agent
          Remove RequestReferer
    # What Loki stores is what a panel reads, and Fluent Bit's default line is the
    # whole record as JSON. Measured on 2026-11-18: 63 % of every line was that
    # `kubernetes` block, repeating labels Loki already holds as stream labels
    # (`labels` 258 B, `annotations` 134 B, `container_hash` 98 B, `docker_id`
    # 66 B), and another 9 % was the CRI `time`, `stream` and `_p` fields, which
    # duplicate the record timestamp and the container name. Messages were 26 %.
    #
    # `Remove_Keys` strips those from the line only. Labels and structured
    # metadata are resolved from the record *before* the line is packed —
    # `pack_labels()` runs ahead of `pack_record()` in the loki output — so
    # `namespace`, `container`, `node` and `pod` below still resolve. Then
    # `Drop_Single_Key raw` sends the app's own message unquoted when `log` is
    # all that is left, while a pod that logs JSON keeps its JSON and Loki keeps
    # reading its `level` field.
    outputs: |
      [OUTPUT]
          Name loki
          Match kube.*
          Host loki.monitoring.svc.cluster.local
          Port 3100
          Line_Format json
          Remove_Keys kubernetes,stream,time,_p
          Drop_Single_Key raw
          Compress gzip
          Retry_Limit no_limits
          Labels job=fluent-bit, namespace=$kubernetes['namespace_name'], container=$kubernetes['container_name'], node=$kubernetes['host']
          Structured_Metadata pod=$kubernetes['pod_name']

      # Static labels, chosen to match the container pipeline exactly: the
      # Traefik dashboard's rows and docs/reference/log-budget.md query
      # `{job="fluent-bit", container="traefik"}`, and they keep resolving
      # without an edit. `source` is the one addition, so the file's stream can
      # be told apart from a container that logs to stdout.
      [OUTPUT]
          Name loki
          Match traefik.access
          Host loki.monitoring.svc.cluster.local
          Port 3100
          Line_Format json
          Compress gzip
          Retry_Limit no_limits
          Labels job=fluent-bit, namespace=kube-system, container=traefik, node=streaming, source=accesslog

      # Constant labels, one per unit, so a rule selects on `unit="ssh"` or
      # `unit="kernel"` without depending on a record accessor resolving to the
      # right key. The node is not a label: it is `_HOSTNAME` inside the line,
      # and a label that does not resolve is worse than none.
      [OUTPUT]
          Name loki
          Match host.ssh
          Host loki.monitoring.svc.cluster.local
          Port 3100
          Line_Format json
          Compress gzip
          Retry_Limit no_limits
          Labels job=fluent-bit, source=journal, unit=ssh

      [OUTPUT]
          Name loki
          Match host.kernel
          Host loki.monitoring.svc.cluster.local
          Port 3100
          Line_Format json
          Compress gzip
          Retry_Limit no_limits
          Labels job=fluent-bit, source=journal, unit=kernel
  # The two position files (`DB` in the inputs above) need a writable directory.
  # The upstream chart mounts `/var/log`, `/var/lib/docker/containers` and
  # `/etc/machine-id` and nothing else, so this emptyDir is the only writable
  # directory there. It dies with the pod, which is why both inputs carry
  # `Read_From_Tail On` — and the price of that pair is the lines written
  # between one pod's death and its replacement's start: they are never shipped.
  # Replaying the journal instead would ship a week of it on every restart, so
  # the gap is the decision, not an oversight.
  #
  # The chart mounts `/var/log` but not `/run`, and journald keeps the volatile
  # journal under `/run/log/journal` on a host without a persistent one, so the
  # runtime directory is mounted too. `DirectoryOrCreate`, not `Directory`: a
  # host with a persistent journal has no `/run/log/journal`, and a plain
  # directory mount would keep the pod from starting on it.
  extraVolumes:
    - name: fb-journal-db
      emptyDir: {}
    - name: host-run-journal
      hostPath:
        path: /run/log/journal
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: fb-journal-db
      mountPath: /var/lib/fluent-bit
    - name: host-run-journal
      mountPath: /run/log/journal
      readOnly: true
