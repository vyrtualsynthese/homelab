fluent-bit:
  fullnameOverride: fluent-bit
  kind: DaemonSet
  image:
    repository: cr.fluentbit.io/fluent/fluent-bit
    tag: 5.2.1
  testFramework:
    enabled: false
  rbac:
    create: true
    nodeAccess: false
    eventsAccess: false
  # Measured 2026-11-12 over 15 h, per DaemonSet pod: 6-9 MiB average, 11.6 MiB
  # peak. 64 MiB leaves five times the observed peak for a log burst.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  livenessProbe:
    httpGet:
      path: /api/v2/health
      port: http
  config:
    service: |
      [SERVICE]
          Daemon Off
          Flush 5
          Log_Level info
          Parsers_File /fluent-bit/etc/parsers.conf
          Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
          HTTP_Server On
          HTTP_Listen 0.0.0.0
          HTTP_Port 2020
          Health_Check On
    inputs: |
      [INPUT]
          Name tail
          Path /var/log/containers/*.log
          multiline.parser docker, cri
          Tag kube.*
          Mem_Buf_Limit 5MB
          Skip_Long_Lines On

      # Traefik's access log, written to a file on the host because two readers
      # disagree about its contents (cluster/helm/platform/traefik). Parser json
      # splits the line into fields so the next filter can remove two of them;
      # Line_Format json puts the rest back as one JSON object, which is what
      # Loki's `| json` panels already expect.
      #
      # No `Time_Key`: Traefik writes RFC3339 with nanoseconds and an offset, and
      # a `Time_Format` that does not match it is a silent fallback to the wrong
      # timestamp or a rejected line. The record is stamped at ingestion, a
      # fraction of a second later, and the line's own `time` field stays in the
      # JSON for anything that needs the request's own clock.
      [INPUT]
          Name tail
          Path /var/log/traefik/access.log
          Tag traefik.access
          Parser json
          Mem_Buf_Limit 5MB
          Skip_Long_Lines On
    filters: |
      [FILTER]
          Name kubernetes
          Match kube.*
          Merge_Log On
          Keep_Log Off
          K8S-Logging.Parser On
          K8S-Logging.Exclude On

      # The only difference between the file and the store. `RequestPath` holds
      # FileBrowser's /share/<hash> and Plex's token when one slips past the
      # query-parameter drop; `request_User-Agent` is a fingerprint nobody needs
      # for 30 days. Scoped by tag: a bare `modify` filter would strip these keys
      # from every container's JSON in the kube.* pipeline.
      [FILTER]
          Name modify
          Match traefik.access
          Remove RequestPath
          Remove request_User-Agent
          Remove RequestReferer
    # What Loki stores is what a panel reads, and Fluent Bit's default line is the
    # whole record as JSON. Measured on 2026-11-18: 63 % of every line was that
    # `kubernetes` block, repeating labels Loki already holds as stream labels
    # (`labels` 258 B, `annotations` 134 B, `container_hash` 98 B, `docker_id`
    # 66 B), and another 9 % was the CRI `time`, `stream` and `_p` fields, which
    # duplicate the record timestamp and the container name. Messages were 26 %.
    #
    # `Remove_Keys` strips those from the line only. Labels and structured
    # metadata are resolved from the record *before* the line is packed —
    # `pack_labels()` runs ahead of `pack_record()` in the loki output — so
    # `namespace`, `container`, `node` and `pod` below still resolve. Then
    # `Drop_Single_Key raw` sends the app's own message unquoted when `log` is
    # all that is left, while a pod that logs JSON keeps its JSON and Loki keeps
    # reading its `level` field.
    outputs: |
      [OUTPUT]
          Name loki
          Match kube.*
          Host loki.monitoring.svc.cluster.local
          Port 3100
          Line_Format json
          Remove_Keys kubernetes,stream,time,_p
          Drop_Single_Key raw
          Compress gzip
          Retry_Limit no_limits
          Labels job=fluent-bit, namespace=$kubernetes['namespace_name'], container=$kubernetes['container_name'], node=$kubernetes['host']
          Structured_Metadata pod=$kubernetes['pod_name']

      # Static labels, chosen to match the container pipeline exactly: the
      # Traefik dashboard's rows and docs/reference/log-budget.md query
      # `{job="fluent-bit", container="traefik"}`, and they keep resolving
      # without an edit. `source` is the one addition, so the file's stream can
      # be told apart from a container that logs to stdout.
      [OUTPUT]
          Name loki
          Match traefik.access
          Host loki.monitoring.svc.cluster.local
          Port 3100
          Line_Format json
          Compress gzip
          Retry_Limit no_limits
          Labels job=fluent-bit, namespace=kube-system, container=traefik, node=streaming, source=accesslog
