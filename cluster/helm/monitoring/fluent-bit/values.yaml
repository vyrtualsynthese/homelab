fluent-bit:
  # Prometheus discovers each DaemonSet pod by annotation. The metrics are served by
  # the HTTP server this chart already configures below (port 2020), and the path is
  # not /metrics: Fluent Bit's Prometheus output lives at /api/v1/metrics/prometheus,
  # so the default path would 404 on every node.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/scheme: http
    prometheus.io/port: "2020"
    prometheus.io/path: "/api/v1/metrics/prometheus"
  fullnameOverride: fluent-bit
  kind: DaemonSet
  image:
    repository: cr.fluentbit.io/fluent/fluent-bit
    tag: 5.1.3
  testFramework:
    enabled: false
  rbac:
    create: true
    nodeAccess: false
    eventsAccess: false
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  livenessProbe:
    httpGet:
      path: /api/v2/health
      port: http
  config:
    service: |
      [SERVICE]
          Daemon Off
          Flush 5
          Log_Level info
          Parsers_File /fluent-bit/etc/parsers.conf
          Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
          HTTP_Server On
          HTTP_Listen 0.0.0.0
          HTTP_Port 2020
          Health_Check On
    inputs: |
      [INPUT]
          Name tail
          Path /var/log/containers/*.log
          multiline.parser docker, cri
          Tag kube.*
          Mem_Buf_Limit 5MB
          Skip_Long_Lines On
    filters: |
      [FILTER]
          Name kubernetes
          Match kube.*
          Merge_Log On
          Keep_Log Off
          K8S-Logging.Parser On
          K8S-Logging.Exclude On
    outputs: |
      [OUTPUT]
          Name loki
          Match kube.*
          Host loki.monitoring.svc.cluster.local
          Port 3100
          Line_Format json
          Compress gzip
          Retry_Limit no_limits
          Labels job=fluent-bit, namespace=$kubernetes['namespace_name'], container=$kubernetes['container_name'], node=$kubernetes['host']
          Structured_Metadata pod=$kubernetes['pod_name']
