# Default values for dashy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/akpw/mktxp
  pullPolicy: IfNotPresent
  # renovate: datasource=docker depName=ghcr.io/akpw/mktxp
  # Explicit tag, not latest: two switches are the only devices this exporter
  # reads, so a silent image change is one restart away from a blank Network
  # dashboard with nothing in the cluster recording what it was before.
  tag: v2.1.0

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/scheme: "http"
  prometheus.io/port: "49090"

podSecurityContext: {}

  # fsGroup: 2000

securityContext:
  privileged: true
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

ingress:
  enabled: false
  className: ""
  annotations: {}

# Sized from Prometheus on 2026-11-13 over the 39h it holds: 30Mi average and
# 30Mi peak. The 128Mi request was four times the app.
resources:
  requests:
    cpu: 1m
    memory: 64Mi
  limits:
    memory: 256Mi
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Pinned the way every other workload is. The old affinity required
# `node-type=general`, a label the repo retired and a new node would not carry;
# mktxp only scheduled because nuc0 still has it.
nodeSelector:
  kubernetes.io/hostname: nuc0

tolerations: {}

affinity: {}
