# Default values for mktxp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/akpw/mktxp
  # latest is the only usable tag: ghcr.io/akpw/mktxp publishes no semver
  # tags, only latest, stable-<timestamp> (last one 2024-08-21) and gha-<run>.
  # Pinning v2.1.0, after the GitHub release name, put the pod in
  # ImagePullBackOff and took both switches offline on 2026-11-18. Pull Always
  # is what a floating tag needs. Staying on latest was decided on 2026-11-19
  # when digest pinning was dropped repo-wide: this image can change under the
  # cluster and nothing here will notice.
  pullPolicy: Always
  tag: latest

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/scheme: "http"
  prometheus.io/port: "49090"

podSecurityContext: {}

# mktxp speaks the RouterOS API over TCP and mounts only a Secret and an
# emptyDir: it reads no device, touches no host path and binds no port below
# 1024. `privileged: true` was a `helm create` leftover from another chart, so
# it is gone and the capabilities go with it. The image still starts as root;
# this narrows what that root can reach rather than changing the user.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

ingress:
  enabled: false
  className: ""
  annotations: {}

# Sized from Prometheus on 2026-11-13 over the 39h it holds: 30Mi average and
# 30Mi peak. The 128Mi request was four times the app.
resources:
  requests:
    cpu: 1m
    memory: 64Mi
  limits:
    memory: 256Mi
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Pinned the way every other workload is. The old affinity required
# `node-type=general`, a label the repo retired and a new node would not carry;
# mktxp only scheduled because nuc0 carried it; the label was removed on 2026-11-22.
# Changing the host moves the pod's egress address, and the switches allow the
# `monitoring` account from nuc0's address only (group `mktxp`, pinned 2026-11-25):
# move it here and `/user set monitoring address=<new>` on both switches in the
# same change, or mktxp cannot log in.
nodeSelector:
  kubernetes.io/hostname: nuc0

tolerations: {}

affinity: {}
