# The relay is one small Python process on a stock image: the code ships in a
# ConfigMap, so there is no image to build and no registry to trust.
image:
  repository: python
  tag: "3.15.2-alpine"

replicaCount: 1

# Where the board lives, inside the cluster, and which project the cards go to.
# Vikunja listens on 3456 — its Service publishes that port. A URL without it
# reaches nothing and hangs until the socket timeout.
vikunja:
  base: http://vikunja.vikunja.svc.cluster.local:3456
  project: 9
  # The kanban view whose buckets are the columns the relay reads, and the
  # column a new card is created in. Both are ids, because a board's column
  # names can be renamed while the ids stay.
  view: 59
  backlogBucket: 115
  # Name of the Secret holding bot-alertmanager's token, created by hand.
  secretName: alert-relay
  secretKey: TOKEN

service:
  port: 8080

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 96Mi

nodeSelector:
  kubernetes.io/hostname: nas
