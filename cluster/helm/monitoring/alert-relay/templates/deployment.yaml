apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: relay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python", "/app/relay.py"]
          env:
            - name: VIKUNJA_BASE
              value: {{ .Values.vikunja.base | quote }}
            - name: ALERTS_PROJECT
              value: {{ .Values.vikunja.project | quote }}
            - name: COMMENT_COOLDOWN_SECONDS
              value: {{ .Values.commentCooldownSeconds | quote }}
            - name: VIKUNJA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.vikunja.secretName }}
                  key: {{ .Values.vikunja.secretKey }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: code
          configMap:
            name: {{ .Release.Name }}-relay
        - name: tmp
          emptyDir: {}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
