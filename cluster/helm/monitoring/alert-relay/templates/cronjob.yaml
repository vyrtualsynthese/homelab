apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-lifecycle
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-lifecycle
spec:
  schedule: {{ .Values.lifecycle.schedule | quote }}
  # A run that overlaps the previous one would read the board twice and could move
  # the same card twice; the next tick is five minutes away.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Release.Name }}-lifecycle
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: lifecycle
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command: ["python", "/app/lifecycle.py"]
              env:
                - name: VIKUNJA_BASE
                  value: {{ .Values.vikunja.base | quote }}
                - name: ALERTS_PROJECT
                  value: {{ .Values.vikunja.project | quote }}
                - name: ALERTS_VIEW
                  value: {{ .Values.vikunja.view | quote }}
                - name: ALERTS_DOING_BUCKET
                  value: {{ .Values.vikunja.doingBucket | quote }}
                - name: ALERTS_VALIDATION_BUCKET
                  value: {{ .Values.vikunja.validationBucket | quote }}
                - name: VIKUNJA_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.vikunja.secretName }}
                      key: {{ .Values.vikunja.secretKey }}
              resources:
{{ toYaml .Values.resources | indent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: code
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: code
              configMap:
                name: {{ .Release.Name }}-relay
            - name: tmp
              emptyDir: {}
          nodeSelector:
{{ toYaml .Values.nodeSelector | indent 12 }}
