traefik:
  apiVersion: traefik.io/v1alpha1

ingress:
  host: grafana.kub.local
  service: grafana
  port: 80

grafana:
  fullnameOverride: grafana
  # Client secret from a Secret in this namespace; the chart exports its keys as
  # environment variables. The ini reads it with $__env{} so no secret is in git.
  envFromSecret: grafana-oidc
  grafana.ini:
    server:
      # Must carry the scheme the browser uses. Grafana builds the Source and
      # Silence links of every Discord alert from `root_url`; an `http` value
      # also makes the OAuth redirect disagree with the authentik provider.
      root_url: https://grafana.kub.local/
      domain: grafana.kub.local
    security:
      # Traefik terminates TLS, so Grafana sees plain HTTP on the pod network and
      # marks its session cookie non-secure by default. The browser only ever
      # speaks https here, so the cookie can stay off the plain-HTTP route.
      cookie_secure: true
    users:
      auto_assign_org: true
    log:
      # Measured 2026-11-18: Grafana was writing 63k lines/day (70 MB), mostly the
      # alert sender's `Sending alerts to local notifier` at info, one per rule
      # per evaluation, plus every Prometheus plugin request. `warn` keeps errors
      # and slow-query warnings, which are the two a human acts on.
      level: warn
      # Grafana 13's search manifest watcher warns twice per poll when no app
      # plugin publishes a manifest, and an empty list is the normal state here:
      # 3,408 lines in the 24 h to 2026-11-22, the only warn volume left after
      # `level: warn`. There is no setting to stop the poll (the upstream issue
      # is grafana/grafana#137058, and `manifest_watcher_poll_interval` feeds the
      # remote watcher only), so the logger is filtered to errors. Search keeps
      # working; it simply has no app manifests to index.
      filters: "search-manifest-watcher:error"
    auth:
      # Only authentik is offered; the local password form is hidden and a
      # visitor with an authentik session is sent there without a click.
      disable_login_form: true
      oauth_auto_login: true
      # Signing out of Grafana also ends the authentik session, so the next
      # visit does not silently sign back in.
      signout_redirect_url: https://authentik.kub.home.ashudev.com/application/o/grafana/end-session/
      # Grafana keeps its own cookie after authentik's session ends, and has no
      # back-channel logout. These bound how long a Grafana session can outlive
      # the SSO session: one hour idle, twelve hours absolute.
      login_maximum_inactive_lifetime_duration: 1h
      login_maximum_lifetime_duration: 12h
    auth.generic_oauth:
      enabled: true
      name: authentik
      client_id: grafana
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid profile email
      auth_url: https://authentik.kub.home.ashudev.com/application/o/authorize/
      token_url: https://authentik.kub.home.ashudev.com/application/o/token/
      api_url: https://authentik.kub.home.ashudev.com/application/o/userinfo/
      allow_sign_up: true
      # Members of authentik's admin group get Grafana's org Admin role;
      # everyone else admitted through authentik is a Viewer.
      role_attribute_path: "contains(groups[*], 'authentik Admins') && 'Admin' || 'Viewer'"
  deploymentStrategy:
    type: Recreate
  nodeSelector:
    kubernetes.io/hostname: nas
  # Re-measured 2026-11-19 over 7 days, across the eight pod generations the
  # rollouts left behind: 370Mi average, 391Mi p95, 427Mi peak. The request was
  # 256Mi, below every generation's p95; 416Mi is the next size above the
  # highest. The 768Mi limit stays at 1.8x the peak, because this app evaluates
  # and delivers every alert in the cluster.
  resources:
    requests:
      cpu: 50m
      memory: 416Mi
    limits:
      memory: 768Mi
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: 13.3.2-distroless
  initChownData:
    image:
      registry: docker.io
      repository: library/busybox
      tag: 1.38.0
  downloadDashboardsImage:
    registry: docker.io
    repository: curlimages/curl
    tag: 8.23.0
  testFramework:
    enabled: false
  admin:
    existingSecret: grafana
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    size: 5Gi
  ingress:
    enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server.monitoring.svc.cluster.local
          access: proxy
          isDefault: true
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
