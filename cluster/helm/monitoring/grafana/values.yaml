traefik:
  apiVersion: traefik.containo.us/v1alpha1

ingress:
  host: grafana.kub.local
  service: grafana
  port: 80

grafana:
  fullnameOverride: grafana
  # Client secret from a Secret in this namespace; the chart exports its keys as
  # environment variables. The ini reads it with $__env{} so no secret is in git.
  envFromSecret: grafana-oidc
  grafana.ini:
    server:
      root_url: http://grafana.kub.local/
      domain: grafana.kub.local
    users:
      auto_assign_org: true
    auth:
      # Only authentik is offered; the local password form is hidden and a
      # visitor with an authentik session is sent there without a click.
      disable_login_form: true
      oauth_auto_login: true
    auth.generic_oauth:
      enabled: true
      name: authentik
      client_id: grafana
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid profile email
      auth_url: https://authentik.kub.home.ashudev.com/application/o/authorize/
      token_url: https://authentik.kub.home.ashudev.com/application/o/token/
      api_url: https://authentik.kub.home.ashudev.com/application/o/userinfo/
      allow_sign_up: true
      # Members of authentik's admin group get Grafana's org Admin role;
      # everyone else admitted through authentik is a Viewer.
      role_attribute_path: "contains(groups[*], 'authentik Admins') && 'Admin' || 'Viewer'"
  deploymentStrategy:
    type: Recreate
  nodeSelector:
    kubernetes.io/hostname: nas
  # Sized from Prometheus on 2026-11-13 over the 39h it holds: 300Mi average and
  # 370Mi peak. The 512Mi limit filled to 74%, and this app now evaluates and
  # delivers every alert in the cluster, so the headroom matters more here than
  # the footprint suggests.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: 13.3.1-distroless
  initChownData:
    image:
      registry: docker.io
      repository: library/busybox
      tag: 1.38.0
  downloadDashboardsImage:
    registry: docker.io
    repository: curlimages/curl
    tag: 8.23.0
  testFramework:
    enabled: false
  admin:
    existingSecret: grafana
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    size: 5Gi
  ingress:
    enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server.monitoring.svc.cluster.local
          access: proxy
          isDefault: true
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
