traefik:
  apiVersion: traefik.containo.us/v1alpha1

ingress:
  host: grafana.kub.local
  service: grafana
  port: 80

grafana:
  fullnameOverride: grafana
  grafana.ini:
    server:
      root_url: http://grafana.kub.local/
      domain: grafana.kub.local
  deploymentStrategy:
    type: Recreate
  nodeSelector:
    kubernetes.io/hostname: nas
  # Measured 2026-11-12 over 15 h: 292 MiB average, 346 MiB p95, 400 MiB peak
  # while loading dashboards. The request covers the steady state; the ceiling
  # keeps 112 MiB of headroom for a render or query burst.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  image:
    registry: docker.io
    repository: grafana/grafana
    tag: 13.3.1-distroless
  initChownData:
    image:
      registry: docker.io
      repository: library/busybox
      tag: 1.38.0
  downloadDashboardsImage:
    registry: docker.io
    repository: curlimages/curl
    tag: 8.23.0
  testFramework:
    enabled: false
  admin:
    existingSecret: grafana
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    size: 5Gi
  ingress:
    enabled: false
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server.monitoring.svc.cluster.local
          access: proxy
          isDefault: true
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
