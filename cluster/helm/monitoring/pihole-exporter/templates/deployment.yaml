{{- if ne (len .Values.pihole.hostnames) (len .Values.pihole.passwordSecret.keys) }}
{{- fail "pihole.hostnames and pihole.passwordSecret.keys must have the same length: PIHOLE_PASSWORD_FILE is positional" }}
{{- end }}
{{- $files := list }}
{{- range $key := .Values.pihole.passwordSecret.keys }}
{{- $files = append $files (printf "%s/%s" $.Values.pihole.passwordSecret.mountPath $key) }}
{{- end }}
{{- range $host := .Values.pihole.hostnames }}
{{- if not (hasKey $.Values.pihole.addresses $host) }}
{{- fail (printf "pihole.addresses has no entry for %s: the pod would fall back to cluster DNS, which races a public resolver for *.kub.local" $host) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fullname" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Prometheus discovers this pod by annotation, finds the port here and
        # asks /metrics. All three come from metrics.port, so the annotation
        # cannot point at a port the container does not listen on.
        prometheus.io/scrape: "true"
        prometheus.io/scheme: "http"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
      labels:
        {{- include "selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # The two names, resolved before the process starts: Go reads /etc/hosts
      # first, so no query leaves the pod for them. Ordered by `hostnames`, the
      # same list PIHOLE_HOSTNAME and PIHOLE_PASSWORD_FILE follow.
      {{- with .Values.pihole.addresses }}
      hostAliases:
        {{- range $host := $.Values.pihole.hostnames }}
        - ip: {{ index $.Values.pihole.addresses $host | quote }}
          hostnames:
            - {{ $host | quote }}
        {{- end }}
      {{- end }}
      volumes:
        # The Secret's keys are the hosts: each key is mounted as a file of the
        # same name, and PIHOLE_PASSWORD_FILE lists them in hostname order.
        # 0444 rather than 0400: the image runs as uid 65532 and a Secret volume
        # is owned by root, so a mode without the other-read bit is unreadable
        # and the exporter exits at startup.
        - name: pihole-auth
          secret:
            secretName: {{ .Values.pihole.passwordSecret.name }}
            defaultMode: 0444
            items:
              {{- range .Values.pihole.passwordSecret.keys }}
              - key: {{ . }}
                path: {{ . }}
              {{- end }}
        # The internal root, mounted whole at the directory Go reads when
        # SSL_CERT_FILE names a file inside it. The image is scratch, so there
        # is no system store to shadow.
        - name: pihole-ca
          configMap:
            name: {{ include "fullname" . }}-ca
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # PIHOLE_PASSWORD, not PIHOLE_API_TOKEN: the exporter reads the
            # former (config/configuration.go) and ignores the latter, so the
            # chart authenticated with an empty password and every poll was a
            # 401 while the pod stayed Ready. The password is handed over as a
            # file rather than a variable so it stays out of the process
            # environment and out of `kubectl describe pod`.
            - name: PIHOLE_PROTOCOL
              value: {{ .Values.pihole.protocol | quote }}
            - name: PIHOLE_PORT
              value: {{ .Values.pihole.port | quote }}
            - name: PIHOLE_HOSTNAME
              value: {{ join "," .Values.pihole.hostnames | quote }}
            # Go's TLS client reads its roots from SSL_CERT_FILE, and the
            # exporter sets no RootCAs of its own, so this file is the whole
            # trust store. It carries the ashulab internal root and no public
            # CA: each Pi's name is verified against the leaf it serves.
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/{{ .Values.pihole.ca.configMapKey }}"
            # One path per host, comma-separated, in the order of hostnames
            # above. The two Pis have different app passwords, which is why this
            # is not a single Secret key.
            - name: PIHOLE_PASSWORD_FILE
              value: {{ join "," $files | quote }}
            - name: PORT
              value: {{ .Values.metrics.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          volumeMounts:
            - name: pihole-auth
              mountPath: {{ .Values.pihole.passwordSecret.mountPath }}
              readOnly: true
            - name: pihole-ca
              mountPath: /etc/ssl/certs
              readOnly: true
          # The image is scratch with no shell and no HTTP client, so the binary
          # is its own check: -healthcheck GETs /liveness on PORT. Liveness and
          # readiness share it on purpose — the only thing that fails while the
          # process stays up is Pi-hole's answer, and a restart cannot fix a
          # credential. A 401 shows in the log and as missing pihole_* series,
          # not as a crash loop.
          livenessProbe:
            exec:
              command:
                - /app/pihole-exporter
                - -healthcheck
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /app/pihole-exporter
                - -healthcheck
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
