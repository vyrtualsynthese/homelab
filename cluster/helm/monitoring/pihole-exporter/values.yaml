# Default values for pihole-exporter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ekofr/pihole-exporter
  pullPolicy: Always
  # v1.4.0 is the first release that speaks Pi-hole v6's own API: it posts the
  # password to /api/auth for a session id and reads /api/stats/summary. The
  # chart runs the same tag as the image it was already on; the defect was in
  # the environment, not the version.
  tag: v1.4.0

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

pihole:
  # Both edge Pis by name, in this order: rbp0 then rbp1. One exporter reads all
  # of them and labels every series with its hostname, so Prometheus scrapes one
  # target. The names are Pi-hole's own records in 02-my-wildcard-dns.conf; the
  # bare addresses would never match a certificate, because a client verifies
  # the name it dialled.
  hostnames:
    - pihole-rbp0.kub.local
    - pihole-rbp1.kub.local

  # Pi-hole v6 serves its panel and API over TLS on 443, and each Pi presents
  # its own leaf from the ashulab internal CA — pihole-rbp0.kub.local and
  # pihole-rbp1.kub.local, minted with `hack/internal-cert.sh --host`. The
  # exporter trusts that root and nothing else, so the peer is authenticated and
  # the skip that used to be here is gone. The root is public, which is why it
  # lives in a ConfigMap: a Secret would imply a key that does not exist.
  ca:
    configMapKey: ashulab-internal-ca.pem
    # The root every internal name chains to, valid until 2036-11-12. Its
    # fingerprint and its two backups are in docs/runbooks/internal-ca.md; a
    # `--force-ca` replacement changes this value in the same change that
    # reinstalls the root on the Pis, and the exporter then dials leaves the old
    # root cannot vouch for.
