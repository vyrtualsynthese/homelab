  protocol: https
  port: 443

  # Application passwords, one per hostname above and in the same order, because
  # the exporter's PIHOLE_PASSWORD_FILE is a comma-separated list it pairs
  # positionally with PIHOLE_HOSTNAME. Created per Pi-hole under
  # Settings > Web interface / API; the keys double as the mounted file names.
  # The operator owns the Secret; this chart only references it.
  passwordSecret:
    name: pihole-exporter
    mountPath: /etc/pihole-exporter
    keys:
      - rbp0
      - rbp1

metrics:
  # One number, three consumers: PORT in the environment, the containerPort and
  # the scrape annotation. The chart declared 9902 for a listener on 9617, so
  # nothing that read the container port could find the exporter.
  port: 9617

# Fluent Bit ships every line to Loki unfiltered. `warn` keeps what matters —
# the once-a-minute authentication failures — and drops the startup chatter.
logLevel: warn

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Sized the way docs/reference/chart-sizing.md says: measured against Prometheus
# on 2026-11-26 over the seven days the TSDB then held — 9.2 MiB average, 11.4
# MiB p95, 12.2 MiB peak — so request = p95 (12Mi) and limit = peak x 1.5 (24Mi).
# The old 28Mi/56Mi pair was a guess. The exporter holds one HTTP session per
# Pi-hole and nothing else, so the band is narrow.
resources:
  requests:
    cpu: 1m
    memory: 12Mi
  limits:
    memory: 24Mi

# Pinned the way every other workload is. The pod reads both Pis over the LAN,
# so the node is a home, not a need; it stays where it has run since 2023.
nodeSelector:
  kubernetes.io/hostname: nuc0

tolerations: []

affinity: {}
