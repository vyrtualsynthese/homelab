apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backup.labels" (dict "root" . "stream" "scripts") | nindent 4 }}
data:
  # Resolves the rows and stages the SQLite copies. Runs as the job's initContainer.
  prepare.py: |
{{ .Files.Get "files/prepare.py" | indent 4 }}
  # One restic run per node job.
  backup-node.sh: |
{{ .Files.Get "files/backup-node.sh" | indent 4 }}
  # One restic run per NFS export.
  backup-nfs.sh: |
{{ .Files.Get "files/backup-nfs.sh" | indent 4 }}
  # The verifier: reads every repository and says whether it is still advancing.
  verify.py: |
{{ .Files.Get "files/verify.py" | indent 4 }}
  # Weekly forget + prune, rendered here so the retention numbers come from values.yaml and
  # exist in one place only. Each repository gets its own policy: the shared tail, with
  # whatever that stream overrides under its `retention:`.
  prune.sh: |
    #!/bin/sh
    # Runs on Sunday at noon, after every night's backup has finished. One repository at a
    # time: two restic processes on one repository would fight over the lock instead of
    # pruning it.
    # Not `set -e`: one repository that fails must not leave the others unpruned for the
    # week. Each failure is remembered, the loop finishes, and the last test fails the job.
    # `forget` carries no --host because each repository holds exactly one host.
    # An `external` stream is written by its own host, which prunes it on its own timer:
    # a prune from here would race that host's `forget` over the lock.
    set -u
    : "${RESTIC_PASSWORD:?}"
    failed=0
    {{- $pruned := list }}
    {{- range .Values.streams }}{{ if not .external }}{{ $pruned = append $pruned . }}{{ end }}{{ end }}
    echo "prune {{ $pruned | len }} repositories"
    {{- range $pruned }}
    {{- $ret := include "backup.retention" (dict "root" $ "stream" .) | fromJson }}
    echo "prune {{ .name }}: daily {{ $ret.daily }}, weekly {{ $ret.weekly }}, monthly {{ $ret.monthly }}{{ if $ret.yearly }}, yearly {{ $ret.yearly }}{{ end }}"
    restic -r "{{ include "backup.repository" (dict "root" $ "name" .name) }}" forget \
      --retry-lock 6h \
      --keep-daily {{ $ret.daily }} \
      --keep-weekly {{ $ret.weekly }} \
      --keep-monthly {{ $ret.monthly }}{{ if $ret.yearly }} \
      --keep-yearly {{ $ret.yearly }}{{ end }} \
      --prune || failed=1
    {{- end }}
    [ "$failed" -eq 0 ]
