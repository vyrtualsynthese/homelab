# The backup chart: one OVH bucket, one restic repository per stream, one job per node.
#
# This file is the coverage matrix in code. A claim is backed up only because a row names
# it. Five outcomes, and the line between them is deliberate:
#
#   * a row whose claim directory cannot be resolved fails that node's job, because the
#     matrix and the cluster disagree and a quiet skip would back up less than this file says;
#   * a `sqlite` row whose claim exists but holds no database yet — an application installed
#     and never started — prints `row-warning` and the job continues, with the claim still
#     backed up whole. A first night must not look like a broken backup;
#   * that tolerance is not silent: `backup-verify` reads the newest snapshot's file list and
#     fails any `sqlite` row with nothing staged under `claims/<namespace>/<claim>/`, naming
#     the row. A `db:` pattern that upstream moved or renamed matches nothing every night from
#     then on, and this is what catches it;
#   * a database that is there and cannot be staged still fails the job. That is data going
#     unbacked, and silence about it is how a backup stops being one;
#   * an `exclude` entry that matches nothing in its claim is named too — the job prints
#     `exclude-unused row=<namespace>/<claim> pattern=<entry>` and carries on, and
#     `backup-verify` repeats the line in the morning from the report the job writes into the
#     snapshot, since the verifier never mounts a claim. The `nfs` rows have no prepare step, so
#     `backup-nfs.sh` checks its own words and prints `exclude-unused path=<tag> pattern=<entry>`
#     into the job's log, which is where the morning check reads it. Also a warning, for the same
#     reason as the row-warning above: an install that has not written its cache yet matches
#     nothing either, and an unused exclusion costs space rather than data. The stream's budget is
#     what bounds that.
#
# Adding a claim to an application's chart means adding a row here in the same change; the
# sizes in the comments are measurements, not estimates: the `du -sb` taken on each node on
# 2026-11-20, and for `nodes-streaming` the snapshot of 2026-11-22, which says so above its
# rows. `kind` decides whether the databases in the row are copied through SQLite's backup API
# (`sqlite`) or the directory is handed over as it is (`files`). Only the files a row's `db`
# patterns match are copied through SQLite; everything else in a `sqlite` claim is byte-copied
# as part of the directory, which is consistent because the app is not writing it between dumps.
#
# An `exclude` entry without a slash is a name, and it excludes that name at any depth. An entry
# with a slash is relative to the claim's root. The distinction is not cosmetic: Plex keeps its
# whole tree under `Library/Application Support/Plex Media Server/`, so `Cache/` has to mean the
# cache three levels down. Until 2026-11-22 prepare.py anchored every entry at the claim root,
# every Plex exclusion matched nothing, and 6.73 GiB of poster art, transcoder cache and Plex's
# own database copies rode in `nodes-streaming` from the first snapshot.

repository:
  bucket: ashudev-homelab-backup
  endpoint: s3.gra.io.cloud.ovh.net
  region: gra
  # RESTIC_PASSWORD, AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. The last two are restic's
  # names for any S3 store's pair: the values are the OVH user declared in
  # infra-main/ovh/backup.tf, scoped to this bucket alone. Nothing here reaches AWS. Created by hand from the
  # password manager; the chart never creates or initialises anything.
  secretName: backup-restic

image:
  restic:
    repository: restic/restic
    tag: "0.19.1"
  python:
    repository: python
    tag: "3.12-alpine"

staging:
  # Holds the consistent SQLite copies while restic reads them. The largest single database
  # is autobrr's 1.4 GB.
  sizeLimit: 8Gi

# Read by the prune job, the verifier and the dashboard: this is the only place a repository
# is named. budgetGiB is the ceiling of the repository's raw data as `restic stats --mode
# raw-data` reports it: the stream's measured size, plus the churn its retention keeps, plus
# headroom. Passing it fails the stream, so it is a canary for an accidental media
# directory appearing in a row as much as for real growth. The control-plane budgets still
# carry the etcd copies the interim bridge took until 2026-11-25: the 7/4/12 tail keeps one
# per retained snapshot, and the monthly part of it holds a copy for a year, so the ceilings
# stay where they were measured rather than dropping to the claims alone.
streams:
  - name: nodes-nas
    budgetGiB: 2
  - name: nodes-nuc0
    budgetGiB: 4
  # 10.04 GB in the nightly snapshot of 2026-11-22 05:30 (7ac41aa9), 6.73 GiB of it Plex's claim,
  # whose excludes had been matching nothing. With the row fixed a snapshot reads 2.56 GiB: 2.05
  # GiB of staged databases, 0.51 GiB of etcd copies, configuration, and 785 files instead of
  # 46 500. The repository — what this budget bounds — read 6.97 GiB that evening because the
  # three nightlies taken before the fix still held the art; they were forgotten by hand the same
  # night (task #449) and `restic stats --mode raw-data` then read 650.8 MiB over four snapshots,
  # compressed 4.35x. Two of those four were the mislabelled etcd copies; forgotten by hand on
  # 2026-11-22 they leave 650.8 MiB over two, compressed 4.36x. A night adds about 0.22 GiB of
  # new data, so with the ~23 snapshots the 7/4/12 tail can retain the plateau is near 6 GiB:
  # 0.65 + 23 × 0.22. The one `etcd-pre131-streaming` copy left from the 1.31 move is extra and
  # permanent — its host is its own, so `forget` sees a group of one and no keep-* rule can ever
  # drop it — at no real size, since it holds the same streaming snapshot directory the nightly
  # already carries. 9 leaves ~3 GiB of headroom, still a canary for a row that picks up a
  # directory it should not: a media directory is hundreds of GiB. The 7 GiB this carried until
  # 2026-11-22 was the design's 3.7 GB of claim data plus one etcd copy, and the stream passed it
  # on the fifth night.
  - name: nodes-streaming
    budgetGiB: 9
  # The only stream whose contents no source can re-supply: the Syncthing photos and
  # documents and koillection's uploads. Overflowing this ceiling means a decade of history
  # is genuinely larger than expected, or a directory that should not be here arrived; both
  # are worth a red job rather than a quietly growing bill.
  - name: nfs
    budgetGiB: 40
    # The operator's decision on 2026-11-22 (task #541): a mistaken deletion stays recoverable
    # for ten years, not one. A yearly snapshot is the newest snapshot of each year, so the
    # tail is one year at weekly granularity, two years at monthly, ten at yearly. The four
    # streams share the daily and weekly tail below; only this one reaches further back.
    retention:
      keepMonthly: 24
      keepYearly: 10

# The one place the retention policy is written. The prune job renders its flags from these
# numbers, so the schedule and the flags cannot disagree. A stream may override any key under
# its own `retention:`; what it does not override is inherited from here.
retention:
  keepDaily: 7
  keepWeekly: 4
  keepMonthly: 12
  # No yearly snapshot by default: the rebuildable streams are served by the monthly tail.
  keepYearly: 0

# Host configuration no backup held before. Mounted as one directory rather than four paths:
# /etc/netplan does not exist on every node, and a missing hostPath fails the pod.
hostPaths:
  - /host/etc/rancher/k3s
  - /host/etc/exports
  - /host/etc/netplan
  - /host/etc/systemd/system

# The NFS stream: the exports on `nas` that hold data no rebuild can recreate. The exports the
# operator excluded (music, media, stash's library, downloads, and since 2026-11-20 the books
# library) are not listed at all, so a job can never reach them by accident. `exclude` entries are
# restic basename patterns; a whole export that is out of scope is an absent row, not an `exclude`.
# An entry that matches nothing in its export is printed as `exclude-unused path=<tag>
# pattern=<entry>` before that export's restic call, and the night carries on: it is the same
# warning the node rows get, and the chart README says where the morning check reads it.
nfs:
  schedule: "0 6 * * *"
  server: 192.168.1.41
  paths:
    # 6 773.3 MB. The operator's own critical data. File versioning is off today; the exclude
    # is here so that turning it on cannot silently double the stream.
    - tag: syncthing
      path: /mnt/storage/nfs/syncthing
      exclude: [".stversions"]
    # 8 KB, currently one empty subdirectory. The name carries the claim's PV id, because the
    # stash-nfs class mounts a static subdirectory: recreated claim, changed row, loud failure.
    - tag: koillection
      path: /mnt/storage/nfs/stash/koillection-koillection-uploads-pvc-9c9ffcb6-90e9-4d6a-94b3-d6b2f6c04d15
    # 0.9 MB. The ACME certificate store; losing it means re-issuing and risking Let's Encrypt's
    # weekly duplicate limit.
    - tag: traefik
      path: /mnt/storage/traefik
# qBittorrent's config left this stream on 2026-11-25, when the claim moved from the
# `nfs-qbittorrent-config` export to `local-path` (board card 758). Its row is under `nodes`,
# `nas`, where the pod runs since 2026-11-25; the export itself was retired with its release
# (card 769) and is backed up by nothing.

nodes:
  nas:
    schedule: "30 4 * * *"
    roots:
      - /mnt/ssd0
    claims:
      # The PostgreSQL backup, deduped. A dump still being written is not a dump, so the
      # partial files are skipped. `mustMatch` is what catches the dump CronJob stopping: the
      # claim directory stays, the stream keeps succeeding on it, and the verifier is the only
      # thing that would notice it holds no dump.
      - {claim: postgres-dumps, namespace: databases, kind: files, exclude: ["*.partial"], mustMatch: ["*.dump"]}
      # 58.4 MB, every dashboard and alert rule in the cluster.
      - {claim: grafana, namespace: monitoring, kind: sqlite}
      # CrowdSec's LAPI state: the decisions and the registered bouncer keys. No size yet, because
      # the application has not synced — the first night's snapshot supplies the measurement. The
      # chart mounts this claim under subPath `crowdsec`, so the database is `crowdsec/crowdsec.db`,
      # and the default `*.db` glob reads the claim root only and would stage nothing (the verifier
      # fails a `sqlite` row that stages nothing).
      - {claim: crowdsec-db-pvc, namespace: security, kind: sqlite, db: ["crowdsec/*.db"]}
      # The LAPI's copy of `/etc/crowdsec`: the parsers and scenarios its hub update installed, plus
      # the local configuration. Size follows the row above.
      - {claim: crowdsec-config-pvc, namespace: security, kind: files}
      # 1.1 KB. The VPN client's keys and config.
      - {claim: qbittorrent-vpn-config, namespace: media-stack, kind: files}
      # 302.7 MB on the claim, 47.8 of it worth keeping, measured on 2026-11-26. The claim has
      # moved twice: to this node's `local-path` on 2026-11-25 (card 758), and it follows the
      # qBittorrent pod from `streaming` to `nas` on 2026-11-25, because a claim is bound to the
      # node that first mounts it. `BT_backup/` also held a 129.8 MB copy of `/config` dated
      # 2022, whose 44 `.torrent` files matched no torrent in the client; it was deleted on
      # 2026-11-26 (card 778), which is where the 435.0 MB this row used to report went.
      # `qBittorrent/BT_backup/` is one `.torrent` and one `.fastresume` per torrent: the seed
      # list and the resume data, which no rebuild can recreate. Logs, the GeoIP database, the
      # VueTorrent archive and the old web UI copy are rebuilt from the image or the internet.
      - {claim: qbittorrent-config, namespace: media-stack, kind: files, exclude: ["logs", "log", "geoip", "ui.prev", ".cache", ".npm", "vuetorrent-*.zip"]}

  nuc0:
    schedule: "0 5 * * *"
    roots:
      - /mnt/ssd0
      - /opt/local-path-provisioner
    claims:
      # Pinned to its PV: a released claim with the same name left a second directory on the
      # disk, and the row must not guess between them.
      - {claim: pgadmin-config, namespace: databases, kind: sqlite, pv: pvc-80b62a0a-954e-4d9f-ad56-e10de4351e38}
      - {claim: n8n-config, namespace: n8n, kind: sqlite}
      # 442.3 MB → 222.0: www/ is the application unpacked from the image and data.fresh-* is
      # an upgrade's copy. The database is per user, under data/users/<user>/.
      - {claim: news-freshrss-config, namespace: news, kind: sqlite, db: ["data/users/*/db.sqlite"], exclude: ["www/", "log/", "data.fresh-*"]}
      # Both databases are staged: FileBrowser Quantum migrates db-v2.db from database.sqlite
      # and the old copy stays behind. On 2026-11-20 db-v2.db existed and could not be read,
      # which failed this job on purpose — a database that is there is not optional.
      - {claim: filebrowser-filebrowser-quantum-config, namespace: filebrowser, kind: sqlite}
      # 20.8 MB when measured on 2026-11-20; the snapshot of 2026-11-22 holds no file from this
      # claim at all, so whatever the application keeps in it is already excluded or gone.
      - {claim: filebrowser-filebrowser-quantum-data, namespace: filebrowser, kind: files, exclude: ["cache/"]}
      # CrowdSec's web UI: users, settings and a 168h mirror of the LAPI's alerts, so not
      # just configuration. `cache.db` refills from the LAPI and is left out; `state.db`
      # and `statistics.db` are the row. Size measured after the first night.
      - {claim: crowdsec-web-ui-config, namespace: security, kind: sqlite, exclude: ["cache.db*"]}
      - {claim: koillection-conf, namespace: koillection, kind: files}
      # 100 KB. index-v* rebuilds itself by rescan.
      - {claim: syncthing-config, namespace: syncthing, kind: files, exclude: ["index-v*"]}
      # 90 KB, accounts and settings; its only database is the message log, which is skipped.
      - {claim: thelounge-config, namespace: thelounge, kind: files, exclude: ["logs/"]}
      # 120 KB, attachments. The board's cards are in PostgreSQL.
      - {claim: vikunja-data, namespace: vikunja, kind: files}
      # 157.7 MB → 0.07: resources/ is the Trash Guides cache the app re-downloads.
      - {claim: recyclarr-config, namespace: media-stack, kind: files, exclude: ["resources/", "logs/"]}

  streaming:
    schedule: "30 5 * * *"
    roots:
      - /mnt/ssd0
    claims:
      # Every `→` figure below is the same measurement: snapshot 7ac41aa9 of 2026-11-22, read
      # from the bucket, in MB of 10^6 bytes. It is what the row holds there — the claim with its
      # exclusions applied, plus the staged database a `sqlite` row copies. The number on the
      # left of an arrow is the 2026-11-20 `du -sb` on the node, which is what an exclusion is
      # weighed against.
      # 2 310.9 MB → 433.7 together. MediaCover is poster art, logs and logs.db the rolling
      # logs, Backups the app's own rotating db copies: all rebuilt from the metadata providers.
      - {claim: sonarr-config, namespace: media-stack, kind: sqlite, exclude: ["MediaCover/", "logs/", "logs.db*", "Backups/"]}
      - {claim: sonarr-anime-config, namespace: media-stack, kind: sqlite, exclude: ["MediaCover/", "logs/", "logs.db*", "Backups/"]}
      - {claim: radarr-config, namespace: media-stack, kind: sqlite, exclude: ["MediaCover/", "logs/", "logs.db*", "Backups/"]}
      - {claim: radarr-anime-config, namespace: media-stack, kind: sqlite, exclude: ["MediaCover/", "logs/", "logs.db*", "Backups/"]}
      - {claim: lidarr-config, namespace: media-stack, kind: sqlite, exclude: ["MediaCover/", "logs/", "logs.db*", "Backups/"]}
      - {claim: prowlarr-config, namespace: media-stack, kind: sqlite, exclude: ["MediaCover/", "logs/", "logs.db*", "Backups/"]}
      # 16.4 + 27.2 MB → 7.8 + 6.5. The database is at db/bazarr.db, the rest is cache.
      - {claim: bazarr-config, namespace: media-stack, kind: sqlite, db: ["db/*.db"], exclude: ["cache/", "backup/", "log/"]}
      - {claim: bazarr-anime-config, namespace: media-stack, kind: sqlite, db: ["db/*.db"], exclude: ["cache/", "backup/", "log/"]}
      # 2 544.4 MB → 1 392.1: the 1.17 GB *_sv0_*.backup is autobrr's own copy of its db.
      - {claim: autobrr-config, namespace: media-stack, kind: sqlite, exclude: ["*_sv*_*.backup"]}
      # 135.2 MB → 6.4: torrent_cache/ refills from the indexers.
      - {claim: cross-seed-config, namespace: media-stack, kind: sqlite, exclude: ["torrent_cache/", "logs/"]}
      # 4.7 MB → 0.5: requests dedupe into a database this small.
      - {claim: seerr-config, namespace: media-stack, kind: sqlite, db: ["db/*.sqlite*"]}
      # 14.0 MB → 1.6, watch history is the only copy.
      - {claim: tautulli-config, namespace: media-stack, kind: sqlite, exclude: ["cache/", "logs/", "backups/"]}
      # 25.7 MB → 0.9: the interface bundle is rebuilt from the image.
      - {claim: maintainerr-config, namespace: media-stack, kind: sqlite, exclude: ["ui/", "logs/"]}
      # 7 663.7 MB on disk → 350.7 MB in the snapshot, 350.6 of it the staged databases: the
      # claim itself keeps 26 KB of configuration. What is worth restoring is the library
      # database (collections, playlists, watch state, manual matches) and those files;
      # everything else is regenerated or rotated, and each entry below says which. `Metadata/`
      # is poster art and the per-item XML, 3.0 GiB; `Cache/` is the transcode and PhotoTranscoder
      # cache, 2.1 GiB; `Media/` the local thumbnails, 254 MiB; `Scanners/` and `Codecs/` the
      # binaries Plex downloads or ships; `Logs/`, `Crash Reports/`, `Updates/` and
      # `Diagnostics/` its rolling output. `*.db-*` is Plex's own eight dated copies of the two
      # databases, 1.4 GiB: the staged copy is the consistent one and the dates are what a
      # restore must never prefer.
      #
      # Measured 2026-11-22 from the bucket (snapshot 7ac41aa9): the claim held 6.73 GiB and none
      # of these entries had ever matched, because all of it sits three levels down under
      # `Library/Application Support/Plex Media Server/` and prepare.py anchored each entry at the
      # claim root. The rule is now at the top of this file; the same reason is why the `db`
      # pattern carries the whole relative path.
      #
      # A Plex that has never started has written no database yet: the row then prints
      # `row-warning` and the job carries on, because the claim is still backed up whole. This
      # is the case the 2026-11-20 job failed on; the three rules are at the top of this file.
      - claim: plex-config
        namespace: media-stack
        kind: sqlite
        db: ["Library/Application Support/Plex Media Server/Plug-in Support/Databases/*.db"]
        exclude:
          - Cache/
          - Metadata/
          - Media/
          - Scanners/
          - Codecs/
          - Logs/
          - Crash Reports/
          - Updates/
          - Diagnostics/
          - "*.db-*"
      # 67.3 MB → 2.6: covers are rebuilt from the files, cache* and backups/ are copies.
      # `kavita.db` that is present and cannot be staged fails this job — measured on 2026-11-20,
      # while Kavita was writing its first database. It is data the backup could not read, so it
      # stays a failure; a row with no database file at all is the tolerated case in Plex's row
      # above.
      - {claim: kavita-config, namespace: media-stack, kind: sqlite, exclude: ["covers/", "logs/", "cache*", "backups/"]}
      # Pinned for the same reason as pgAdmin: a released claim of this name left a directory.
      # 152.1 MB → 1.0: `app.db`, its settings and the library's own metadata; the 151 MB of
      # thumbnails is what the exclusion removes.
      - {claim: calibre-web-automated-config, namespace: media-stack, kind: sqlite, pv: pvc-44eefd64-dcd4-4161-ab69-6e36151e7213, exclude: ["log/", "log_archive/", "thumbnails/"]}
      # No file in the 2026-11-22 snapshot: nothing was waiting to be filed. The thumbnails live
      # in the config claim above, where they are excluded, not here.
      - {claim: calibre-web-automated-ingest, namespace: media-stack, kind: files, exclude: ["thumbnails/"]}
