# The backup chart: one OVH bucket, one restic repository per stream, one job per node.
#
# This file is the coverage matrix in code. A claim is backed up only because a row names
# it, and a row that matches nothing on its node fails that node's job on purpose. Adding a
# claim to an application's chart means adding a row here in the same change; the sizes in
# the comments are the measurements taken on 2026-11-20, and `kind` decides whether the
# databases in the row are copied through SQLite's backup API (`sqlite`) or the directory is
# handed over as it is (`files`). Only the files a row's `db` patterns match are copied through
# SQLite; everything else in a `sqlite` claim is byte-copied as part of the directory, which is
# consistent because the app is not writing it between dumps.

repository:
  bucket: ashudev-homelab-backup
  endpoint: s3.gra.io.cloud.ovh.net
  region: gra
  # RESTIC_PASSWORD, AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. The last two are restic's
  # names for any S3 store's pair: the values are the OVH user declared in
  # infra-main/ovh/backup.tf, scoped to this bucket alone. Nothing here reaches AWS. Created by hand from the
  # password manager; the chart never creates or initialises anything.
  secretName: backup-restic

image:
  restic:
    repository: restic/restic
    tag: "0.19.1"
  python:
    repository: python
    tag: "3.12-alpine"

staging:
  # Holds the consistent SQLite copies while restic reads them. The largest single database
  # is autobrr's 1.4 GB.
  sizeLimit: 8Gi

# Read by the prune job, the verifier and the dashboard: this is the only place a repository
# is named. budgetGiB is the ceiling of the repository's raw data as `restic stats --mode
# raw-data` reports it: the stream's measured size, plus the churn the 7/4/12 retention keeps,
# plus headroom. Passing it fails the stream, so it is a canary for an accidental media
# directory appearing in a row as much as for real growth. The control-plane budgets carry the
# etcd copies, which are the only data that adds a fresh gigabyte-class file every night.
streams:
  - name: nodes-nas
    budgetGiB: 2
  - name: nodes-nuc0
    budgetGiB: 4
    etcd: true
  - name: nodes-streaming
    budgetGiB: 7
    etcd: true
  - name: nfs
    budgetGiB: 12

# The one place the retention policy is written. The prune job renders its flags from these
# numbers, so the schedule and the flags cannot disagree.
retention:
  keepDaily: 7
  keepWeekly: 4
  keepMonthly: 12

# Host configuration no backup held before. Mounted as one directory rather than four paths:
# /etc/netplan does not exist on every node, and a missing hostPath fails the pod.
hostPaths:
  - /host/etc/rancher/k3s
  - /host/etc/exports
  - /host/etc/netplan
  - /host/etc/systemd/system

# Where the control-plane nodes' K3s snapshots are mounted, and handed to restic as a path.
# The interim bridge until the official S3 upload lands with the 1.31 upgrade.
etcdSnapshotsPath: /host/etcd-snapshots

# The NFS stream: the exports on `nas` that hold data no rebuild can recreate. The exports the
# operator excluded (music, media, stash's library, downloads, and since 2026-11-20 the books
# library) are not listed at all, so a job can never reach them by accident. `exclude` entries are
# restic basename patterns; a whole export that is out of scope is an absent row, not an `exclude`.
nfs:
  schedule: "0 6 * * *"
  server: 192.168.1.41
  paths:
    # 6 773.3 MB. The operator's own critical data. File versioning is off today; the exclude
    # is here so that turning it on cannot silently double the stream.
    - tag: syncthing
      path: /mnt/storage/nfs/syncthing
      exclude: [".stversions"]
    # 8 KB, currently one empty subdirectory. The name carries the claim's PV id, because the
    # stash-nfs class mounts a static subdirectory: recreated claim, changed row, loud failure.
    - tag: koillection
      path: /mnt/storage/nfs/stash/koillection-koillection-uploads-pvc-9c9ffcb6-90e9-4d6a-94b3-d6b2f6c04d15
    # 0.9 MB. The ACME certificate store; losing it means re-issuing and risking Let's Encrypt's
    # weekly duplicate limit.
    - tag: traefik
      path: /mnt/storage/traefik
    # 428.7 MB → 181.2. The live qBittorrent mounts this at /config and writes BT_backup here:
    # the seed list and resume data. Logs, GeoIP data and an old web UI copy are not data.
    - tag: qbittorrent-config
      path: /mnt/storage/nfs/qbittorrent-config
      exclude: ["logs", "log", "geoip", "ui.prev", ".cache", ".npm"]

nodes:
  nas:
    schedule: "30 4 * * *"
    roots:
      - /mnt/ssd0
    etcdSnapshots: false
    claims:
      # 38.7 MB. The PostgreSQL backup: seven days of dumps, deduped. A dump still being
      # written is not a dump, so the partial files are skipped.
      - {claim: postgres-dumps, namespace: databases, kind: files, exclude: ["*.partial"]}
      # 58.4 MB, every dashboard and alert rule in the cluster.
      - {claim: grafana, namespace: monitoring, kind: sqlite}

  nuc0:
    schedule: "0 5 * * *"
    roots:
      - /mnt/ssd0
      - /opt/local-path-provisioner
    etcdSnapshots: true
    claims:
      # Pinned to its PV: a released claim with the same name left a second directory on the
      # disk, and the row must not guess between them.
      - {claim: pgadmin-config, namespace: databases, kind: sqlite, pv: pvc-80b62a0a-954e-4d9f-ad56-e10de4351e38}
      - {claim: n8n-config, namespace: n8n, kind: sqlite}
      # 442.3 MB → 222.0: www/ is the application unpacked from the image and data.fresh-* is
      # an upgrade's copy. The database is per user, under data/users/<user>/.
      - {claim: news-freshrss-config, namespace: news, kind: sqlite, db: ["data/users/*/db.sqlite"], exclude: ["www/", "log/", "data.fresh-*"]}
      - {claim: filebrowser-filebrowser-quantum-config, namespace: filebrowser, kind: sqlite}
      # 20.8 MB. cache/ is a rebuildable search index.
      - {claim: filebrowser-filebrowser-quantum-data, namespace: filebrowser, kind: files, exclude: ["cache/"]}
      - {claim: koillection-conf, namespace: koillection, kind: files}
      # 100 KB. index-v* rebuilds itself by rescan.
      - {claim: syncthing-config, namespace: syncthing, kind: files, exclude: ["index-v*"]}
      # 90 KB, accounts and settings; its only database is the message log, which is skipped.
      - {claim: thelounge-config, namespace: thelounge, kind: files, exclude: ["logs/"]}
      # 120 KB, attachments. The board's cards are in PostgreSQL.
      - {claim: vikunja-data, namespace: vikunja, kind: files}
      # 157.7 MB → 0.07: resources/ is the Trash Guides cache the app re-downloads.
      - {claim: recyclarr-config, namespace: media-stack, kind: files, exclude: ["resources/", "logs/"]}

  streaming:
    schedule: "30 5 * * *"
    roots:
      - /mnt/ssd0
    etcdSnapshots: true
    claims:
      # 2 310.9 MB → 473.5 together. MediaCover is poster art, logs and logs.db the rolling
      # logs, Backups the app's own rotating db copies: all rebuilt from the metadata providers.
      - {claim: sonarr-config, namespace: media-stack, kind: sqlite, exclude: ["MediaCover/", "logs/", "logs.db*", "Backups/"]}
      - {claim: sonarr-anime-config, namespace: media-stack, kind: sqlite, exclude: ["MediaCover/", "logs/", "logs.db*", "Backups/"]}
      - {claim: radarr-config, namespace: media-stack, kind: sqlite, exclude: ["MediaCover/", "logs/", "logs.db*", "Backups/"]}
      - {claim: radarr-anime-config, namespace: media-stack, kind: sqlite, exclude: ["MediaCover/", "logs/", "logs.db*", "Backups/"]}
      - {claim: lidarr-config, namespace: media-stack, kind: sqlite, exclude: ["MediaCover/", "logs/", "logs.db*", "Backups/"]}
      - {claim: prowlarr-config, namespace: media-stack, kind: sqlite, exclude: ["MediaCover/", "logs/", "logs.db*", "Backups/"]}
      # 16.4 + 27.2 MB → 12.9 + 12.1. The database is at db/bazarr.db, the rest is cache.
      - {claim: bazarr-config, namespace: media-stack, kind: sqlite, db: ["db/*.db"], exclude: ["cache/", "backup/", "log/"]}
      - {claim: bazarr-anime-config, namespace: media-stack, kind: sqlite, db: ["db/*.db"], exclude: ["cache/", "backup/", "log/"]}
      # 2 544.4 MB → 1 373.0: the 1.17 GB *_sv0_*.backup is autobrr's own copy of its db.
      - {claim: autobrr-config, namespace: media-stack, kind: sqlite, exclude: ["*_sv*_*.backup"]}
      # 135.2 MB → 10.6: torrent_cache/ refills from the indexers.
      - {claim: cross-seed-config, namespace: media-stack, kind: sqlite, exclude: ["torrent_cache/", "logs/"]}
      - {claim: seerr-config, namespace: media-stack, kind: sqlite, db: ["db/*.sqlite*"]}
      # 14.0 MB → 1.8, watch history is the only copy.
      - {claim: tautulli-config, namespace: media-stack, kind: sqlite, exclude: ["cache/", "logs/", "backups/"]}
      - {claim: maintainerr-config, namespace: media-stack, kind: sqlite, exclude: ["ui/", "logs/"]}
      # 17 KB. The VPN client's keys and config; the seed state is on the NFS export below.
      - {claim: qbittorrent-vpn-config, namespace: media-stack, kind: files}
      # 7 663.7 MB → 1 851.5: the library databases hold collections, playlists, watch state and
      # manual matches. Cache, Metadata, Media, Scanners and Codecs are all regenerated.
      # Plex keeps its databases under Library/Application Support/Plex Media Server/, not at
      # the claim root, so the pattern carries the whole relative path.
      - {claim: plex-config, namespace: media-stack, kind: sqlite, db: ["Library/Application Support/Plex Media Server/Plug-in Support/Databases/*.db"], exclude: ["Cache/", "Metadata/", "Media/", "Scanners/", "Codecs/"]}
      # 67.3 MB → 5.4: covers are rebuilt from the files, cache* and backups/ are copies.
      - {claim: kavita-config, namespace: media-stack, kind: sqlite, exclude: ["covers/", "logs/", "cache*", "backups/"]}
      # Pinned for the same reason as pgAdmin: a released claim of this name left a directory.
      - {claim: calibre-web-automated-config, namespace: media-stack, kind: sqlite, pv: pvc-44eefd64-dcd4-4161-ab69-6e36151e7213, exclude: ["log/", "log_archive/", "thumbnails/"]}
      # 4 KB: books waiting to be filed are not on the share yet. The thumbnails live in the
      # config claim above, where they are excluded, not here.
      - {claim: calibre-web-automated-ingest, namespace: media-stack, kind: files, exclude: ["thumbnails/"]}
