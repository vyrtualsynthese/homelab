apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "app.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
          ports:
            - name: mc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # The game port is the only honest health signal: it opens when the world
          # is loaded, and it stays closed while the server is generating one. The
          # startup budget is ten minutes, which a first load of a pregenerated
          # world clears and a fresh world may not — watch the first start.
          startupProbe:
            tcpSocket:
              port: mc
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 10
          # Readiness is the same connect test, and deliberately so: a Minecraft
          # server has no separate dependency that can fail while the JVM stays up.
          # There is no second endpoint to ask, so sharing is the honest choice.
          readinessProbe:
            tcpSocket:
              port: mc
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: mc
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.storage.mountPath }}
        - name: {{ .Chart.Name }}-monitor
          securityContext:
            {{- toYaml .Values.monitor.securityContext | nindent 12 }}
          image: "{{ .Values.monitor.image.repository }}:{{ .Values.monitor.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.monitor.image.pullPolicy }}
          args:
            - export-for-prometheus
          env:
            - name: EXPORT_SERVERS
              # Same pod network namespace as the server.
              value: "127.0.0.1"
          ports:
            - name: monitor
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "app.dataClaimName" . }}
      # The server saves the world on SIGTERM; ten minutes is the budget the old
      # chart already gave it.
      terminationGracePeriodSeconds: 600
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
