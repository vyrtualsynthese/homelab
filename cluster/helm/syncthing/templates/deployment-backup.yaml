apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "backup.fullname" . }}-backup
  labels:
    {{- include "backup.labels" . | nindent 4 }}
spec:
  schedule: "0 5 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            {{- toYaml .Values.backup.podSecurityContext | nindent 12 }}
          volumes:
            - name: syncthing-data-volume
              persistentVolumeClaim:
                claimName: pvc-nfs-syncthing
            - name: script-cache-volume
              emptyDir: {}
            - name: syncthing-backup-configmap
              configMap:
                name: {{ include "backup.fullname" . }}-backup
          initContainers:
            - name: init-syncthing-config
              image: busybox:1.38
              command: [ 'sh', '-c', "cp /config/* /cache" ]
              resources:
                requests:
                  cpu: 1m
                  memory: 16Mi
                limits:
                  memory: 64Mi
              volumeMounts:
                - mountPath: /cache
                  name: script-cache-volume
                - mountPath: /config
                  name: syncthing-backup-configmap
          containers:
            - name: {{ .Chart.Name }}-backup
              command: [ "/bin/sh" ]
              args: [ "./config/backup.sh" ]
              #args: [ "-c", "sleep 60m" ]
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.backup.image.pullPolicy }}
              securityContext:
                {{- toYaml .Values.backup.securityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              envFrom:
                - secretRef:
                    name: syncthing-backup
              volumeMounts:
                - name: syncthing-data-volume
                  mountPath: /data
                - mountPath: /config
                  name: script-cache-volume
          restartPolicy: OnFailure
          {{- with .Values.backup.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backup.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backup.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
