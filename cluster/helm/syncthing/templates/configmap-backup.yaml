apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backup.fullname" . }}-backup
  labels:
    {{- include "backup.labels" . | nindent 4 }}
data:
  # One key, read from the file. The previous form dumped every file with
  # `.Files.AsConfig` and then added backup.sh again, so the rendered ConfigMap
  # carried the key twice and failed to parse.
  backup.sh: |-
{{ .Files.Get "backup.sh" | indent 4 }}
