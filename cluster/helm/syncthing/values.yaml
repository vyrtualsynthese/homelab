# Default values for home.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
app:
  image:
    repository: lscr.io/linuxserver/syncthing
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: v2.1.7-ls237

  imagePullSecrets: []
  nameOverride: "syncthing"
  fullnameOverride: "syncthing"

  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations: {}

  # The LinuxServer init writes /config as root, then hands it to PUID/PGID.
  # local-path does not apply fsGroup to a hostPath volume, so none is set and
  # no runAsUser either: both look right and do nothing.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  # The s6 init chowns /config (CHOWN) then drops to 1100 (SETUID/SETGID);
  # everything else stays dropped. `runAsNonRoot` is absent on purpose: the
  # image starts as root and would refuse to start with it set.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - CHOWN
        - SETUID
        - SETGID

  service:
    type: ClusterIP
    # The WebUI. The sync ports are in the Service template.
    port: 8384

  # The routes are values-driven only in the switch and the annotations: the
  # host and the TLS block are written in the four IngressRoute templates, the
  # same way the other Legacy Traefik charts do it. `enabled` turns all four off
  # at once.
  ingress:
    enabled: true
    className: ""
    annotations: {}
    # Middlewares for the TLS router, rendered as `<namespace>-<name>@kubernetescrd`
    # in this order.
    #
    # `lan-only` is the network floor every non-public route carries, and it runs
    # first: an outside request is refused before the forward-auth round trip.
    #
    # `authentik-forwardauth` is the gate. Its authentik side is
    # `cluster/helm/authentik/files/app-syncthing.yaml`: a `forward_single` proxy
    # provider for this host, bound to the `authentik Admins` group. The WebUI keeps
    # its own login as break-glass until the operator removes it in Settings → GUI
    # (and turns on Insecure Admin Access) once the gate is proven.
    #
    # The plain-HTTP router in `ingress-public-redirect.yaml` reads none of this: it
    # keeps `lan-only` and the redirect, so a plain-HTTP visit costs no round trip
    # before the 301.
    middlewares:
      - name: lan-only
        namespace: kube-system
      - name: authentik-forwardauth
        namespace: kube-system

  # Sized from Prometheus on 2026-11-13 over the 39h it holds: 60Mi average and
  # 110Mi peak. It had no request and no limit at all, so the scheduler
  # accounted for none of it.
  resources:
    requests:
      cpu: 1m
      memory: 128Mi
    limits:
      memory: 256Mi

  # Plain values, inline in the Deployment: changing one rolls the pod.
  # PUID/PGID 1100 is the stack convention, and a fresh claim on local-path is
  # created 0777 owned by 1100:1100, so the app owns its own config.
  env:
    PUID: "1100"
    PGID: "1100"
    TZ: Europe/Paris

  # The config claim: device identity, folder definitions, the ignore patterns
  # and Syncthing's index database. 1Gi rather than the contract's 128Mi because
  # the index database for the media tree does not fit in 128Mi; the previous
  # Longhorn claim was 1Gi for the same reason. The name is `<fullname>-config`
  # (syncthing-config), not syncthing-conf: that name was held by a Terminating
  # Longhorn claim when the rebuild created this one, and the config now lives
  # here. See docs/cleanup/longhorn-disposition.md.
  persistence:
    size: 1Gi
    storageClassName: local-path
    accessMode: ReadWriteOnce

  # `/rest/noauth/health` answers 200 with {"status":"OK"} and needs no API key.
  # Readiness shares it: Syncthing stays healthy while a folder is disconnected,
  # and that is a sync state, not a reason to stop routing to the WebUI.
  probes:
    startup:
      enabled: true
      path: /rest/noauth/health
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 30
    liveness:
      enabled: true
      path: /rest/noauth/health
      initialDelaySeconds: 20
      periodSeconds: 30
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      enabled: true
      path: /rest/noauth/health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

  # Pinned, not affinity: local-path is hostPath-backed, so the claim exists on
  # one node only and the pod cannot follow a reschedule. nuc0 is where the
  # application already ran and where AGENTS.md places the general catalogue.
  # The old `node-type: general` affinity is retired and matched no node, which
  # left the replacement pod Pending.
  nodeSelector:
    kubernetes.io/hostname: nuc0

  tolerations: []
