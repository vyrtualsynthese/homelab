apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Required: the configuration claim is ReadWriteOnce and cannot be attached to
  # an old and a new pod at the same time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.app.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      {{- with .Values.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.app.podSecurityContext | nindent 8 }}
      containers:
        - name: koillection
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.app.securityContext | nindent 12 }}
          # Plain values stay inline so a change rolls the Deployment by itself.
          # Credentials come from the `koillection` Secret through secretKeyRef.
          # The image writes all of these into /app/public/.env.local at start.
          env:
            - name: DB_DRIVER
              value: "pdo_pgsql"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: koillection
                  key: DB_NAME
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: koillection
                  key: DB_HOST
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: koillection
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: koillection
                  key: DB_PASSWORD
            # Doctrine's declared feature level, not the server's version. The
            # shared instance runs 18.7; declaring a lower level only narrows the
            # SQL Doctrine emits, while declaring one above the server can
            # produce statements the server rejects.
            - name: DB_VERSION
              value: "16.3.0"
            - name: PHP_TZ
              value: "Europe/Paris"
            # TLS ends at Traefik and the pod is reached over plain HTTP, so the
            # cookie is not marked secure. Unchanged from the previous chart.
            - name: HTTPS_ENABLED
              value: "0"
            - name: UPLOAD_MAX_FILESIZE
              value: "100M"
            # Per PHP process, so this is also the ceiling the container limit
            # below is built around. FrankenPHP runs one process for the app.
            - name: PHP_MEMORY_LIMIT
              value: "128M"
            # The entrypoint rewrites the image's user to these ids and chowns
            # /uploads to it, then drops to it.
            - name: PUID
              value: "1100"
            - name: PGID
              value: "1100"
          ports:
            - name: http
              containerPort: {{ .Values.app.service.port }}
              protocol: TCP
          {{- with .Values.app.probes }}
          {{- if .startup.enabled }}
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: {{ .startup.periodSeconds }}
            timeoutSeconds: {{ .startup.timeoutSeconds }}
            failureThreshold: {{ .startup.failureThreshold }}
          {{- end }}
          {{- if .liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: {{ .liveness.periodSeconds }}
            timeoutSeconds: {{ .liveness.timeoutSeconds }}
            failureThreshold: {{ .liveness.failureThreshold }}
          {{- end }}
          {{- if .readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.app.storage.conf.enabled }}
            - name: conf
              mountPath: {{ .Values.app.storage.conf.mountPath }}
            {{- end }}
            {{- if .Values.app.storage.uploads.enabled }}
            - name: uploads
              mountPath: {{ .Values.app.storage.uploads.mountPath }}
            {{- end }}
      volumes:
        {{- if .Values.app.storage.conf.enabled }}
        - name: conf
          persistentVolumeClaim:
            claimName: {{ .Values.app.storage.conf.claimName }}
        {{- end }}
        {{- if .Values.app.storage.uploads.enabled }}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ .Values.app.storage.uploads.claimName }}
        {{- end }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
