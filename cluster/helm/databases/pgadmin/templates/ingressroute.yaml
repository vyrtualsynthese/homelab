# Plain HTTP on the LAN only, no TLS and no public hostname: the allowlist is the
# access control, and the container port never leaves the cluster.
apiVersion: {{ .Values.traefik.apiVersion }}
kind: IngressRoute
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  entryPoints: [web]
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      middlewares:
        - name: {{ .Chart.Name }}-lan-only
      services:
        - name: {{ .Values.ingress.service }}
          port: {{ .Values.ingress.port }}
