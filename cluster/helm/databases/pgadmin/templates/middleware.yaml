apiVersion: {{ .Values.traefik.apiVersion }}
kind: Middleware
metadata:
  name: {{ .Chart.Name }}-lan-only
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ipAllowList:
    sourceRange:
      - {{ .Values.traefik.lanCidr }}
