# Explicit claim name on purpose. The chart default would be pgadmin-pgadmin4,
# the name the dead Longhorn claim held when this wrapper was written; the data
# has lived on this claim since.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgadmin-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.pgadmin.persistentVolume.storageClass }}
  resources:
    requests:
      storage: {{ .Values.pgadmin.persistentVolume.size }}
