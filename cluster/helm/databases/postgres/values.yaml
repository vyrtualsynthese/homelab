image:
  repository: postgres
  tag: "18.7"
  digest: "sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b"

nodeSelector:
  kubernetes.io/hostname: nas

data:
  size: 20Gi
  storageClassName: local-path

dumps:
  size: 20Gi
  storageClassName: local-path
  schedule: "30 3 * * *"
  retentionDays: 14

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

postgresql:
  shared_buffers: 256MB
  effective_cache_size: 768MB
  max_connections: 60
  work_mem: 8MB
  maintenance_work_mem: 64MB
  log_min_duration_statement: 1000

networkPolicy:
  consumerNamespaces:
    - authentik
    - discourse
    - firefly
    - guacamole
    - koillection
    - wiki

exporter:
  repository: prometheuscommunity/postgres-exporter
  tag: "v0.17.1"
