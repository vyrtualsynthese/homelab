image:
  repository: postgres
  # A floating minor tag: Docker Hub republishes 18.7 with each 18.7.x patch. The
  # reference is the tag alone; digest pinning was decided against on 2026-11-19,
  # so a re-pushed 18.7 changes what runs without being detected here.
  tag: "18.7"

nodeSelector:
  kubernetes.io/hostname: nas

data:
  size: 20Gi
  # local-path is hostPath-backed: the pod's fsGroup: 999 (kept for consistency) does
  # not manage ownership here. Writability rests on the provisioner creating the
  # volume directory 0777 and on PGDATA being the nested "pgdata" subdirectory that
  # initdb owns at 0700; a tighter provisioner mode would break initdb.
  storageClassName: local-path

dumps:
  size: 20Gi
  storageClassName: local-path
  # Read as Europe/Paris, which the CronJob template pins: 03:30 there is 02:30Z in
  # winter and 01:30Z in summer. The wall clock stays put across the two clocks.
  schedule: "30 3 * * *"
  retentionDays: 14

resources:
  # No CPU limit, per the house rule. The 1-core limit throttled 51% of CFS
  # periods over the 7 days to 2026-11-22, 9,122 seconds in total.
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

postgresql:
  shared_buffers: 256MB
  effective_cache_size: 768MB
  max_connections: 60
  work_mem: 8MB
  maintenance_work_mem: 64MB
  log_min_duration_statement: 1000

# The NetworkPolicy is not here any more (card 829, 2026-11-26). The chart used
# to carry one, switched off, and a namespace floor cannot live in one
# application's chart anyway: it has to cover pgadmin too. The floor and every
# allow, this pod's included, are in
# `cluster/helm/platform/network-policy/values/databases.yaml`, applied by
# Application network-policy-databases.

exporter:
  repository: prometheuscommunity/postgres-exporter
  tag: "v0.17.1"
