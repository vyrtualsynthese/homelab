apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgres.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  # The pod is ready only when BOTH containers are: postgres and the exporter.
  # The exporter cannot authenticate until Job/postgres-bootstrap has created its
  # role, and the Job finds the server through this Service. Without this flag
  # the endpoint list stays empty, the Job cannot connect, and the first sync
  # deadlocks. Publishing not-ready addresses breaks that cycle; clients that
  # connect too early get a plain "connection refused", which the Job's wait loop
  # retries.
  publishNotReadyAddresses: true
  selector:
    app: {{ include "postgres.name" . }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgres.name" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  # Same reason as Service/postgres: a not-ready endpoint must still resolve, so
  # nothing that reaches the pod only through DNS can stall the first sync.
  publishNotReadyAddresses: true
  selector:
    app: {{ include "postgres.name" . }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
