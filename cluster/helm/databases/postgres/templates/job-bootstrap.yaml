apiVersion: batch/v1
kind: Job
metadata:
  # Content-addressed name: the SQL digest is part of the object's identity. A
  # Job's pod template is immutable, so a fixed name would turn every edit of
  # configmap-bootstrap.yaml into a rejected update ("field is immutable") and
  # the new SQL would never run. With the digest in the name, an edit creates a
  # new Job and leaves the old, completed one behind for ArgoCD to prune.
  #
  # Deliberately NOT a sync hook: a PostSync hook runs only once the synced
  # resources are healthy, and this pod is not healthy until the exporter sidecar
  # is up, which needs the role this Job creates. As a normal resource it runs on
  # every sync and the wait loop below covers the server still initialising.
  #
  # The chart has no "postgres.fullname": "postgres.name" is the release-stable
  # name of the instance, so the Job name stays postgres-bootstrap-<digest>.
  name: {{ include "postgres.name" . }}-bootstrap-{{ include (print $.Template.BasePath "/configmap-bootstrap.yaml") . | sha256sum | trunc 8 }}
  namespace: {{ .Release.Namespace }}
  # Not include "postgres.labels": it hardcodes app: postgres, which would clash
  # with the label this object is identified by, and duplicate keys resolve to
  # the last one written.
  labels:
    app: postgres-bootstrap
spec:
  # No ttlSecondsAfterFinished, on purpose: the name is content-addressed, so a
  # completed Job must stay in the cluster. ArgoCD then sees an existing, healthy
  # resource and leaves it alone; a Job that vanished after completion would be
  # recreated on every sync. Do not add a TTL here to "tidy up".
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: postgres-bootstrap
      annotations:
        checksum/bootstrap: {{ include (print $.Template.BasePath "/configmap-bootstrap.yaml") . | sha256sum }}
    spec:
      restartPolicy: Never
      # The bootstrap pod talks to PostgreSQL and reads two Secrets through its
      # environment; it never calls the Kubernetes API.
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              # On a first sync the Job races the StatefulSet: a psql that runs
              # before the server accepts connections just burns a backoff. The
              # wait is bounded so a database that never comes up fails the Job
              # instead of hanging it forever, which is what backoffLimit counts.
              timeout 300 bash -c 'until pg_isready -h postgres -U postgres; do sleep 3; done' \
                || { echo 'postgres did not accept connections within 300s' >&2; exit 1; }
              psql -h postgres -U postgres -d postgres \
                -v backup_password="$BACKUP_PASSWORD" \
                -v exporter_password="$EXPORTER_PASSWORD" \
                -f /sql/bootstrap.sql
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: postgres-password
            - name: BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-backup
                  key: backup-password
            - name: EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-exporter
                  key: exporter-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: bootstrap-sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: bootstrap-sql
          configMap:
            name: postgres-bootstrap
