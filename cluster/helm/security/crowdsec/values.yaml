# The upstream chart's values, all of them under the dependency's name.
#
# Two workloads and a separation that is not a preference: the **agent** must
# run on `streaming`, because the file it reads is a hostPath that only exists
# there; the **LAPI** lives on `nas` with the rest of the observability stack,
# because its SQLite is state (decisions and registered bouncer keys) and
# `nas` is where state is backed up.
crowdsec:
  image:
    repository: crowdsecurity/crowdsec
    tag: "v1.8.2"

  # Only the file source below is used. There is no pod-log acquisition, so this
  # key is inert; it is set to the runtime that writes the container logs anyway,
  # so a future acquisition does not silently claim the wrong parser.
  container_runtime: containerd

  config:
    # The agent's listener, and it is not optional: the chart's default
    # liveness, readiness and startup probes all GET `/metrics` on port 6060, so
    # an agent that does not listen there never becomes Ready and dies on the
    # startup probe. The chart ships no listener configuration of its own, only
    # the container port.
    agent_config.yaml.local: |
      prometheus:
        listen_addr: 0.0.0.0
        listen_port: 6060

    # A second copy of the LAN boundary, on purpose, in the one place where it is
    # a safety control rather than a routing decision.
    #
    # The image installs `crowdsecurity/whitelists`, whose ranges (127/8, 10/8,
    # 172.16/12, 192.168/16, ::1) already cover every address below. That copy is
    # not in this repository, it is not a reviewable diff, and a hub change is
    # not a change anyone here approves. This one is, and the test beside it
    # names the ranges.
    #
    # It is a **postoverflow**, so it runs before a decision exists: a
    # whitelisted address is never banned, as opposed to banned-then-excused.
    # The bouncer has no allow-list of its own — its configuration has no such
    # key — so this is the only enforcement point, which is why it is the one
    # thing here with a test that names addresses.
    postoverflows:
      s01-whitelist:
        whitelist-lan.yaml: |
          name: homelab/whitelist-lan
          description: "never create a decision for the LAN, the tunnel, the pods or a node"
          whitelist:
            reason: "the operator's own network"
            ip:
              - "192.168.1.41"
              - "192.168.1.27"
              - "192.168.1.46"
              - "192.168.1.48"
            cidr:
              - "192.168.1.0/24"
              - "10.8.0.0/24"
              - "10.42.0.0/16"
              - "10.43.0.0/16"

    # The blocklist's own LAN boundary, and it is a second file for a reason: a
    # decision that arrives from CAPI never passes through the postoverflow
    # above. That one runs before a decision is created from a local alert, and
    # CAPI inserts into the database directly, so a whitelist written as a
    # postoverflow would excuse nothing here. This file is read at pull time by
    # `api.server.capi_whitelists_path`, which the chart points at it, and an
    # address in it never enters the table at all.
    #
    # The ranges repeat `homelab/whitelist-lan` on purpose; a test fails when the
    # two disagree. Deprecated upstream in favour of the centralized allowlists,
    # which live in the LAPI database and are therefore state outside git — this
    # stays until that migration is a decision of its own.
    capi_whitelists.yaml: |
      ips:
        - "192.168.1.41"
        - "192.168.1.27"
        - "192.168.1.46"
        - "192.168.1.48"
      cidrs:
        - "192.168.1.0/24"
        - "10.8.0.0/24"
        - "10.42.0.0/16"
        - "10.43.0.0/16"

    # Signals from scenarios that are not the official, unmodified hub set count
    # for nothing upstream, so they are not sent. The official set still leaves;
    # that is the price of the list, and §4.3 of the design says so.
    #
    # `share_custom` and `share_tainted` are the two upstream defaults to `true`
    # and they are switched off here. `share_manual_decisions` and `share_context`
    # default to `false` upstream and are set explicitly anyway, so a later
    # upstream default cannot turn them on silently; when `console.yaml` exists
    # but a key is absent, CrowdSec applies its own default for that key.
    console.yaml: |
      share_custom: false
      share_tainted: false
      share_manual_decisions: false
      share_context: false

    # The chart's default value here holds the auto-registration block that lets
    # the agent register itself with the LAPI. Overriding this key replaces it,
    # so it is repeated here and the metrics listener is added beside it.
    #
    # `allowed_ranges` is the list of addresses that may register a machine, and
    # a registered machine can push alerts that become decisions — so it names
    # the agent and nothing else. One agent runs, as one Deployment pinned to
    # `streaming`, and its registration reaches the LAPI from its pod address
    # rather than from the node's: the LAPI's log shows `10.42.3.x` on the
    # `watchers` calls (read 2026-11-26). `10.42.3.0/24` is therefore all of it.
    #
    # The first version allowed `192.168.0.0/16` and `10.0.0.0/8` — the whole
    # LAN, the WireGuard tunnel inside it, and every pod and Service address.
    # That was the defect (card #570): the registration endpoint answered every
    # device in the house. Loopback went with them, because nothing registers
    # from it — the LAPI's own client logs in with the credential it already has.
    #
    # This is a snapshot of the node's pod CIDR
    # (`kubectl get node streaming -o jsonpath='{.spec.podCIDR}'`). It moves only
    # if the CNI renumbers the node, and that failure is loud rather than quiet:
    # the agent's `wait-for-lapi-and-register` init container crash-loops, the
    # pod never becomes Ready, and the security rules report the stack blind.
    config.yaml.local: |
      api:
        server:
          auto_registration:
            enabled: true
            token: "${REGISTRATION_TOKEN}"
            allowed_ranges:
              - "10.42.3.0/24"
      prometheus:
        # The default binds 127.0.0.1, which the kubelet's scrape cannot reach.
        # Prometheus here scrapes pods by annotation, so the listener has to be
        # on the pod address.
        listen_addr: 0.0.0.0
        listen_port: 6060

  # The two values the chart would otherwise mint — the LAPI's own secret
  # (`csLapiSecret`) and the registration token the agent registers with — come
  # from a Secret made by hand, `security/crowdsec-lapi-secrets`.
  #
  # Left to itself the chart generates both at render time (`randAscii 64`,
  # `randAlphaNum 48`) and keeps the live values through `lookup`, a Helm
  # function that asks the cluster for the object it may already have. ArgoCD
  # renders with no connection to the cluster, so `lookup` always answered
  # nothing: every refresh rendered new values, the Application never settled —
  # `OutOfSync` on the Secret and on the LAPI Deployment, whose
  # `checksum/lapi-secret` annotation followed it — and every sync rewrote both
  # secrets. The agent and the web UI then answered `401` until they signed in
  # again (card #875).
  #
  # With this set the chart renders no Secret of its own (it would only do so for
  # `lapi.extraSecrets`, which this chart does not set), so the keys in the
  # cluster are nobody's but the operator's. The two key names stay the chart's
  # defaults, `csLapiSecret` and `registrationToken`, which is why
  # `csLapiSecretKey` and `registrationTokenKey` are left unset. A rebuild
  # creates the Secret before the first sync: docs/secrets.md.
  secrets:
    externalSecret:
      name: crowdsec-lapi-secrets

  lapi:
    replicas: 1
    nodeSelector:
      kubernetes.io/hostname: nas
    strategy:
      type: Recreate
    # The image's entrypoint registers every `BOUNCER_KEY_<name>` env var at
    # start-up (`cscli bouncers add <name> -k <key>`), which is how the host
    # bouncer gets a key without anyone running `kubectl exec`. The value is a
    # Secret created by hand; nothing here holds it.
    # Helm replaces lists, so this looks like a clobber — but the chart renders its own env
    # first and appends this list, so `REGISTRATION_TOKEN` and `LOCAL_API_URL` survive it.
    env:
      - name: BOUNCER_KEY_firewall
        valueFrom:
          secretKeyRef:
            name: crowdsec-bouncer-key
            key: api-key
      # CAPI is on, and this comment is the record of what that means. The LAPI
      # registers itself on its next start and writes
      # `online_api_credentials.yaml` to the config claim below, which is a backup
      # row, so a rebuild keeps the identity instead of registering again. The
      # chart renders no registration Job when that claim is persistent; the
      # start script does it.
      #
      # What leaves, per alert: the scenario's name and hash, the timestamp, the
      # machine id, the offending address and its geolocation; at sign-in, the
      # list of scenarios this engine runs, and periodically the names and
      # versions of the bouncers and engines registered to the LAPI. Nothing
      # else — no URL, no header, no user name. The design states the trade in
      # §4.3.
    persistentVolume:
      data:
        enabled: true
        storageClassName: local-path
        size: 1Gi
      config:
        enabled: true
        storageClassName: local-path
        size: 100Mi
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "6060"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    metrics:
      enabled: true

  agent:
    # A DaemonSet would land on rbp2 (ARM64) and on `nas`, where the file does
    # not exist. One Deployment, one node, the one that owns the file.
    isDeployment: true
    replicas: 1
    nodeSelector:
      kubernetes.io/hostname: streaming
    # Helm replaces lists, so this looks like a clobber — but the chart renders its own env
    # first and appends this list, so `LOCAL_API_URL` and the registration token survive it.
    env:
      # `crowdsecurity/traefik` pulls `crowdsecurity/traefik-logs` and
      # `crowdsecurity/base-http-scenarios` (probing, crawl, bad user agent,
      # generic brute force, path traversal). The image itself only ships
      # `crowdsecurity/linux` and the whitelists.
      - name: COLLECTIONS
        value: crowdsecurity/traefik
    additionalAcquisition:
      - source: file
        filenames:
          - /var/log/traefik/access.log
        labels:
          # `program` is what `crowdsecurity/traefik-logs` filters on
          # (`evt.Parsed.program startsWith 'traefik'`); `type` names the source
          # for everything else it does.
          type: traefik
          program: traefik
    extraVolumes:
      - name: traefik-logs
        hostPath:
          path: /var/log/traefik
          type: Directory
    extraVolumeMounts:
      - name: traefik-logs
        mountPath: /var/log/traefik
        readOnly: true
    # No mount of the host's whole /var/log: this agent reads one file, and the
    # default `true` would hand it every log on the machine for nothing.
    hostVarLog: false
    # The image's entrypoint is not a non-root one: it rsyncs
    # /staging/etc/crowdsec into /etc/crowdsec, runs `cscli hub update` and
    # installs the collection there, then writes /var/lib/crowdsec. Forcing a
    # uid would produce a CrashLoop on the first sync. The trade is accepted and
    # narrow: root inside one pod, no host mount but the one file, read-only.
    # If a later image supports it, set podSecurityContext here and prove the
    # collection still installs.
    podSecurityContext: {}
    metrics:
      enabled: true
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "6060"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  # tls stays disabled: no cert-manager, no mutual TLS between two pods on the
  # same cluster, and a bouncer outside that would need it has a CA to install.
