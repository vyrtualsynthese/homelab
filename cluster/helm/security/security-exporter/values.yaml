# The numbers the posture families are compared against. They are claims about
# the cluster on a date, not a policy: a change here is a change to what the
# `SecurityExposureDrift` rule treats as normal, so it moves only with the route
# it describes, and `expectedNote` says when the live side was last read.
#
# Read on 2026-11-25 through the read-only MCP ServiceAccount: 73 IngressRoute
# objects live, 9 public hosts, and 9 privileged workloads. This pair reads 75
# because the change that adds them also adds `crowdsec-web-ui`, whose two routes
# are live from its first sync; the date stays the last live read, not the last
# claim. `ingressRoutes` is the
# object count, the unit `kubectl get ingressroute | wc -l` prints; the number the
# charts render is counted by hack/gen_docs.py, not typed in, and the one route
# that explains the gap is named in docs/reference/routes.md, which
# test_security_exporter.py ties to `LIVE_INGRESS_ROUTES`.
#
# `privilegedWorkloads` counts distinct controllers with at least one Running pod
# that declares a privileged container, in `containers` or `initContainers`. The
# controller is the pod's first owner, with a ReplicaSet's trailing pod-template
# hash dropped so a rollout does not move the number (qbittorrent-7c9bcbc9b7 is
# qbittorrent). Pods with no owner are not a workload this repository decides on
# (k3s's own jobs), and a pod whose phase is not Running is over, so completed
# and failed jobs never enter the count.
#
# That is nine today: the five gpu-operator DaemonSets (gpu-feature-discovery,
# nvidia-container-toolkit-daemonset, nvidia-dcgm-exporter,
# nvidia-device-plugin-daemonset, nvidia-operator-validator), qbittorrent, mktxp,
# pihole-exporter and prometheus-smartctl. The per-pod count is 21 and must not
# be used: prometheus-smartctl alone runs one pod per node, and the k3s job pods
# come and go. The GPU operator's pods are this repository's the moment their
# chart is in it; they enter the number by ownership and phase, not by being
# someone else's decision. A count of the charts in the repository (4) cannot be
# computed from what the exporter can see, which is pods.
securityExporter:
  expected:
    ingressRoutes: 75
    publicHosts: 9
    privilegedWorkloads: 9
  expectedNote: "73 read 2026-11-25; 75 with the two crowdsec-web-ui routes, live at its first sync; see docs/reference/routes.md"
  # The same list as `PUBLIC_HOSTS` in hack/check_exposure.py, which owns it.
  # test_security_exporter.py fails the moment the two differ, because a copy in
  # a chart is how a posture panel starts lying.
  publicHosts:
    - plex.kub.home.ashudev.com
    - seerr.kub.home.ashudev.com
    - ashuvidz.com
    - www.ashuvidz.com
    - ashudev.com
    - www.ashudev.com
    - dashy.ashudev.com
    - authentik.kub.home.ashudev.com
    - filebrowser.kub.home.ashudev.com

  # One small Python process on a stock image: the code ships in the chart's
  # ConfigMap, so there is no image to build and no registry to trust. The same
  # image as monitoring/alert-relay, because two Python sidecars in one repository
  # on different minors is drift for no reason.
  image:
    repository: python
    tag: "3.15.2-alpine"

  replicaCount: 1

  nodeSelector:
    kubernetes.io/hostname: nas

  service:
    port: 9105

  # The sign-in counts come from authentik's events API. The token is created by
  # hand in this Secret and is never in git:
  #
  #   kubectl -n security create secret generic security-exporter-authentik \
  #     --from-literal=token="$AUTHENTIK_TOKEN" \
  #     --from-literal=address-salt="$(openssl rand -hex 32)"
  #
  # No token is a healthy state, not an error: the Deployment marks the reference
  # `optional`, the exporter runs posture-only, and it publishes no sign-in family
  # at all rather than three zeros that would read as a quiet day. Counting starts
  # on the next pod start after the Secret exists.
  #
  # The salt is the second key of the same Secret, and it is what turns an address
  # into the `source` label of `homelab_authentik_signins_15m_by_source`. It is a
  # Secret because IPv4 has only four billion values: an unsalted hash is a
  # spreadsheet lookup, so a salt in git would be no salt. Without the key the
  # aggregate windows still publish and only the per-source family is absent, so
  # the burst rule has nothing to read until it exists — a missing Secret key is a
  # deploy step, and the exporter says so once at start-up.
  #
  # The freshness family covers every configured source: with a token, one poll
  # succeeds only when the cluster read *and* the authentik read succeed, so
  # `homelab_security_exporter_last_success_timestamp_seconds` stops during an
  # authentik outage instead of leaving stale sign-in counts looking live. That is
  # the timestamp SecurityStackBlind reads.
  authentik:
    url: https://authentik.kub.home.ashudev.com
    secretName: security-exporter-authentik
    secretKey: token
    saltKey: address-salt

  # 30 MiB was the design's estimate; the request is the relay's, and the limit
  # leaves room for one large route list.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

  # How often the cluster is re-read. Prometheus scrapes the last snapshot in
  # between, so this is the age of the numbers, not of the page.
  intervalSeconds: 60
