{{- /*
One NetworkPolicy per pod that accepts traffic, named allow-<name>. Every rule
is TCP, because every allow this chart declares is a web UI, an API or a
database port; a UDP need will name its protocol when one arrives.

A peer with `namespace` is a pod in another namespace, matched through
`kubernetes.io/metadata.name`, the label Kubernetes puts on every namespace, so
no other label is needed. A peer with `podSelector` and no `namespace` is a pod
in the namespace the Application targets. Both together narrow to one pod of
another namespace, which is what the infrastructure callers use.
*/}}
{{- range .Values.accept }}
{{- $entry := . }}
{{- range .from }}
{{- if and (not .namespace) (not .podSelector) }}
{{- fail (printf "accept.%s: a peer needs a namespace or a podSelector" $entry.name) }}
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .name }}
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .podSelector | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
  {{- range .from }}
    - from:
      {{- if .namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          {{- with .podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      {{- else }}
        - podSelector:
            matchLabels:
              {{- toYaml .podSelector | nindent 14 }}
      {{- end }}
      ports:
        {{- range .ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
  {{- end }}
{{- end }}
