# vikunja — the board. One pod, four callers.
#
# Measured 2026-11-26 against the live cluster: the pod carries
# app.kubernetes.io/name: vikunja, listens on 3456, and IngressRoute/vikunja
# sends vikunja.kub.local there. The same port carries the scrape the pod
# advertises through prometheus.io/port.
#
# The reverse direction is not policed here: the pod opens PostgreSQL in
# `databases` and the OIDC provider in `authentik` on its own, and an ingress
# floor does not touch it.
defaultDeny: true
accept:
  - name: vikunja
    podSelector:
      app.kubernetes.io/name: vikunja
    from:
      # Traefik is the only thing that serves this hostname, public or not.
      - namespace: kube-system
        podSelector:
          app.kubernetes.io/name: traefik
        ports: [3456]
      # The annotation-driven scrape. Prometheus is one pod; kube-system holds
      # more than Traefik, monitoring holds a whole stack, which is why the two
      # infrastructure callers name a pod and the application consumers below
      # name a namespace only.
      - namespace: monitoring
        podSelector:
          app.kubernetes.io/name: prometheus
          app.kubernetes.io/component: server
        ports: [3456]
      # The alert relay and its lifecycle job, which are the only callers that
      # reach the board on an event rather than on a request, and the only ones
      # that talk to the Service directly instead of through Traefik: a card is
      # opened from a Grafana alert, not from a browser. Both were cut off by the
      # floor for the seven minutes between the first sync and this line, and the
      # lifecycle job's error was `Connection refused` — which is what proved
      # the floor works at all. Two entries because the CronJob runs its own pod
      # per night with its own label; they are not the same pod as the relay.
      - namespace: monitoring
        podSelector:
          app.kubernetes.io/name: alert-relay
        ports: [3456]
      - namespace: monitoring
        podSelector:
          app.kubernetes.io/name: alert-relay-lifecycle
        ports: [3456]
