        ports: [8080]
      - podSelector:
          app.kubernetes.io/name: cross-seed
        ports: [8080]
      - podSelector:
          app.kubernetes.io/name: prowlarr
        ports: [8080]
      - podSelector:
          app.kubernetes.io/name: qbittorrent-exporter
        ports: [8080]
      - podSelector:
          app.kubernetes.io/name: radarr
        ports: [8080]
      - podSelector:
          app.kubernetes.io/name: radarr-anime
        ports: [8080]
      - podSelector:
          app.kubernetes.io/name: sonarr
        ports: [8080]
      - podSelector:
          app.kubernetes.io/name: sonarr-anime
        ports: [8080]
      - podSelector:
          app.kubernetes.io/name: lidarr
        ports: [8080]

  - name: qbittorrent-exporter
    podSelector:
      app.kubernetes.io/name: qbittorrent-exporter
    from:
      - namespace: monitoring
        podSelector:
          app.kubernetes.io/name: prometheus
