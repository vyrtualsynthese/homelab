{{- $wg := required "lanOnly.wireguardRange must be set from the wg-easy instance (design §8)" .Values.lanOnly.wireguardRange }}
{{- $pods := required "lanOnly.podRange must be the cluster pod network" .Values.lanOnly.podRange }}
apiVersion: {{ .Values.traefik.apiVersion }}
kind: Middleware
metadata:
  name: lan-only
  namespace: kube-system
  labels:
    app.kubernetes.io/name: traefik-gate
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # ipWhiteList, not ipAllowList: the installed CRD only declares the pre-2.5
  # name and prunes the v3 one, which leaves this object empty and allows
  # everyone. Rename both together with the CRDs in W5.
  ipWhiteList:
    sourceRange:
      - {{ .Values.lanOnly.lanRange }}
      - {{ $wg }}
      # Workloads in the cluster are not on the LAN, so a pod calling another
      # service through its public hostname was answered 403. That breaks every
      # native OIDC client: the server side fetches the discovery document and
      # exchanges the code at the provider's public URL, and it does so from the
      # pod network. This range adds no reachability the pods did not already
      # have through Service DNS; it only lets them use the front door.
      - {{ $pods }}
