# NVIDIA GPU Operator — the GPU stack.
#
# Wrapper around the upstream chart (pattern D): the chart version and every
# image below are pinned to what runs on `streaming`, and Renovate proposes the
# bumps from here on. The chart lives at cluster/helm/platform/gpu-operator and
# is deployed by the Application of the same name in projects/platform.
#
# What this chart does NOT own: the host driver. It is installed and upgraded by
# hand on `streaming` (580.178.04, CUDA 13.0 on 2026-11-20) and the operator is
# told to leave it alone. docs/runbooks/gpu-operator.md records the step.
#
# Resources below are sized from 7-day peaks in Prometheus on 2026-11-20:
# operator 89 MiB, dcgm-exporter 531 MiB, gpu-feature-discovery 76 MiB,
# container-toolkit 48 MiB, device-plugin 42 MiB, NFD worker 59 MiB, NFD master
# 86 MiB, NFD gc 18 MiB. Requests track the steady state so the scheduler
# reserves what the pods actually hold; limits leave room for a peak.

gpu-operator:
  # `driver.enabled: false` is the declaration that a rebuild is safe: with the
  # driver disabled the operator never builds one against the host kernel, so a
  # fresh cluster needs the driver installed first and nothing else. The
  # `nvidia.com/gpu.deploy.*` node labels are written by the operator from this
  # ClusterPolicy, so they follow the values rather than the hand install.
  driver:
    enabled: false

  operator:
    repository: nvcr.io/nvidia
    image: gpu-operator
    version: v26.7.3
    # The operator keeps its CRDs on uninstall. The cutover uninstalls the
    # hand-installed release before ArgoCD syncs this chart, and the existing
    # ClusterPolicy and operand objects have to survive that uninstall: with the
    # CRD deleted, Kubernetes would garbage-collect them.
    cleanupCRD: false
    # Pinned to where the controller already runs: it watches nodes, not pods, so
    # its placement only has to be predictable.
    nodeSelector:
      kubernetes.io/hostname: streaming
    # The operator reconciles its operands every 30 s and logs six info lines per
    # pass: 23,587 in the 24 h to 2026-11-22, all `controllers.Upgrade`. This key
    # is what the chart renders into `--zap-log-level`. The chart documents
    # debug/info/error; zap also accepts warn. Errors stay visible either way.
    logging:
      level: error
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        # The upstream chart defaults this to 500m. `null` deletes the inherited
        # key (a CPU limit only throttles, per the house rule) — but only because
        # the Application passes this file as a Helm override; a null in a chart's
        # own values.yaml is a default and would leave the 500m in place. See
        # `cluster/argocd/projects/platform/gpu-operator.yaml`.
        cpu: null
        memory: 192Mi

  validator:
    repository: nvcr.io/nvidia
    image: gpu-operator
    version: v26.7.3
    # The validator runs to completion per rollout; its memory is a transient.
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi

  toolkit:
    repository: nvcr.io/nvidia/k8s
    image: container-toolkit
    version: v1.19.0
    # K3s keeps containerd under /var/lib/rancher/k3s and listens on its own
    # socket. These four values are the whole reason this file exists: without
    # them the toolkit container rewrites /etc/containerd/config.toml, which K3s
    # does not read, and the `nvidia` runtime class is never registered.
    env:
      - name: CONTAINERD_CONFIG
        value: /var/lib/rancher/k3s/agent/etc/containerd/config.toml
      - name: CONTAINERD_SOCKET
        value: /run/k3s/containerd/containerd.sock
      - name: CONTAINERD_RUNTIME_CLASS
        value: nvidia
      - name: CONTAINERD_SET_AS_DEFAULT
        value: "true"
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi

  devicePlugin:
    repository: nvcr.io/nvidia
    image: k8s-device-plugin
    version: v0.19.0
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi

  gfd:
    repository: nvcr.io/nvidia
    image: k8s-device-plugin
    version: v0.19.0
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi

  dcgmExporter:
    repository: nvcr.io/nvidia/k8s
    image: dcgm-exporter
    version: 4.5.1-4.8.0-distroless
    # This container holds ~530 MiB for its whole life: it embeds nv-hostengine
    # rather than talking to a standalone DCGM, which is why the limits sit far
    # above what an exporter usually needs.
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi

  migManager:
    # The P400 is not MIG capable, so this DaemonSet stays at 0/0. The image and
    # the limits are declared anyway so the object is complete if the card is
    # ever replaced.
    repository: nvcr.io/nvidia/cloud-native
    image: k8s-mig-manager
    version: v0.14.0
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi

  node-feature-discovery:
    image:
      repository: registry.k8s.io/nfd/node-feature-discovery
      tag: v0.20.1
    # Only `streaming` has a GPU, and nothing in this repo reads NFD labels.
    # Four workers for one node was three pods of waste.
    worker:
      nodeSelector:
        kubernetes.io/hostname: streaming
    # The master and its garbage collector are cluster-scope controllers. They
    # run on nuc0, the node kept for the general catalogue.
    master:
      nodeSelector:
        kubernetes.io/hostname: nuc0
    gc:
      nodeSelector:
        kubernetes.io/hostname: nuc0

  # DCGM scraping needs nothing from this file. The operator creates the
  # exporter's Service itself and sets `prometheus.io/scrape: "true"` on it
  # (measured 2026-11-20: the Service it created after the cutover carries the
  # annotation with no value set here), and Prometheus's
  # `kubernetes-service-endpoints` job finds it by that annotation. A second
  # Service in this chart was tried first and scraped the same pod twice.
