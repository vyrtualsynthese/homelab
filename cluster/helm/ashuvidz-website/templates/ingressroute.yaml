{{- if .Values.ingressRoute.enabled }}
apiVersion: {{ .Values.ingressRoute.apiVersion }}
kind: IngressRoute
metadata:
  name: {{ default .Release.Name .Values.ingressRoute.name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    {{- with .Values.ingressRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ingressRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingressRoute.host }}`) && PathPrefix(`{{ .Values.ingressRoute.pathPrefix }}`)
      {{- with .Values.ingressRoute.middlewares }}
      middlewares:
        {{- range . }}
        - name: {{ .name }}
          namespace: {{ .namespace }}
        {{- end }}
      {{- end }}
      services:
        - name: {{ include "app.fullname" . }}
          port: {{ .Values.service.port }}
  {{- with .Values.ingressRoute.tls }}
  tls:
    {{- with .certResolver }}
    certResolver: {{ . }}
    {{- end }}
    {{- with .secretName }}
    secretName: {{ . }}
    {{- end }}
    {{- with .domains }}
    domains:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- if .Values.ingressRoute.redirectToHttps }}
---
{{- /* Plain-HTTP router, kept as the cluster already ran it: Traefik's no-op
service sends the answer back as a redirect from the `redirect-https`
middleware, so nothing is proxied and no backend has to be up. */}}
apiVersion: {{ .Values.ingressRoute.apiVersion }}
kind: IngressRoute
metadata:
  name: {{ default .Release.Name .Values.ingressRoute.name }}-redirect
  labels:
    {{- include "app.labels" . | nindent 4 }}
    {{- with .Values.ingressRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingressRoute.host }}`)
      middlewares:
        {{- range .Values.ingressRoute.redirect.middlewares }}
        - name: {{ .name }}
          namespace: {{ .namespace }}
        {{- end }}
      services:
        - kind: TraefikService
          name: noop@internal
{{- end }}
{{- if .Values.ingressRoute.www.enabled }}
---
{{- /* `www` exists as a router of its own for one reason: Traefik only asks the
resolver for a certificate for a name some router matches. The redirect is the
middleware; the `tls` block is what makes `https://www` work at all. */}}
apiVersion: {{ .Values.ingressRoute.apiVersion }}
kind: Middleware
metadata:
  name: {{ include "app.fullname" . }}-www
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  redirectRegex:
    regex: ^https?://{{ .Values.ingressRoute.www.host | replace "." "\\." }}/(.*)
    replacement: {{ .Values.ingressRoute.www.replacement }}
    permanent: {{ .Values.ingressRoute.www.permanent }}
---
apiVersion: {{ .Values.ingressRoute.apiVersion }}
kind: IngressRoute
metadata:
  name: {{ default .Release.Name .Values.ingressRoute.name }}-www
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingressRoute.www.host }}`)
      middlewares:
        - name: {{ include "app.fullname" . }}-www
          namespace: {{ .Release.Namespace }}
      services:
        - kind: TraefikService
          name: noop@internal
  # `www` is in the apex certificate's SAN list; asking again would order a
  # second certificate for one name.
  tls: {}
{{- end }}
{{- end }}
