# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/traefik.containo.us/ingressroute_v1alpha1.json
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: redirect-kub-to-discourse
  namespace: {{ .Release.Namespace | quote }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`discourse.kub.home.ashudev.com`)
      kind: Rule
      middlewares:
        - name: redirect-to-discourse
          namespace: {{ .Release.Namespace | quote }}
      services:
        - name: noop@internal
          kind: TraefikService
