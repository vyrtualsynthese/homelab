apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: discourse
  namespace: {{ .Release.Namespace | quote }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`forum.ashuvidz.com`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: security
          namespace: kube-system
      services:
        - name: discourse
          port: 80
  tls:
    certResolver: myresolver
