apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: ashuvidz-redirect
  namespace: {{ .Release.Namespace | quote }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`forum.ashuvidz.com`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: kube-system
      services:
        - kind: TraefikService
          name: noop@internal
