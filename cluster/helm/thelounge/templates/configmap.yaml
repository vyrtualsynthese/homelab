apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
data:
  # The app reads this file at startup. Mounted with `subPath`, so an edit only
  # reaches a running pod after a restart; the Deployment carries a checksum of
  # this object to make that restart happen.
  config.js: |-
{{ .Files.Get "config.js" | indent 4 }}
