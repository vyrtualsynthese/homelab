# Values for the upstream Renovate chart, pulled as a dependency by the chart
# one directory up (see Chart.yaml). Only what this cluster changes is here;
# every other key is the upstream default.

renovate:
  # -- The release is named for the Application; pinning the full name keeps the
  # ConfigMap `renovate-config` and the CronJob `renovate` stable if the
  # Application is ever renamed.
  fullnameOverride: renovate

  image:
    registry: ghcr.io
    repository: renovatebot/renovate
    # -- Pinned, and kept equal to `appVersion` in Chart.yaml. Renovate's own
    # docker manager updates this tag; bump `appVersion` with it so the two
    # numbers never disagree.
    tag: "44.251.0"
    # -- The tag is pinned, so pulling on every run buys nothing.
    pullPolicy: IfNotPresent

  # -- The GitHub token. The chart exports every key of this Secret as an
  # environment variable, so the key is `RENOVATE_TOKEN`. The Secret is listed
  # in docs/secrets.md; docs/runbooks/renovate.md covers the rotation.
  existingSecret: renovate

  # Schedule. The CronJob controller runs in UTC, and an unqualified schedule
  # silently changes its local meaning when the offset does, so the timezone is
  # explicit. 03:00 Paris is after the *arrs' midnight housekeeping and before
  # the 04:30 database dump; a run has taken 18 to 39 minutes.
  cronjob:
    schedule: "0 3 * * *"
    timeZone: Europe/Paris
    # -- One run at a time: a second start would race the first on the same
    # branches.
    concurrencyPolicy: Forbid
    # -- One retry, then fail. A GitHub outage must not become a retry loop.
    jobBackoffLimit: 1
    # -- Longer than the longest observed run (39 minutes).
    activeDeadlineSeconds: 5400
    # -- Completed Jobs are the record of a night. Three days covers a weekend,
    # then the TTL controller deletes the pods, so the failed ones do not pile up.
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 1
    ttlSecondsAfterFinished: 259200

  # -- The node the last pods ran on; the job keeps no state, so nothing ties it
  # to the node beyond staying off the control-plane Pis.
  nodeSelector:
    kubernetes.io/hostname: nas

  # Unmeasured: a run is shorter than Prometheus's scrape interval, so there is
  # no steady state to size from. The request is the image's own footprint and
  # the limit a protection ceiling, not a measured peak.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

  # Pod-level hardening. The image's own user is already non-root; naming it
  # makes that a precondition the kubelet enforces.
  securityContext:
    runAsNonRoot: true
    runAsUser: 12021
    seccompProfile:
      type: RuntimeDefault

  # The upstream chart keeps its own settings under a second `renovate:` key,
  # so this one nests inside the dependency's root.
  renovate:
    # -- Self-hosted configuration, deliberately empty: what gets updated is
    # decided by each repository's `.github/renovate.json`, and this repo's
    # copy is the authority on that. The upstream chart has no default and
    # refuses to render without one.
    config: |
      {}
    # -- Container-level hardening. The image runs as UID 12021 and needs no
    # Linux capability to clone repositories and open pull requests.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
