apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "docs-site.fullname" . }}-site
  labels:
    {{- include "docs-site.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
