apiVersion: v1
kind: Service
metadata:
  name: {{ include "docs-site.fullname" . }}
  labels:
    {{- include "docs-site.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "docs-site.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.traefik.port }}
      targetPort: http
