# Default values for home.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
n8n:
  image:
    repository: n8nio/n8n
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: 2.19.2

  imagePullSecrets: []
  nameOverride: "n8n"
  fullnameOverride: "n8n"

  # The claim is named n8n-config, not n8n-2, on purpose: the old Longhorn claim
  # n8n-2 is still Terminating in the namespace and its name cannot be reused
  # while the object exists. See docs/cleanup/longhorn-disposition.md.
  persistence:
    size: 1Gi
    storageClassName: local-path
    accessMode: ReadWriteOnce
    claimName: n8n-config

  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/scheme: "http"
    prometheus.io/port: "5678"

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  service:
    type: ClusterIP
    port: 5678

  ingress:
    enabled: true
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources:
    # Sized from Prometheus on 2026-11-13 over the 39h it holds: 420Mi average
    # and 420Mi peak. The 512Mi limit left 15% of headroom for a workflow run,
    # which is not enough for this app.
    limits:
      memory: 768Mi
    requests:
      cpu: 10m
      memory: 256Mi

    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # n8n answers /healthz once it is up and its database is loaded. The startup
  # probe holds the other two through a first start on an empty claim, when the
  # database is migrated from scratch.
  probes:
    startup:
      enabled: true
      path: /healthz
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 30
    liveness:
      enabled: true
      path: /healthz
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      enabled: true
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

  # Pinned, not affinity: local-path is hostPath-backed, so the claim exists on one
  # node only and the pod cannot follow a reschedule to another. nuc0 is where the
  # application already runs and where AGENTS.md places the general catalogue.
  nodeSelector:
    kubernetes.io/hostname: nuc0

  tolerations: []
