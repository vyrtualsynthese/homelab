apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "n8n.fullname" . }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "n8n.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.n8n.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "n8n.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.n8n.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "n8n.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.n8n.podSecurityContext | nindent 8 }}
      volumes:
        - name: n8n
          persistentVolumeClaim:
            claimName: {{ include "n8n.fullname" . }}-config
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.n8n.image.repository }}:{{ .Values.n8n.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.n8n.image.pullPolicy }}
          env:
            # n8n generates this key at first start and keeps it beside the data.
            # Setting it explicitly means a claim rebuilt from scratch comes back
            # with the same key, so credentials restored from a backup stay
            # readable. The value lives only in the cluster; see docs/secrets.md.
            - name: "N8N_ENCRYPTION_KEY"
              valueFrom:
                secretKeyRef:
                  name: n8n
                  key: encryption-key
            - name: "N8N_PORT"
              value: "5678"
            # Traefik is the only proxy in front of n8n. Without this, Express
            # ignores X-Forwarded-For and the rate limiter counts every client as
            # the Traefik pod: one busy caller throttles everyone.
            - name: "N8N_PROXY_HOPS"
              value: "1"
            - name: "N8N_METRICS"
              value: "true"
            - name: "N8N_METRICS_INCLUDE_DEFAULT_METRICS"
              value: "true"
            - name: "N8N_METRICS_INCLUDE_CACHE_METRICS"
              value: "true"
            - name: "N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS"
              value: "true"
            - name: "N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL"
              value: "true"
            - name: "N8N_METRICS_INCLUDE_NODE_TYPE_LABEL"
              value: "true"
            - name: "N8N_METRICS_INCLUDE_CREDENTIAL_TYPE_LABEL"
              value: "true"
            - name: "N8N_METRICS_INCLUDE_API_ENDPOINTS"
              value: "true"
            - name: "N8N_METRICS_INCLUDE_API_PATH_LABEL"
              value: "true"
            - name: "N8N_METRICS_INCLUDE_API_METHOD_LABEL"
              value: "true"
            - name: "N8N_METRICS_INCLUDE_API_STATUS_CODE_LABEL"
              value: "true"
            - name: "QUEUE_HEALTH_CHECK_ACTIVE"
              value: "true"
            - name: "WEBHOOK_URL"
              value: "https://n8n.kub.home.ashudev.com/"
          ports:
            - containerPort: 5678
              name: "n8n"
          {{- with .Values.n8n.probes.startup }}
          {{- if .enabled }}
          startupProbe:
            httpGet:
              path: {{ .path }}
              port: n8n
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.n8n.probes.liveness }}
          {{- if .enabled }}
          livenessProbe:
            httpGet:
              path: {{ .path }}
              port: n8n
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.n8n.probes.readiness }}
          {{- if .enabled }}
          readinessProbe:
            httpGet:
              path: {{ .path }}
              port: n8n
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          volumeMounts:
            - mountPath: "/home/node/.n8n"
              name: "n8n"
          resources:
            {{- toYaml .Values.n8n.resources | nindent 12 }}
      {{- with .Values.n8n.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.n8n.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.n8n.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
