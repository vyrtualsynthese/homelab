authentik:
  authentik:
    # This sends anonymous usage-data, stack traces on errors and
    # performance data to authentik.error-reporting.a7k.io, and is fully opt-in
    error_reporting:
      enabled: false
    postgresql:
      # The dedicated instance in the databases namespace, not the retired
      # Bitnami subchart.
      host: "postgres.databases.svc.cluster.local"
      name: "authentik"
      user: "authentik"
      port: 5432
    email:
      # SMTP Server emails are sent from, fully optional
      host: "smtp.gmail.com"
      port: 587
      username: "valentin.ronteix@ashudev.com"
      use_tls: true
      use_ssl: false
      timeout: 30
      from: "ashulab@ashudev.com"
  global:
    image:
      repository: ghcr.io/goauthentik/server
      # Pinned with the chart version: both are 2026.8.6.
      tag: "2026.8.6"
      pullPolicy: IfNotPresent
    envFrom:
      - secretRef:
          name: authentik-env
      - secretRef:
          name: authentik-sso
    env:
      # New in 2026.8 and required from 2026.11. Bootstrap only: copied into the
      # Base URL system setting on first start. Matches the issuer used by apps.
      - name: AUTHENTIK_WEB__BASE_URL
        value: "https://authentik.kub.home.ashudev.com"
      # The default level logs one line per request, health probes included. The
      # chart contract (docs/charts/README.md, Logs) asks for warnings and errors;
      # sign-ins and admin actions stay in authentik's own Events table, which is
      # the record the UI reads, so nothing an operator acts on is lost.
      # Measured 2026-11-22: server 28,386 lines / 16.3 MB and worker 23,508 /
      # 12.4 MB over 24 h, 17,267 of them the health checks — 24.6 % of every
      # byte Loki stored that day.
      #
      # The upstream chart also writes `AUTHENTIK_LOG_LEVEL: info` into the
      # generated env Secret (`authentik-env`). An explicit `env` entry takes
      # precedence over `envFrom`, so this value is the one the process reads,
      # for both the server and the worker, which share this block.
      - name: AUTHENTIK_LOG_LEVEL
        value: "warning"
    addPrometheusAnnotations: false
    nodeSelector:
      kubernetes.io/hostname: nuc0

  server:
    # Replaced by templates/ingressroute.yaml: the repo uses Traefik CRDs, not
    # networking.k8s.io Ingress.
    ingress:
      enabled: false
    resources:
      # Measured 2026-11-22 over 7 days: p95 653Mi, peak 653Mi. The request was
      # 512Mi, below the working set; the 1Gi limit is peak x 1.57.
      requests:
        cpu: 10m
        memory: 768Mi
      limits:
        memory: 1Gi

  worker:
    # One task at a time. Two threads is the upstream default, and two tasks
    # that reconcile the guardian permission tables at the same time deadlock
    # on guardian_roleobjectpermission / guardian_rolemodelpermission: each
    # one holds a row the other is deleting. The task then fails, retries,
    # collides again, and every other task queues behind it.
    # Evidence and the runbook: docs/authentik-worker-deadlocks.md.
    env:
      - name: AUTHENTIK_WORKER__THREADS
        value: "1"
    # Recreate, not RollingUpdate. A rollout otherwise keeps the old worker
    # next to the new one for a few minutes, which puts a second writer on
    # the same tables and brings the deadlocks back for the length of the
    # rollout. The worker serves no traffic, so the gap costs nothing.
    deploymentStrategy:
      type: Recreate
    resources:
      requests:
        cpu: 10m
        memory: 512Mi
      limits:
        memory: 1Gi

  blueprints:
    configMaps:
      - authentik-blueprints

  # No managed ("remote cluster") outposts: the embedded outpost is enough for
  # OIDC-only applications, and this subchart would add cluster-scoped RBAC.
  serviceAccount:
    create: false

  postgresql:
    enabled: false

# 2026.8 dropped Redis: the task broker runs on PostgreSQL and the chart no
# longer ships a Redis subchart.
