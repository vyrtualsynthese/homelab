authentik:
  authentik:
    # This sends anonymous usage-data, stack traces on errors and
    # performance data to authentik.error-reporting.a7k.io, and is fully opt-in
    error_reporting:
      enabled: false
    postgresql:
      # The dedicated instance in the databases namespace, not the retired
      # Bitnami subchart.
      host: "postgres.databases.svc.cluster.local"
      name: "authentik"
      user: "authentik"
      port: 5432
    email:
      # SMTP Server emails are sent from, fully optional
      host: "smtp.gmail.com"
      port: 587
      username: "valentin.ronteix@ashudev.com"
      use_tls: true
      use_ssl: false
      timeout: 30
      from: "ashulab@ashudev.com"
  global:
    image:
      repository: ghcr.io/goauthentik/server
      # Pinned with the chart version: both are 2026.8.5.
      tag: "2026.8.5"
      pullPolicy: IfNotPresent
    envFrom:
      - secretRef:
          name: authentik-env
    env:
      # New in 2026.8 and required from 2026.11. Bootstrap only: copied into the
      # Base URL system setting on first start. Matches the issuer used by apps.
      - name: AUTHENTIK_WEB__BASE_URL
        value: "https://authentik.kub.home.ashudev.com"
    addPrometheusAnnotations: false
    nodeSelector:
      kubernetes.io/hostname: nuc0

  server:
    # Replaced by templates/ingressroute.yaml: the repo uses Traefik CRDs, not
    # networking.k8s.io Ingress.
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 512Mi
      limits:
        memory: 1Gi

  worker:
    resources:
      requests:
        cpu: 10m
        memory: 512Mi
      limits:
        memory: 1Gi

  blueprints:
    configMaps:
      - authentik-blueprints

  # No managed ("remote cluster") outposts: the embedded outpost is enough for
  # OIDC-only applications, and this subchart would add cluster-scoped RBAC.
  serviceAccount:
    create: false

  postgresql:
    enabled: false

# 2026.8 dropped Redis: the task broker runs on PostgreSQL and the chart no
# longer ships a Redis subchart.
