version: 1
metadata:
  name: ashulab-app-crowdsec-web-ui
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-groups
      required: true

  # The CrowdSec web UI authenticates with OIDC itself, so this is an OAuth2
  # provider — not a proxy provider, and the route carries no authentik gate.
  # The callback is the app's own string, built from the request's Host and
  # X-Forwarded-* headers: it must match `crowdsec.kub.internal` exactly, and a
  # mismatch is a login loop with nothing in the app's log. The host is internal,
  # so the provider is never reachable from the internet by name.
  #
  # `groups` is part of the profile scope below; the chart maps it to a role
  # (`CONFIG_AUTH_OIDC_ADMIN_GROUPS_0`) and denies anyone else.
  - model: authentik_providers_oauth2.oauth2provider
    id: crowdsec-web-ui-provider
    identifiers:
      name: crowdsec-web-ui
    attrs:
      name: crowdsec-web-ui
      client_type: confidential
      # Blueprint-created providers start with no grant types, unlike the UI
      # wizard which preselects these two; without them the authorize endpoint
      # answers "Invalid grant_type for provider".
      grant_types:
        - authorization_code
        - refresh_token
      client_id: crowdsec-web-ui
      client_secret: !Env CROWDSEC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://crowdsec.kub.internal/api/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: crowdsec-web-ui-app
    identifiers:
      slug: crowdsec-web-ui
    attrs:
      name: CrowdSec
      slug: crowdsec-web-ui
      provider: !KeyOf crowdsec-web-ui-provider
      meta_launch_url: https://crowdsec.kub.internal/
      # Official logo, served from the dashboard-icons set. The browser loads it,
      # so the grid needs internet; swap to `fa://fa-shield` if it ever has to
      # work offline.
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/crowdsec.png
      policy_engine_mode: any

  # Administrator only: the operator is the one who undoes a false positive, and
  # the read-only view is there for a future group rather than for now.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf crowdsec-web-ui-app
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]
