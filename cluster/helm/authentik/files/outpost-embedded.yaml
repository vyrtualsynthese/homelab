version: 1
metadata:
  name: ashulab-outpost-embedded
entries:
  # Blueprint order is not guaranteed. FileBrowser's provider is already
  # attached by hand today, and this file takes over that assignment: setting
  # `providers` replaces the whole list, so every provider must be here or it is
  # detached.
  #
  # A name that no longer exists is worse than a missing one: `!Find` fails, the
  # whole file rolls back, and every provider it lists keeps the stale list. A
  # provider that is absent here answers 404 on its host — that is what
  # `docs.kub.local` did until `docs` was added on 2026-11-17. When a proxy
  # provider is retired (vikunja's went with the OIDC migration), delete its
  # line in the same commit that retires it.
  #
  # The first sync of a NEW app is the one case where this file rolls back on
  # its own: discovery creates that app's blueprint instance in the same pass
  # that applies this one, so the `!Find` below can run before the provider
  # exists. The outpost then keeps the previous list and the new host answers
  # 404 until this file is applied again — Apply on this instance in the
  # authentik UI, or any later change to this file, is enough. sonarr-anime hit
  # it on 2026-11-18, the first app added since the file was written.

  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-app-filebrowser
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-app-sonarr
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-app-sonarr-anime
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-app-autobrr
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-app-bazarr
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-app-bazarr-anime
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-app-lidarr
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-app-radarr
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-app-radarr-anime
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-app-qbittorrent
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-app-maintainerr
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-app-prowlarr
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-app-tautulli
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-app-docs
      required: true

  # The embedded outpost is a managed object. Its identifiers are `managed`, not
  # `name`: keying on the name creates a duplicate outpost and rolls back the
  # whole file. MANAGED_OUTPOST is `goauthentik.io/outposts/embedded`
  # (authentik/outposts/apps.py).
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, filebrowser]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, sonarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, sonarr-anime]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, bazarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, bazarr-anime]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, lidarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, radarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, radarr-anime]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, qbittorrent]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, maintainerr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, prowlarr]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, tautulli]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, docs]]
