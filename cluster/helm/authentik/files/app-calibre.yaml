version: 1
metadata:
  name: ashulab-app-calibre
entries:
  # Level groups come from ashulab-groups; blueprint order is not guaranteed,
  # so require that file first.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-groups
      required: true

  # Calibre-Web Automated speaks generic OIDC natively (cps/oauth_bb.py,
  # "generic OIDC providers like Authentik"), so this is a plain OAuth2
  # provider — not a proxy provider. Native OIDC is the supported path here:
  # the app holds its own session, its OPDS and Kobo endpoints keep their
  # basic auth, and no proxy sits in front of it to break them.
  #
  # Earlier notes said Calibre-Web had no OIDC and had to read an authentik
  # header from a forward-auth gate. That was wrong for the pinned v4.0.8,
  # which supports it; the design records the correction.
  - model: authentik_providers_oauth2.oauth2provider
    id: calibre-provider
    identifiers:
      name: calibre
    attrs:
      name: calibre
      client_type: confidential
      # Blueprint-created providers start with no grant types, unlike the UI
      # wizard which preselects these two; without them the authorize endpoint
      # answers "Invalid grant_type for provider".
      grant_types:
        - authorization_code
        - refresh_token
      client_id: calibre
      # Read from the authentik-sso Secret, which is exported into both the
      # server and the worker. Changing it needs a worker restart: !Env is
      # resolved when the blueprint is applied, not when the Secret changes.
      # The same value has to be pasted into Calibre-Web's own OAuth settings,
      # because Secrets do not cross namespaces.
      client_secret: !Env CALIBRE_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          # The flow Flask-Dance builds for its `generic` blueprint, under the
          # host Calibre-Web is told to use for redirects ("OAuth Redirect
          # Host" in its admin settings). It must say `https://`: with its login
          # type on OAuth, Calibre-Web forces a `Secure` session cookie, which a
          # browser drops on a plain-HTTP host, and the callback then arrives
          # without the state it started with. The chart serves this route on
          # `websecure` for the same reason.
          url: https://calibre.kub.local/login/generic/authorized
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        # `profile` carries `preferred_username` (the field Calibre-Web reads as
        # the username) and `groups`, which Calibre-Web's "OAuth group for
        # Admin" setting matches to decide who becomes an administrator.
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: calibre-app
    identifiers:
      slug: calibre
    attrs:
      name: Calibre-Web
      slug: calibre
      provider: !KeyOf calibre-provider
      meta_launch_url: https://calibre.kub.local/
      # Official logo, served from the dashboard-icons set. The browser
      # loads it, so the grid needs internet; swap to `fa://fa-<name>`
      # if it ever has to work offline.
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/calibre-web.png
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf calibre-app
      order: 0
    attrs:
      # Administrator only: the operator is the sole user of the library.
      group: !Find [authentik_core.group, [name, authentik Admins]]
