version: 1
metadata:
  name: ashulab-app-radarr
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-groups
      required: true

  # Forward auth: no internal host and no client secret. The outpost checks the
  # request and answers Traefik, which does pass the X-authentik-* headers on,
  # since its middleware lists them in `authResponseHeaders`. There is no
  # strip-authentik-header step because it would buy nothing: Radarr does not
  # trust those headers. It keeps its own login until that is switched off, and
  # from then on trusts nothing arriving from the network.
  - model: authentik_providers_proxy.proxyprovider
    id: radarr-provider
    identifiers:
      name: radarr
    attrs:
      name: radarr
      mode: forward_single
      # Scheme must match the browser: these hosts are served on `web`, plain
      # HTTP. The outpost takes the session cookie's Secure flag from this
      # scheme, so `https` here would break the cookie on an http host.
      external_host: http://radarr.kub.local
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: radarr-app
    identifiers:
      slug: radarr
    attrs:
      name: Radarr
      slug: radarr
      provider: !KeyOf radarr-provider
      meta_launch_url: http://radarr.kub.local/
      # Icon drawn from the Font Awesome set bundled with authentik, so no
      # external URL has to resolve for the application grid.
      meta_icon: fa://fa-film
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf radarr-app
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]
