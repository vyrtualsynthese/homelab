version: 1
metadata:
  name: ashulab-app-freshrss
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-groups
      required: true

  # FreshRSS authenticates with OIDC itself through mod_auth_openidc, so this is
  # a plain OAuth2 provider — not a proxy provider. The route carries no
  # authentik middleware; the app prompts by itself. Only `/i/` is behind the
  # module: `/p/api/` keeps its own login, so the route needs no `/api` rule and
  # API clients never see a sign-in redirect. See
  # `cluster/helm/news/freshrss/values.yaml`.
  #
  # The name is `freshrss`, with no `-oidc` suffix: there was never a proxy
  # provider under this name, so there is no existing object to update in place
  # and no stale forward-auth redirect URI to inherit.
  - model: authentik_providers_oauth2.oauth2provider
    id: freshrss-provider
    identifiers:
      name: freshrss
    attrs:
      name: freshrss
      client_type: confidential
      # Blueprint-created providers start with no grant types, unlike the UI
      # wizard which preselects these two; without them the authorize endpoint
      # answers "Invalid grant_type for provider".
      grant_types:
        - authorization_code
        - refresh_token
      client_id: freshrss
      client_secret: !Env FRESHRSS_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          # FreshRSS's callback, from its own OIDC documentation. The port is
          # part of the string even for 443: mod_auth_openidc builds it from
          # X-Forwarded-Port, and authentik compares the whole thing.
          url: https://freshrss.kub.home.ashudev.com:443/i/oidc/
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: freshrss-app
    identifiers:
      slug: freshrss
    attrs:
      name: FreshRSS
      slug: freshrss
      provider: !KeyOf freshrss-provider
      meta_launch_url: https://freshrss.kub.home.ashudev.com/
      # Official logo, served from the dashboard-icons set. The browser
      # loads it, so the grid needs internet; swap to `fa://fa-<name>`
      # if it ever has to work offline.
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/freshrss.png
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf freshrss-app
      order: 0
    attrs:
      # Administrator only: the operator is the sole user of the reader.
      group: !Find [authentik_core.group, [name, authentik Admins]]
