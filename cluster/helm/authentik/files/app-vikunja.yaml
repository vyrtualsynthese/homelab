version: 1
metadata:
  name: ashulab-app-vikunja
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-groups
      required: true

  # Vikunja 2.8 authenticates with OIDC itself, so the board has a plain OAuth2
  # provider — not the proxy provider the forward-auth gate needed. The gate is
  # gone from the route (`cluster/helm/vikunja/values.yaml`); `vikunja.kub.local`
  # keeps `lan-only` and nothing else, because every browser behind a gate
  # arrives as the same identity and the board attributes a card to whoever is
  # signed in.
  #
  # Vikunja only links an existing local account to an OIDC subject when the
  # `email_verified` claim is true, and authentik's stock `email` scope does not
  # set it. Without this mapping the next sign-in would create a second account
  # instead of reusing the operator's. It is declared here, not left to the UI,
  # because a re-apply of the provider below writes its scope list whole and
  # would drop a mapping that otherwise only lives in the database.
  - model: authentik_providers_oauth2.scopemapping
    id: vikunja-email-verified
    identifiers:
      name: "vikunja: email verified"
    attrs:
      name: "vikunja: email verified"
      scope_name: email
      description: >-
        Same claims as authentik's default email mapping, but email_verified is
        true so Vikunja may link an existing local account instead of creating a
        second one.
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }

  # Named `vikunja-oidc`, never `vikunja`: a proxy provider is an OAuth2
  # provider underneath, so reusing the name would update the retired gate's
  # object in place and keep its forward-auth redirect URIs (the trap written
  # down in `app-autobrr.yaml`).
  - model: authentik_providers_oauth2.oauth2provider
    id: vikunja-oidc-provider
    identifiers:
      name: vikunja-oidc
    attrs:
      name: vikunja-oidc
      client_type: confidential
      # Blueprint-created providers start with no grant types, unlike the UI
      # wizard which preselects these two; without them the authorize endpoint
      # answers "Invalid grant_type for provider".
      grant_types:
        - authorization_code
        - refresh_token
      # Public: this is also `VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTID`
      # in `cluster/helm/vikunja/values.yaml`, and the two must stay equal.
      client_id: eqfj9awPPBaZSDan6HikbXBYSJgh1nok8ahhVKG4
      # The only part that is not public. `authentik-sso` carries the same value
      # as Secret `vikunja-oidc`/`CLIENTSECRET` in the `vikunja` namespace,
      # because Secrets do not cross namespaces (`docs/secrets.md`).
      client_secret: !Env VIKUNJA_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          # Vikunja builds this from its own public URL plus the registered
          # redirect path; the route is TLS, so the scheme is `https`.
          url: https://vikunja.kub.local/auth/openid/authentik
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf vikunja-email-verified

  # The slug is not cosmetic: it names the issuer the board is configured with,
  # `https://authentik.kub.home.ashudev.com/application/o/vikunja-oidc/`, which
  # is `VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_AUTHURL` in the chart. Renaming
  # it breaks every sign-in until the chart follows.
  - model: authentik_core.application
    id: vikunja-app
    identifiers:
      slug: vikunja-oidc
    attrs:
      name: Vikunja
      slug: vikunja-oidc
      provider: !KeyOf vikunja-oidc-provider
      meta_launch_url: https://vikunja.kub.local/
      meta_description: Task board, signed in with OIDC
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/vikunja.png
      policy_engine_mode: any

  # Operator-only. The board's identity is the operator's own OIDC account;
  # agents reach it with API tokens, which are local users and never pass
  # through the authorization flow, so this binding gates the browser only.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf vikunja-app
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]
