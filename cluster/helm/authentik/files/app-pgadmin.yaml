version: 1
metadata:
  name: ashulab-app-pgadmin
entries:
  # The app binds to the `apps` group, which ashulab-users creates. Blueprint
  # order is not guaranteed, so require that file first.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-users
      required: true
  - model: authentik_providers_oauth2.oauth2provider
    id: pgadmin-provider
    identifiers:
      name: pgadmin
    attrs:
      name: pgadmin
      client_type: confidential
      # Blueprint-created providers start with no grant types, unlike the UI
      # wizard which preselects these two; without them the authorize endpoint
      # answers "Invalid grant_type for provider".
      grant_types:
        - authorization_code
        - refresh_token
      client_id: pgadmin
      client_secret: !Env PGADMIN_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: http://pgadmin.kub.local/oauth2/authorize
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: pgadmin-app
    identifiers:
      slug: pgadmin
    attrs:
      name: pgAdmin
      slug: pgadmin
      provider: !KeyOf pgadmin-provider
      meta_launch_url: http://pgadmin.kub.local/
      policy_engine_mode: all

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf pgadmin-app
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, apps]]
