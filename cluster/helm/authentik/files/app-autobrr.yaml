version: 1
metadata:
  name: ashulab-app-autobrr
entries:
  # Level groups come from ashulab-groups; blueprint order is not guaranteed,
  # so require that file first.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-groups
      required: true

  # autobrr speaks OIDC natively, so this is a plain OAuth2 provider — not a
  # proxy provider like the tools that have no login protocol of their own.
  # Native OIDC means the app asks authentik directly, and its API keeps
  # working with API keys because no proxy sits in front of it.
  - model: authentik_providers_oauth2.oauth2provider
    id: autobrr-provider
    identifiers:
      # Named apart from the proxy provider this tool used to have: a proxy
      # provider is an OAuth2 provider underneath, so reusing the name updated
      # that object instead of creating a plain client, and it kept the
      # forward-auth redirect URIs. A distinct name forces a real OAuth2
      # provider with the callback autobrr actually calls.
      name: autobrr-oidc
    attrs:
      name: autobrr-oidc
      client_type: confidential
      # Blueprint-created providers start with no grant types, unlike the UI
      # wizard which preselects these two; without them the authorize endpoint
      # answers "Invalid grant_type for provider".
      grant_types:
        - authorization_code
        - refresh_token
      client_id: autobrr
      client_secret: !Env AUTOBRR_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # autobrr's own documentation asks for RS256 and an RSA signing key, and
      # names this certificate as the authentik default that works.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          # Exact string autobrr builds from X-Forwarded-Proto. The route is
          # plain HTTP, so this must be `http://` or the callback is refused.
          url: http://autobrr.kub.local/api/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: autobrr-app
    identifiers:
      slug: autobrr
    attrs:
      name: Autobrr
      slug: autobrr
      provider: !KeyOf autobrr-provider
      meta_launch_url: http://autobrr.kub.local/
      # Official logo, served from the dashboard-icons set. The browser
      # loads it, so the grid needs internet; swap to `fa://fa-<name>`
      # if it ever has to work offline.
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/autobrr.png
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf autobrr-app
      order: 0
    attrs:
      # Administrator only: the operator is the sole user of this tool.
      group: !Find [authentik_core.group, [name, authentik Admins]]
