version: 1
metadata:
  name: ashulab-app-access
entries:
  # One policy, bound to every application, so the rule is in one place:
  # a member of `apps` or of `authentik Admins` may open any wired application.
  # Two group bindings would not do: applications run in "all" mode, so two
  # bindings would require membership of both, not either.
  - model: authentik_policies_expression.expressionpolicy
    id: app-access
    identifiers:
      name: app-access
    attrs:
      expression: |
        return request.user.is_superuser or request.user.groups.filter(
            name__in=["apps", "authentik Admins"]
        ).exists()
