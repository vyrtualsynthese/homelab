version: 1
metadata:
  name: ashulab-app-wg-easy
entries:
  # Level groups come from ashulab-groups; blueprint order is not guaranteed,
  # so require that file first.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-groups
      required: true

  # wg-easy 15 signs in through authentik itself (`OAUTH_PROVIDERS=oidc`), so this
  # is a plain OAuth2 provider and not the forward-auth gate: the panel holds the
  # identity. It runs on the two edge Pis, which terminate their own TLS, but the
  # provider still lives here — and that is why the panel keeps its password
  # login as the way in when the cluster is down.
  #
  # wg-easy 15.5 links an OIDC subject to an existing panel account by matching
  # the email claim, and its auto-register is off, so an unknown email is refused
  # rather than minted a second admin. The panel account's address has to be the
  # authentik one.
  #
  # wg-easy accepts the login only when the email scope returns
  # `email_verified: true`, and authentik's stock email scope returns false. This
  # is the mapping authentik's own wg-easy integration page prescribes; without
  # it every sign-in is refused. Vikunja needs the same override, for the same
  # reason, and declares its own copy because the two providers are applied
  # independently.
  - model: authentik_providers_oauth2.scopemapping
    id: wg-easy-email-verified
    identifiers:
      name: "wg-easy: email verified"
    attrs:
      name: "wg-easy: email verified"
      scope_name: email
      description: >-
        Same claims as authentik's default email mapping, but email_verified is
        true so wg-easy accepts the sign-in and links it to the panel account.
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True,
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: wg-easy-provider
    identifiers:
      name: wg-easy
    attrs:
      name: wg-easy
      client_type: confidential
      # Blueprint-created providers start with no grant types, unlike the UI
      # wizard which preselects these two.
      grant_types:
        - authorization_code
        - refresh_token
      # Public: this is also OAUTH_OIDC_CLIENT_ID in the Pis' compose template,
      # and the two must stay equal.
      client_id: wg-easy
      # The only part that is not public. `authentik-sso` carries the same value
      # as key WG_EASY_CLIENT_SECRET, and each Pi's wg-easy.env carries it as
      # OAUTH_OIDC_CLIENT_SECRET, because Secrets do not leave the cluster
      # (docs/secrets.md).
      client_secret: !Env WG_EASY_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Two paths per host: the sign-in callback and the "link an existing
      # account" callback. Both are authorization redirects; authentik has no
      # separate type for the link flow. The port is part of the string.
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://vpn-rbp0.kub.local:8443/api/auth/oidc/callback
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://vpn-rbp0.kub.local:8443/api/auth/oidc/link
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://vpn-rbp1.kub.local:8443/api/auth/oidc/callback
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://vpn-rbp1.kub.local:8443/api/auth/oidc/link
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf wg-easy-email-verified

  # The slug is not cosmetic: it names the issuer each panel is configured with,
  # https://authentik.kub.home.ashudev.com/application/o/wg-easy/, so the two
  # must stay equal.
  - model: authentik_core.application
    id: wg-easy-app
    identifiers:
      slug: wg-easy
    attrs:
      name: VPN panel
      slug: wg-easy
      provider: !KeyOf wg-easy-provider
      # rbp0 is the primary, the source of truth for the pair; rbp1 is the second.
      meta_launch_url: https://vpn-rbp0.kub.local:8443/
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/wireguard.png
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf wg-easy-app
      order: 0
    attrs:
      # Admin level only: this screen mints VPN peers and holds their keys.
      group: !Find [authentik_core.group, [name, authentik Admins]]
