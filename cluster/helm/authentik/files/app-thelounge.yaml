version: 1
metadata:
  name: ashulab-app-thelounge
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-groups
      required: true

  # Forward auth, not OIDC: The Lounge has no OIDC support. Its only native
  # identity option is LDAP (the authentik integration guide uses an LDAP
  # provider plus the LDAP outpost), and this cluster runs no LDAP outpost. So
  # authentik stands in front of the app, and The Lounge keeps its own accounts
  # behind the gate: passing the outpost proves the browser is signed in, it
  # does not tell the app who that is.
  #
  # No client secret and no internal host: the outpost validates the session and
  # answers Traefik, which passes the X-authentik-* headers on.
  - model: authentik_providers_proxy.proxyprovider
    id: thelounge-provider
    identifiers:
      name: thelounge
    attrs:
      name: thelounge
      mode: forward_single
      # Scheme and host must match the browser. The router serves this name over
      # TLS on `websecure` with a resolver-issued certificate, and the outpost
      # takes the session cookie's Secure flag from this scheme, so it has to
      # stay in step with cluster/helm/thelounge/templates/ingressroute.yaml.
      external_host: https://thelounge.kub.home.ashudev.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: thelounge-app
    identifiers:
      slug: thelounge
    attrs:
      name: The Lounge
      slug: thelounge
      provider: !KeyOf thelounge-provider
      meta_launch_url: https://thelounge.kub.home.ashudev.com/
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/thelounge.svg
      policy_engine_mode: any

  # Members only. `homelab-guests` signs in and reaches nothing, which is the
  # point of that group; narrowing this to `authentik Admins` is a binding
  # change, not a chart change.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf thelounge-app
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, homelab-users]]
