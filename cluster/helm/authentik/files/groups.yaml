version: 1
metadata:
  name: ashulab-groups
entries:
  - model: authentik_core.group
    id: homelab-users
    identifiers:
      name: homelab-users
    attrs:
      name: homelab-users
      is_superuser: false
      # May open the applications marked user-safe, always in the plain user
      # role. Application administrator is the built-in `authentik Admins`.
  - model: authentik_core.group
    id: homelab-guests
    identifiers:
      name: homelab-guests
    attrs:
      name: homelab-guests
      is_superuser: false
      # Default landing for every new identity. Signs in, reaches nothing.
  # Temporary: retired by the migration plan once memberships have moved. Kept
  # until then so the application blueprints' !Find lookups still resolve.
  - model: authentik_core.group
    id: users
    identifiers:
      name: users
    attrs:
      name: users
      is_superuser: false
  - model: authentik_core.group
    id: apps
    identifiers:
      name: apps
    attrs:
      name: apps
      is_superuser: false
