version: 1
metadata:
  name: ashulab-app-radarr-anime
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-groups
      required: true

  # Radarr 7 authenticates with OIDC itself, so this is a plain OAuth2 provider —
  # not the proxy provider this instance had since the forward-auth gate landed
  # on 2026-11-18. The gate is gone from the route; see
  # `media-stack/radarr-anime/values.yaml`.
  #
  # Named `radarr-anime-oidc`, never `radarr-anime`: a proxy provider is an
  # OAuth2 provider underneath, so reusing the name updates that object in place
  # and keeps the forward-auth redirect URIs.
  - model: authentik_providers_oauth2.oauth2provider
    id: radarr-anime-oidc-provider
    identifiers:
      name: radarr-anime-oidc
    attrs:
      name: radarr-anime-oidc
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: radarr-anime
      client_secret: !Env RADARR_ANIME_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          # ASP.NET's default OIDC callback path; Radarr does not override it.
          url: https://radarr-anime.kub.local/signin-oidc
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: radarr-anime-app
    identifiers:
      slug: radarr-anime
    attrs:
      name: Radarr Anime
      slug: radarr-anime
      provider: !KeyOf radarr-anime-oidc-provider
      meta_launch_url: https://radarr-anime.kub.local/
      # Official logo, served from the dashboard-icons set. The browser
      # loads it, so the grid needs internet; swap to `fa://fa-<name>`
      # if it ever has to work offline.
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/radarr.png
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf radarr-anime-app
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]
