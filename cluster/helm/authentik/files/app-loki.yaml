version: 1
metadata:
  name: ashulab-app-loki
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-groups
      required: true

  # Forward auth, not OIDC: Loki has no identity model of its own — it runs
  # `auth_enabled: false` and answers a query to anyone who can reach it. Every
  # browser that passes the outpost arrives as the same identity, which is the
  # point: the gate decides whether a session exists, not whose it is.
  #
  # No client secret and no internal host: the outpost validates the session
  # and answers Traefik, which passes the X-authentik-* headers on.
  - model: authentik_providers_proxy.proxyprovider
    id: loki-provider
    identifiers:
      name: loki
    attrs:
      name: loki
      mode: forward_single
      # Scheme and host must match the browser: `loki.kub.local` is served on
      # `websecure` with the cluster's internal certificate (see
      # cluster/helm/monitoring/loki/templates/ingressroute.yaml), and the
      # outpost takes the session cookie's Secure flag from this scheme. A
      # provider left on `http` against that router sets a weak cookie and the
      # browser loops between two 302s.
      external_host: https://loki.kub.local
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: loki-app
    identifiers:
      slug: loki
    attrs:
      name: Loki
      slug: loki
      provider: !KeyOf loki-provider
      meta_launch_url: https://loki.kub.local/ui
      meta_icon: https://raw.githubusercontent.com/grafana/loki/main/docs/sources/logo.png
      policy_engine_mode: any

  # Admins only: the store holds every namespace's logs for 30 days, which is
  # the same audience as Grafana's dashboards. Widening it is a second binding
  # for `homelab-users`, nothing in the chart.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf loki-app
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]
