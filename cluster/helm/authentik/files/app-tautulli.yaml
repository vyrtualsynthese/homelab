version: 1
metadata:
  name: ashulab-app-tautulli
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-groups
      required: true

  # Forward auth: no internal host and no client secret. The outpost checks the
  # request and answers Traefik, which does pass the X-authentik-* headers on,
  # since its middleware lists them in `authResponseHeaders`. There is no
  # strip-authentik-header step because it would buy nothing: Tautulli does not
  # trust those headers. It keeps its own login until that is switched off, and
  # from then on trusts nothing arriving from the network.
  - model: authentik_providers_proxy.proxyprovider
    id: tautulli-provider
    identifiers:
      name: tautulli
    attrs:
      name: tautulli
      mode: forward_single
      # Scheme must match the browser. These hosts are served over TLS on
      # `websecure` since 2026-11-15, and the outpost takes the session cookie's
      # Secure flag from this scheme, so it has to stay in step with the router.
      external_host: https://tautulli.kub.local
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: tautulli-app
    identifiers:
      slug: tautulli
    attrs:
      name: Tautulli
      slug: tautulli
      provider: !KeyOf tautulli-provider
      meta_launch_url: https://tautulli.kub.local/
      # Official logo, served from the dashboard-icons set. The browser
      # loads it, so the grid needs internet; swap to `fa://fa-<name>`
      # if it ever has to work offline.
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/tautulli.png
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf tautulli-app
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]
