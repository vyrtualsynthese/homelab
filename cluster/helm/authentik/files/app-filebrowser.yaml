version: 1
metadata:
  name: ashulab-app-filebrowser
entries:
  # Level groups come from ashulab-groups; blueprint order is not guaranteed,
  # so require that file first.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-groups
      required: true

  # Capability group: admits to FileBrowser. Folder scope is per account inside
  # FileBrowser, which authentik cannot describe.
  - model: authentik_core.group
    id: filebrowser-editors
    identifiers:
      name: filebrowser-editors
    attrs:
      name: filebrowser-editors
      is_superuser: false

  # Native OIDC: the app holds its own session, keeps share links anonymous, and
  # knows which person is browsing. A forward-auth gate would answer the sign-in
  # wall to share links and hand every browser the same identity.
  #
  # Blueprint-created providers start with no grant types (see app-calibre.yaml),
  # so both are named explicitly.
  - model: authentik_providers_oauth2.oauth2provider
    id: filebrowser-provider
    identifiers:
      name: filebrowser-oidc
    attrs:
      name: filebrowser-oidc
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: filebrowser
      # Read from the authentik-sso Secret at apply time. Changing it needs a
      # worker restart, because !Env is resolved when the blueprint is applied.
      client_secret: !Env FILEBROWSER_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: https://filebrowser.kub.home.ashudev.com/api/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        # `profile` carries `preferred_username` (the identifier the app asks
        # for) and `groups`, which feeds `adminGroup`/`userGroups`.
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: filebrowser-app
    identifiers:
      slug: filebrowser
    attrs:
      name: FileBrowser
      slug: filebrowser
      provider: !KeyOf filebrowser-provider
      meta_launch_url: https://filebrowser.kub.home.ashudev.com/
      # Official logo, served from the dashboard-icons set. The browser
      # loads it, so the grid needs internet; swap to `fa://fa-<name>`
      # if it ever has to work offline.
      meta_icon: https://raw.githubusercontent.com/filebrowser/filebrowser/master/frontend/public/img/logo.svg
      policy_engine_mode: any

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf filebrowser-app
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf filebrowser-app
      order: 10
    attrs:
      group: !KeyOf filebrowser-editors

# No outpost assignment: an OAuth2 provider needs no Traefik middleware, and the
# application is reached through the app's own sign-in. The `filebrowser-editors`
# group is the capability gate in the blueprint policies above; the folder scope
# is per account inside FileBrowser, which authentik cannot describe.
