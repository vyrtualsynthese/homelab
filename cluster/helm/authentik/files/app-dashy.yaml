version: 1
metadata:
  name: ashulab-app-dashy
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-groups
      required: true

  # Forward auth, not OIDC: Dashy is a static page of links, with no identity
  # model of its own and no way to accept a token. Every browser that passes
  # the outpost arrives as the same identity, which is acceptable here —
  # nothing on the page knows who is reading.
  #
  # No client secret and no internal host: the outpost validates the session
  # and answers Traefik, which passes the X-authentik-* headers on.
  - model: authentik_providers_proxy.proxyprovider
    id: dashy-provider
    identifiers:
      name: dashy
    attrs:
      name: dashy
      mode: forward_single
      # Scheme must match the browser. `dashy.kub.local` is served over TLS on
      # `websecure` with the cluster's internal certificate, and the outpost
      # takes the session cookie's Secure flag from this scheme, so it has to
      # stay in step with the router in cluster/helm/dashy/templates/ingress.yaml.
      external_host: https://dashy.kub.local
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: dashy-app
    identifiers:
      slug: dashy
    attrs:
      name: Dashy
      slug: dashy
      provider: !KeyOf dashy-provider
      meta_launch_url: https://dashy.kub.local/
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/dashy.svg
      policy_engine_mode: any

  # Admins only, for now: the page links to every application, including the
  # admin tools. Widening it is a second binding for `homelab-users`, nothing
  # in the chart.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf dashy-app
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]
