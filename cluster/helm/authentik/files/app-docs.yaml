version: 1
metadata:
  name: ashulab-app-docs
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: ashulab-groups
      required: true

  # Forward auth, not OIDC: the site is static HTML rendered by MkDocs, with no
  # identity model of its own and no way to accept a token. Every browser that
  # passes the outpost arrives as the same identity, which is acceptable here —
  # nothing on the site knows who is reading.
  #
  # No client secret and no internal host: the outpost validates the session and
  # answers Traefik, which passes the X-authentik-* headers on.
  - model: authentik_providers_proxy.proxyprovider
    id: docs-provider
    identifiers:
      name: docs
    attrs:
      name: docs
      mode: forward_single
      # Scheme must match the browser. `docs.kub.local` is served over TLS on
      # `websecure` with the cluster's internal certificate, and the outpost
      # takes the session cookie's Secure flag from this scheme, so it has to
      # stay in step with the router.
      external_host: https://docs.kub.local
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    id: docs-app
    identifiers:
      slug: docs
    attrs:
      name: Docs
      slug: docs
      provider: !KeyOf docs-provider
      meta_launch_url: https://docs.kub.local/
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/mkdocs.png
      policy_engine_mode: any

  # Admins only, for now: the site is the operator's own documentation, built
  # from private repositories. Widening it is this binding plus a second one for
  # `homelab-users`, nothing in the chart.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf docs-app
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, authentik Admins]]
