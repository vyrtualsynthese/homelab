apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-kub-home
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  entryPoints:
    - websecure
  routes:
    # Public on purpose: this is the sign-in page for `dashy.ashudev.com`, and a
    # page behind the gate whose login lives on the LAN cannot be opened from
    # the internet. `security` is the remaining middleware; authentik's own
    # flows, rate limiting and policies are the control, not a network rule.
    - match: Host(`authentik.kub.home.ashudev.com`)
      kind: Rule
      services:
        - name: authentik-server
          port: http
      middlewares:
        - name: kube-system-security@kubernetescrd
  tls:
    certResolver: myresolver
    options:
      name: authentik-tlsoption
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-kub-home-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`authentik.kub.home.ashudev.com`)
      kind: Rule
      services:
        - name: authentik-server
          port: http
      middlewares:
        - name: kube-system-redirect-https@kubernetescrd
