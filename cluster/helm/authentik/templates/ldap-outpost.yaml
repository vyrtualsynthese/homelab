apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-ldap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-ldap
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ldap-outpost
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik-ldap
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authentik-ldap
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ldap-outpost
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ldap
          # Pinned with the server: both are the same authentik release.
          image: "ghcr.io/goauthentik/ldap:{{ .Values.authentik.global.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            # In-cluster HTTP on the server Service: no TLS, no hairpin NAT
            # through Traefik and no certificate to trust.
            - name: AUTHENTIK_HOST
              value: http://authentik-server.authentik.svc.cluster.local
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-ldap
                  key: AUTHENTIK_TOKEN
          ports:
            # 3389 only: the TLS listener (6636) has no certificate on the
            # provider, and a Service port with nothing behind it is a lie.
            - name: ldap
              containerPort: 3389
              protocol: TCP
          # The listener opens once the outpost has fetched its configuration,
          # so a TCP connect is the honest signal.
          livenessProbe:
            tcpSocket:
              port: ldap
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
      nodeSelector:
        kubernetes.io/hostname: nuc0
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-ldap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik-ldap
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: authentik-ldap
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: ldap
      port: 3389
      targetPort: ldap
      protocol: TCP
