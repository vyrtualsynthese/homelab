apiVersion: v1
kind: ServiceAccount
metadata:
  name: authentik-worker-reload
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-worker-reload
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-worker-reload
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: authentik-worker-reload
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-worker-reload
---
# Blueprints are mounted into the worker and applied at startup. A ConfigMap
# update does not reliably reach the file watcher, so this PostSync hook deletes
# the worker pod and lets the Deployment recreate it, which applies the
# committed blueprints during the sync instead of waiting for the hourly scan.
apiVersion: batch/v1
kind: Job
metadata:
  name: authentik-worker-reload
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: authentik
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: authentik-worker-reload
      restartPolicy: Never
      containers:
        - name: kubectl
          image: registry.k8s.io/kubectl:v1.30.1
          command:
            - kubectl
            - -n
            - {{ .Release.Namespace }}
            - delete
            - pod
            - -l
            - app.kubernetes.io/component=worker
            - --ignore-not-found
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
