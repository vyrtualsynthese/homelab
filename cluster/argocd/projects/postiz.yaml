apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  #  annotations:
  #    argocd-image-updater.argoproj.io/image-list: lissy93/dashy:^2.0
  name: postiz
  namespace: argocd
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: postiz
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
  sources:
    - repoURL: 'https://ghcr.io/gitroomhq/postiz-helmchart/charts/postiz-app'
      chart: postiz
      targetRevision: 1.0.5
      helm:
        valueFiles:
          - $values/cluster/helm/postiz/values.yaml
    - repoURL: 'https://github.com/vyrtualsynthese/homelab.git'
      targetRevision: develop
      ref: values
