apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: discourse
  namespace: argocd
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: discourse
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
  sources:
    - repoURL: 'registry-1.docker.io/bitnamicharts'
      path: discourse
      chart: discourse
      targetRevision: 15.1.2
      helm:
        valueFiles:
          - $values/cluster/helm/discourse/values.yaml
    - repoURL: 'https://github.com/vyrtualsynthese/homelab.git'
      targetRevision: develop
      ref: values
