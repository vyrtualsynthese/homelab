apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: kube-system
spec:
  forwardAuth:
    # The embedded outpost is served by the authentik server pod: the Service's
    # http port (80) maps to container port 9000. Do not point this at the
    # public Ingress, which would loop through the internet.
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    # Traefik v3 warns on every router that carries this middleware when the
    # response body has no cap. The outpost answers with headers and an empty
    # body, so 64 KiB is far above anything it sends and still bounds the read.
    maxResponseBodySize: 65536
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
