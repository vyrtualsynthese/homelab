# Chart 27.0.2, Traefik 2.11. The intermediate release of W5 task 6: it serves
# both CRD API groups, which is what lets the rename (task 12) land with no
# routing change and lets v3 read only `traefik.io`.
#
# Derived from values.yaml, one key at a time, because the two chart lines do
# not share a schema:
#   - `ports.*.expose` is a map keyed by Service name (`default: true`), not a
#     boolean;
#   - `global.systemDefaultRegistry` is gone from the chart value set;
#   - `deployment.kind`, `service.type`, `service.ipFamilyPolicy`,
#     `updateStrategy` and `certResolvers` are unchanged from chart 25.0.3.
#
# The image is the official one, not Rancher's mirror. The mirror was inherited
# from the K3s addon and stops at 2.11.50; upstream carries the 2.11 backports,
# and this line is deleted once v3 lands.
#
# `ipAllowList` is not used here yet: the installed 2.9 CRDs would prune it.
# Task 6 applies this chart's CRDs, Task 7 renames the gate.

deployment:
  # One pod, not a DaemonSet (task 482). Two processes writing /data/acme.json
  # corrupt it and re-request every name.
  kind: Deployment
  replicas: 1

# Recreate, not a rolling update: a rolling one runs both pods together for a
# few seconds, which is two certificate owners again.
updateStrategy:
  type: Recreate
  rollingUpdate: null

# The house router forwards 80, 443, 25565, 22000 TCP/UDP and 21027 UDP to
# 192.168.1.46, so this is where every external byte lands.
nodeSelector:
  kubernetes.io/hostname: streaming

image:
  repository: traefik
  # Newest 2.11 patch at the time of writing; the chart's appVersion (2.11.2)
  # is the floor, not a ceiling.
  tag: "v2.11.63"

priorityClassName: system-cluster-critical

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

# Measured 2026-11-21 on 2.10.7: 2 m CPU and 63 MiB working set.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

providers:
  kubernetesCRD:
    # Every gate and redirect is referenced as kube-system-<name>@kubernetescrd;
    # without this no cross-namespace reference resolves and every gate vanishes.
    allowCrossNamespace: true
  kubernetesIngress:
    publishedService:
      enabled: true

ingressRoute:
  dashboard:
    enabled: true
    entryPoints: ["websecure"]
    matchRule: Host(`traefik.kub.local`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
    middlewares:
      - name: lan-only
        namespace: kube-system
      - name: traefik-dashboard
        namespace: kube-system
    # Neither a secretName nor a certResolver: Traefik serves the default
    # kube-system/local-cert through the `default` TLSStore.
    tls:
      options:
        name: internal-tls
        namespace: kube-system

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: false
    addRoutersLabels: true
    addServicesLabels: false
    buckets: "0.1,0.25,0.5,1.0,2.5,5.0,10.0"
    manualRouting: false

certResolvers:
  myresolver:
    email: valentin.ronteix@ashudev.com
    tlsChallenge: true
    # Must match the mounted claim; a different path means the store is empty
    # and every name is re-issued.
    storage: /data/acme.json

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
    forwardedHeaders:
      insecure: true
    proxyProtocol:
      insecure: true
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    forwardedHeaders:
      insecure: true
    proxyProtocol:
      insecure: true
  mc:
    port: 25565
    expose:
      default: true
    exposedPort: 25565
    protocol: TCP
  # Syncthing: file transfer (22000 TCP and UDP) and local discovery (21027 UDP).
  sttcp:
    port: 22000
    expose:
      default: true
    exposedPort: 22000
    protocol: TCP
  studp:
    port: 22000
    expose:
      default: true
    exposedPort: 22000
    protocol: UDP
  stdiscovery:
    port: 21027
    expose:
      default: true
    exposedPort: 21027
    protocol: UDP
  metrics:
    port: 9100
    # Not published on the Service: Prometheus scrapes the pod's 9100 through
    # the chart's prometheus.io/* annotations.
    expose:
      default: false
    exposedPort: 9101
    protocol: TCP

persistence:
  enabled: true
  name: data
  # Holds /data/acme.json, the certificate store; a different claim means every
  # name is re-issued.
  existingClaim: pvc-traefik-nfs
  path: /data

service:
  enabled: true
  single: true
  type: LoadBalancer
  # Rendered only when set: without it the API server defaults the Service to
  # SingleStack, which is not the object that serves today.
  ipFamilyPolicy: PreferDualStack
  spec:
    externalTrafficPolicy: Local
