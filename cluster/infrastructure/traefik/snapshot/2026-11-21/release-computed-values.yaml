additionalArguments: []
additionalVolumeMounts: []
affinity: {}
autoscaling:
  enabled: false
certResolvers:
  myresolver:
    email: valentin.ronteix@ashudev.com
    storage: /data/acme.json
    tlsChallenge: true
commonLabels: {}
deployment:
  additionalContainers: []
  additionalVolumes: []
  annotations: {}
  dnsConfig: {}
  enabled: true
  imagePullSecrets: []
  initContainers: []
  kind: Deployment
  labels: {}
  lifecycle: {}
  minReadySeconds: 0
  podAnnotations:
    prometheus.io/port: "8082"
    prometheus.io/scrape: "true"
  podLabels: {}
  replicas: 1
  shareProcessNamespace: false
  terminationGracePeriodSeconds: 60
env:
- name: POD_NAME
  valueFrom:
    fieldRef:
      fieldPath: metadata.name
- name: POD_NAMESPACE
  valueFrom:
    fieldRef:
      fieldPath: metadata.namespace
envFrom: []
experimental:
  kubernetesGateway:
    enabled: false
  plugins:
    enabled: false
extraObjects: []
global:
  systemDefaultRegistry: ""
globalArguments:
- --global.checknewversion
- --global.sendanonymoususage
hostNetwork: false
image:
  pullPolicy: IfNotPresent
  repository: rancher/mirrored-library-traefik
  tag: 2.10.7
ingressClass:
  enabled: true
  isDefaultClass: true
ingressRoute:
  dashboard:
    annotations: {}
    enabled: true
    entryPoints:
    - web
    labels: {}
    matchRule: Host(`traefik.kub.local`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
    middlewares:
    - name: lan-only
      namespace: kube-system
    - name: traefik-dashboard
      namespace: kube-system
    tls: {}
  healthcheck:
    annotations: {}
    enabled: false
    entryPoints:
    - traefik
    labels: {}
    matchRule: PathPrefix(`/ping`)
    middlewares: []
    tls: {}
livenessProbe:
  failureThreshold: 3
  initialDelaySeconds: 2
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 2
logs:
  access:
    enabled: false
    fields:
      general:
        defaultmode: keep
        names: {}
      headers:
        defaultmode: drop
        names: {}
    filters: {}
  general:
    level: ERROR
metrics:
  prometheus:
    addEntryPointsLabels: false
    addRoutersLabels: true
    addServicesLabels: false
    buckets: 0.5,1.0,2.5
    entryPoint: metrics
    manualRouting: true
nodeSelector:
  kubernetes.io/hostname: streaming
persistence:
  accessMode: ReadWriteOnce
  annotations: {}
  enabled: true
  existingClaim: pvc-traefik-nfs
  name: data
  path: /data
  size: 128Mi
podDisruptionBudget:
  enabled: false
podSecurityContext:
  fsGroupChangePolicy: OnRootMismatch
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
podSecurityPolicy:
  enabled: false
ports:
  mc:
    expose: true
    exposedPort: 25565
    port: 25565
    protocol: TCP
  metrics:
    expose: true
    exposedPort: 9101
    port: 9100
    protocol: TCP
  stdiscovery:
    expose: true
    exposedPort: 21027
    port: 21027
    protocol: UDP
  sttcp:
    expose: true
    exposedPort: 22000
    port: 22000
    protocol: TCP
  studp:
    expose: true
    exposedPort: 22000
    port: 22000
    protocol: UDP
  traefik:
    expose: false
    exposedPort: 9000
    port: 9000
    protocol: TCP
  web:
    expose: true
    exposedPort: 80
    forwardedHeaders:
      insecure: true
    port: 8000
    protocol: TCP
    proxyProtocol:
      insecure: true
  websecure:
    expose: true
    exposedPort: 443
    forwardedHeaders:
      insecure: true
    http3:
      enabled: false
    middlewares: []
    port: 8443
    protocol: TCP
    proxyProtocol:
      insecure: true
    tls:
      certResolver: ""
      domains: []
      enabled: true
      options: ""
priorityClassName: system-cluster-critical
providers:
  kubernetesCRD:
    allowCrossNamespace: true
    allowEmptyServices: false
    allowExternalNameServices: false
    enabled: true
    namespaces: []
  kubernetesIngress:
    allowEmptyServices: false
    allowExternalNameServices: false
    enabled: true
    namespaces: []
    publishedService:
      enabled: true
rbac:
  enabled: true
  namespaced: false
readinessProbe:
  failureThreshold: 1
  initialDelaySeconds: 2
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 2
resources: {}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
service:
  annotations: {}
  annotationsTCP: {}
  annotationsUDP: {}
  enabled: true
  externalIPs: []
  ipFamilyPolicy: PreferDualStack
  labels: {}
  loadBalancerSourceRanges: []
  single: true
  spec:
    externalTrafficPolicy: Local
  type: LoadBalancer
serviceAccount:
  name: ""
serviceAccountAnnotations: {}
tlsOptions: {}
tlsStore: {}
tolerations:
- key: CriticalAddonsOnly
  operator: Exists
- effect: NoSchedule
  key: node-role.kubernetes.io/control-plane
  operator: Exists
- effect: NoSchedule
  key: node-role.kubernetes.io/master
  operator: Exists
topologySpreadConstraints: []
tracing: {}
updateStrategy:
  type: Recreate
volumes: []
