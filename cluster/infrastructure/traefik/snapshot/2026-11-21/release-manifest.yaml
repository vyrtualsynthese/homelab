# Source: traefik/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: kube-system
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-kube-system
    helm.sh/chart: traefik-25.0.3_up25.0.0
    app.kubernetes.io/managed-by: Helm
  annotations:
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/instance: traefik-kube-system
  strategy: 
    type: Recreate
  minReadySeconds: 0
  template: 
    metadata:
      annotations:
        prometheus.io/port: "8082"
        prometheus.io/scrape: "true"
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9100"
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-kube-system
        helm.sh/chart: traefik-25.0.3_up25.0.0
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: traefik
      terminationGracePeriodSeconds: 60
      hostNetwork: false
      containers:
      - image: "rancher/mirrored-library-traefik:3.7.19"
        imagePullPolicy: IfNotPresent
        name: traefik
        resources:
        readinessProbe:
          httpGet:
            path: /ping
            port: 9000
            scheme: HTTP
          failureThreshold: 1
          initialDelaySeconds: 2
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /ping
            port: 9000
            scheme: HTTP
          failureThreshold: 3
          initialDelaySeconds: 2
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        lifecycle:
        ports:
        - name: "mc"
          containerPort: 25565
          protocol: "TCP"
        - name: "metrics"
          containerPort: 9100
          protocol: "TCP"
        - name: "stdiscovery"
          containerPort: 21027
          protocol: "UDP"
        - name: "sttcp"
          containerPort: 22000
          protocol: "TCP"
        - name: "studp"
          containerPort: 22000
          protocol: "UDP"
        - name: "traefik"
          containerPort: 9000
          protocol: "TCP"
        - name: "web"
          containerPort: 8000
          protocol: "TCP"
        - name: "websecure"
          containerPort: 8443
          protocol: "TCP"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: data
            mountPath: /data
          - name: tmp
            mountPath: /tmp
        args:
          - "--global.checknewversion"
          - "--global.sendanonymoususage"
          - "--entrypoints.mc.address=:25565/tcp"
          - "--entrypoints.metrics.address=:9100/tcp"
          - "--entrypoints.stdiscovery.address=:21027/udp"
          - "--entrypoints.sttcp.address=:22000/tcp"
          - "--entrypoints.studp.address=:22000/udp"
          - "--entrypoints.traefik.address=:9000/tcp"
          - "--entrypoints.web.address=:8000/tcp"
          - "--entrypoints.websecure.address=:8443/tcp"
          - "--api.dashboard=true"
          - "--ping=true"
          - "--metrics.prometheus=true"
          - "--metrics.prometheus.entrypoint=metrics"
          - "--metrics.prometheus.addRoutersLabels=true"
          - "--metrics.prometheus.addEntryPointsLabels=false"
          - "--metrics.prometheus.addServicesLabels=false"
          - "--metrics.prometheus.buckets=0.5,1.0,2.5"
          - "--metrics.prometheus.manualrouting=true"
          - "--providers.kubernetescrd"
          - "--providers.kubernetescrd.allowCrossNamespace=true"
          - "--providers.kubernetesingress"
          - "--providers.kubernetesingress.ingressendpoint.publishedservice=kube-system/traefik"
          - "--entrypoints.web.forwardedHeaders.insecure"
          - "--entrypoints.web.proxyProtocol.insecure"
          - "--entrypoints.websecure.http.tls=true"
          - "--entrypoints.websecure.forwardedHeaders.insecure"
          - "--entrypoints.websecure.proxyProtocol.insecure"
          - "--certificatesresolvers.myresolver.acme.email=valentin.ronteix@ashudev.com"
          - "--certificatesresolvers.myresolver.acme.storage=/data/acme.json"
          - "--certificatesresolvers.myresolver.acme.tlsChallenge=true"
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-traefik-nfs
        - name: tmp
          emptyDir: {}
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
      nodeSelector:
        kubernetes.io/hostname: streaming
      priorityClassName: system-cluster-critical
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532

