# CoreDNS imports two globs from this directory on every start and reload:
#
#   import /etc/coredns/custom/*.override
#   import /etc/coredns/custom/*.server
#
# K3s writes those two lines into the Corefile itself and mounts this ConfigMap
# as an optional volume, so with no ConfigMap the globs match nothing and CoreDNS
# logs two [WARNING]s per reload on every server node — 6,152 lines in the 24 h
# to 2026-11-22. The Corefile is K3s's: editing it by hand is undone at the next
# start, and there is no setting that drops the two imports.
#
# Two comment-only files satisfy the globs and change no resolution. A `.server`
# file is a server block and a `.override` file is imported into the default
# block, ahead of the packaged `forward .`; a stanza for a zone more specific
# than `.` wins there, and a comment on its own satisfies the glob.
#
# Applied by hand, like everything else under cluster/infrastructure:
#
#   kubectl apply -f cluster/infrastructure/coredns/custom.yaml
#   kubectl -n kube-system rollout restart deploy/coredns
#
# The restart is what makes CoreDNS re-read the globs. Creating the ConfigMap
# alone only populates the mounted directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
  labels:
    k8s-app: kube-dns
data:
  empty.server: |
    # Intentionally empty: this file exists so `import .../*.server` matches.
  empty.override: |
    # Intentionally empty: this file exists so `import .../*.override` matches.
  kub-local.override: |
    # The only CoreDNS pod runs on `nuc0` with `dnsPolicy: Default`, so it
    # inherits that node's `/etc/resolv.conf` and `forward .` treats every
    # nameserver in it as a peer. That file held `1.1.1.1` beside the Pi-hole on
    # 2026-11-26; `1.1.1.1` answers `*.kub.local` with NXDOMAIN, so one query in
    # three failed and `cache 30` kept the answer.
    #
    # The wildcard is answered by the two edge Pis and by nothing else. A
    # `forward` for the zone, imported ahead of the packaged `forward .`, sends
    # those queries to them and leaves every other name on the node's list.
    # CoreDNS chains `forward` stanzas in file order, so this one is consulted
    # before the catch-all — which is why the fix lives here: the Corefile is
    # K3s's and is rewritten at every start.
    #
    # `kub.internal` is the zone every route serves from 2026-11-27, and a
    # public resolver in the node's list answers it with NXDOMAIN just as it did
    # for `kub.local`.
    forward kub.local 192.168.1.22 192.168.1.38
    forward kub.internal 192.168.1.22 192.168.1.38
